// Draw functions  
function drawStars() {  
    for (let s of stars) {  
        s.y += s.speed * (s.layer + 1) * 0.5 * (timeSlowActive ? 0.3 : 1)
        if (s.y > GAME_HEIGHT) {  
            s.y = 0  
            s.x = Math.random() * GAME_WIDTH  
        }  
        ctx.fillStyle = s.color  
        ctx.globalAlpha = s.brightness
        ctx.fillRect(s.x, s.y, s.size, s.size)  
    }  
    ctx.globalAlpha = 1
}  

function drawAsteroids() {
    for (let i = asteroids.length - 1; i >= 0; i--) {
        let a = asteroids[i]
        
        // Movement
        a.x += a.speedX * (timeSlowActive ? 0.3 : 1)
        a.y += a.speedY * (timeSlowActive ? 0.3 : 1)
        a.angle += a.rotationSpeed
        
        // Wrap around
        if (a.y > GAME_HEIGHT + 50) {
            a.y = -50
            a.x = Math.random() * GAME_WIDTH
        }
        if (a.x < -50) a.x = GAME_WIDTH + 50
        if (a.x > GAME_WIDTH + 50) a.x = -50
        
        // Draw asteroid
        ctx.save()
        ctx.translate(a.x, a.y)
        ctx.rotate(a.angle)
        
        // Cratered look
        ctx.fillStyle = a.color
        ctx.shadowColor = '#aa8866'
        ctx.shadowBlur = 10
        ctx.beginPath()
        for (let j = 0; j < 8; j++) {
            let angle = (j / 8) * Math.PI * 2
            let radius = a.radius + Math.sin(angle * 3) * 5
            let x = Math.cos(angle) * radius
            let y = Math.sin(angle) * radius
            if (j === 0) ctx.moveTo(x, y)
            else ctx.lineTo(x, y)
        }
        ctx.closePath()
        ctx.fill()
        
        // Craters
        ctx.shadowBlur = 0
        ctx.fillStyle = '#664422'
        for (let j = 0; j < 3; j++) {
            let craterX = Math.cos(j * 2.1) * (a.radius * 0.3)
            let craterY = Math.sin(j * 1.8) * (a.radius * 0.3)
            ctx.beginPath()
            ctx.arc(craterX, craterY, a.radius * 0.2, 0, Math.PI * 2)
            ctx.fill()
        }
        
        // Health indicator for large asteroids
        if (a.health < a.maxHealth) {
            ctx.fillStyle = '#ff0000'
            ctx.fillRect(-a.radius, -a.radius - 10, a.radius * 2 * (a.health / a.maxHealth), 3)
        }
        
        ctx.restore()
    }
}

function drawWormholes() {
    for (let i = wormholes.length - 1; i >= 0; i--) {
        let w = wormholes[i]
        w.life--
        
        ctx.save()
        ctx.translate(w.x, w.y)
        
        // Rotating effect
        ctx.rotate(Date.now() / 500)
        
        // Outer ring
        ctx.strokeStyle = w.color
        ctx.lineWidth = 3
        ctx.setLineDash([10, 10])
        ctx.beginPath()
        ctx.arc(0, 0, w.radius, 0, Math.PI * 2)
        ctx.stroke()
        
        // Inner swirl
        for (let j = 0; j < 4; j++) {
            let angle = (j / 4) * Math.PI * 2 + Date.now() / 1000
            ctx.beginPath()
            ctx.arc(
                Math.cos(angle) * w.radius * 0.5,
                Math.sin(angle) * w.radius * 0.5,
                10,
                0, Math.PI * 2
            )
            ctx.fillStyle = w.color
            ctx.globalAlpha = 0.5
            ctx.fill()
        }
        
        ctx.restore()
        
        // Teleport player
        w.teleportTimer++
        if (w.teleportTimer > 100) {
            w.teleportTimer = 0
            let dx = player.x + 20 - w.x
            let dy = player.y + 20 - w.y
            let dist = Math.sqrt(dx * dx + dy * dy)
            
            if (dist < w.radius + 30) {
                // Teleport player to other end
                player.x = w.targetX - 20
                player.y = w.targetY - 20
                
                // Particles
                for (let j = 0; j < 20; j++) {
                    particles.push({
                        x: w.x,
                        y: w.y,
                        vx: (Math.random() - 0.5) * 10,
                        vy: (Math.random() - 0.5) * 10,
                        life: 20,
                        size: 5,
                        color: w.color
                    })
                }
            }
        }
        
        if (w.life <= 0) wormholes.splice(i, 1)
    }
}

function drawForceField() {
    if (!forceField) return
    
    forceField.life--
    
    ctx.save()
    ctx.translate(forceField.x, forceField.y)
    
    // Shield effect
    ctx.strokeStyle = '#00aaff'
    ctx.lineWidth = 3
    ctx.setLineDash([10, 5])
    ctx.beginPath()
    ctx.arc(0, 0, forceField.radius, 0, Math.PI * 2)
    ctx.stroke()
    
    // Inner glow
    ctx.setLineDash([])
    ctx.strokeStyle = '#ffffff'
    ctx.lineWidth = 1
    ctx.beginPath()
    ctx.arc(0, 0, forceField.radius - 2, 0, Math.PI * 2)
    ctx.stroke()
    
    // Particles
    for (let i = 0; i < 5; i++) {
        let angle = Math.random() * Math.PI * 2
        let x = Math.cos(angle) * forceField.radius
        let y = Math.sin(angle) * forceField.radius
        ctx.fillStyle = '#00aaff'
        ctx.globalAlpha = Math.random() * 0.5
        ctx.beginPath()
        ctx.arc(x, y, 2, 0, Math.PI * 2)
        ctx.fill()
    }
    
    ctx.restore()
    
    // Damage enemies
    for (let e of enemies) {
        let dx = e.x + e.w/2 - forceField.x
        let dy = e.y + e.h/2 - forceField.y
        let dist = Math.sqrt(dx * dx + dy * dy)
        
        if (dist < forceField.radius) {
            e.hp -= forceField.damage
            explosions.push({ x: e.x + e.w/2, y: e.y + e.h/2, size: 2 })
        }
    }
    
    if (forceField.life <= 0) forceField = null
}

function drawPlayer() {  
    ctx.save()  
    ctx.translate(player.x + 20, player.y + 20)  
    
    // Phase shift effect  
    if (player.powerups.phaseShift || player.phaseShiftActive) {  
        ctx.globalAlpha = 0.5  
        ctx.shadowColor = '#aa00aa'  
        ctx.shadowBlur = 30  
    }  
    
    // Shield effect  
    if (player.powerups.shield) {  
        ctx.beginPath()  
        ctx.arc(0, 0, 30, 0, Math.PI * 2)  
        ctx.strokeStyle = '#00ffff'  
        ctx.lineWidth = 3  
        ctx.setLineDash([5, 5])  
        ctx.stroke()  
        ctx.setLineDash([])  
    }  
    
    // Level indicator with bullet count
    let bulletCount = 1 + Math.floor(player.level / 2)
    ctx.fillStyle = '#fff'  
    ctx.font = 'bold 12px Arial'  
    ctx.shadowColor = '#00ffff'
    ctx.shadowBlur = 10
    ctx.fillText(`Lvl ${player.level}`, -15, -35)  
    ctx.font = '10px Arial'  
    ctx.fillText(`${bulletCount}🔫`, -12, -20)  
    
    // Wings  
    ctx.fillStyle = "#00e5ff"  
    ctx.beginPath()  
    ctx.moveTo(-20, 10)  
    ctx.lineTo(-5, -15)  
    ctx.lineTo(-5, 15)  
    ctx.fill()  
    ctx.beginPath()  
    ctx.moveTo(20, 10)  
    ctx.lineTo(5, -15)  
    ctx.lineTo(5, 15)  
    ctx.fill()  
    
    // Body - color based on active powerups and level
    let bodyColor = '#0ff'  
    if (player.powerups.rapidFire) bodyColor = '#ff00ff'  
    if (player.powerups.laserBeam) bodyColor = '#ff00aa'  
    if (player.powerups.timeSlow) bodyColor = '#00aaff'  
    if (player.powerups.vampire) bodyColor = '#880000'  
    if (player.powerups.phaseShift) bodyColor = '#aa00aa'  
    
    // Add level-based glow
    let levelGlow = Math.min(player.level * 0.1, 0.5)
    ctx.shadowColor = bodyColor
    ctx.shadowBlur = 10 + levelGlow * 20
    
    ctx.fillStyle = bodyColor  
    ctx.beginPath()  
    ctx.moveTo(0, -20)  
    ctx.lineTo(10, 10)  
    ctx.lineTo(-10, 10)  
    ctx.closePath()  
    ctx.fill()  
    
    // Cockpit  
    ctx.fillStyle = "blue"  
    ctx.beginPath()  
    ctx.arc(0, -5, 5, 0, Math.PI * 2)  
    ctx.fill()  
    
    // Engine glow  
    ctx.fillStyle = "orange"  
    ctx.beginPath()  
    ctx.moveTo(-6, 10)  
    ctx.lineTo(0, 20 + (firing ? 15 : 5))  
    ctx.lineTo(6, 10)  
    ctx.fill()  
    
    // Drones  
    for (let i = 0; i < player.drones.length; i++) {  
        let drone = player.drones[i]  
        let angle = Date.now() / 500 + (i * Math.PI * 2 / player.drones.length)  
        drone.x = Math.cos(angle) * 30  
        drone.y = Math.sin(angle) * 30  
        
        ctx.fillStyle = '#00aa00'  
        ctx.shadowColor = '#00ff00'  
        ctx.shadowBlur = 10  
        ctx.beginPath()  
        ctx.arc(drone.x, drone.y, 5, 0, Math.PI * 2)  
        ctx.fill()  
        
        // Drone weapon  
        ctx.fillStyle = '#ffff00'  
        ctx.beginPath()  
        ctx.arc(drone.x + Math.cos(angle) * 10, drone.y + Math.sin(angle) * 10, 2, 0, Math.PI * 2)  
        ctx.fill()  
    }  
    
    // Satellites  
    for (let s of satellites) {  
        s.angle += s.speed  
        s.x = Math.cos(s.angle) * s.distance  
        s.y = Math.sin(s.angle) * s.distance  
        
        ctx.fillStyle = '#aa44ff'  
        ctx.shadowColor = '#ff00ff'  
        ctx.shadowBlur = 15  
        ctx.beginPath()  
        ctx.arc(s.x, s.y, 5, 0, Math.PI * 2)  
        ctx.fill()  
    }  
    
    ctx.restore()  
    ctx.shadowBlur = 0  
    ctx.globalAlpha = 1  
}  

function drawBullets() {  
    for (let i = bullets.length - 1; i >= 0; i--) {  
        let b = bullets[i]  
        
        // Time slow effect  
        let speedMultiplier = timeSlowActive ? 0.3 : 1  
        b.y -= b.speed * speedMultiplier  
        
        // Chain lightning effect
        if (player.powerups.chainLightning && Math.random() < 0.1) {
            chainLightning.push({
                x: b.x,
                y: b.y,
                target: null,
                damage: b.damage * 0.5,
                chains: 3,
                critical: b.critical
            })
        }
        
        // Different bullet colors based on level
        if (b.fromLevel) {
            // Color shifts with level
            let hue = (b.fromLevel * 20) % 360
            ctx.fillStyle = `hsl(${hue}, 100%, 50%)`  
            ctx.shadowColor = `hsl(${hue}, 100%, 50%)`  
        } else if (b.critical) {  
            ctx.fillStyle = "#ffaa00"  
            ctx.shadowColor = '#ffaa00'  
        } else {  
            ctx.fillStyle = "yellow"  
            ctx.shadowColor = 'yellow'  
        }  
        
        ctx.shadowBlur = 10  
        ctx.fillRect(b.x - (b.fromLevel ? 2 : 0), b.y - 2, 4 + (b.fromLevel ? 2 : 0), 12)  
        
        if (b.y < 0) bullets.splice(i, 1)  
    }  
    ctx.shadowBlur = 0  
}  

function drawChainLightning() {
    for (let i = chainLightning.length - 1; i >= 0; i--) {
        let c = chainLightning[i]
        
        if (!c.target || c.target.hp <= 0) {
            // Find nearest enemy
            let minDist = Infinity
            for (let e of enemies) {
                let dist = Math.sqrt((e.x + e.w/2 - c.x) ** 2 + (e.y + e.h/2 - c.y) ** 2)
                if (dist < minDist) {
                    minDist = dist
                    c.target = e
                }
            }
        }
        
        if (c.target) {
            // Draw lightning
            ctx.beginPath()
            ctx.moveTo(c.x, c.y)
            
            let midX = (c.x + c.target.x + c.target.w/2) / 2 + (Math.random() - 0.5) * 20
            let midY = (c.y + c.target.y + c.target.h/2) / 2 + (Math.random() - 0.5) * 20
            
            ctx.quadraticCurveTo(midX, midY, c.target.x + c.target.w/2, c.target.y + c.target.h/2)
            ctx.strokeStyle = c.critical ? '#ffff00' : '#00ffff'
            ctx.lineWidth = 3
            ctx.shadowColor = '#00ffff'
            ctx.shadowBlur = 10
            ctx.stroke()
            
            // Damage target
            c.target.hp -= c.damage
            c.chains--
            
            explosions.push({
                x: c.target.x + c.target.w/2,
                y: c.target.y + c.target.h/2,
                size: 2
            })
        }
        
        if (c.chains <= 0) chainLightning.splice(i, 1)
    }
    ctx.shadowBlur = 0
}

function drawMissiles() {  
    for (let i = missiles.length - 1; i >= 0; i--) {  
        let m = missiles[i]  
        
        // Time slow effect  
        let speedMultiplier = timeSlowActive ? 0.3 : 1  
        
        // Find nearest enemy  
        if ((!m.target || !enemies.includes(m.target)) && m.homing) {  
            let minDist = Infinity  
            for (let e of enemies) {  
                let dist = Math.sqrt((e.x + e.w/2 - m.x) ** 2 + (e.y + e.h/2 - m.y) ** 2)  
                if (dist < minDist) {  
                    minDist = dist  
                    m.target = e  
                }  
            }  
        }  
        
        if (m.target && m.homing) {  
            let dx = (m.target.x + m.target.w/2) - m.x  
            let dy = (m.target.y + m.target.h/2) - m.y  
            let dist = Math.sqrt(dx * dx + dy * dy)  
            
            if (dist > 5) {  
                m.x += (dx / dist) * m.speed * speedMultiplier  
                m.y += (dy / dist) * m.speed * speedMultiplier  
            }  
        } else {  
            m.y -= m.speed * speedMultiplier  
        }  
        
        // Draw missile  
        ctx.save()  
        ctx.translate(m.x, m.y)  
        ctx.rotate(Math.atan2(-m.speed * speedMultiplier, 0))  
        
        // Missile body
        ctx.fillStyle = m.critical ? "#ffaa00" : "#ff8800"  
        ctx.shadowColor = '#ff8800'  
        ctx.shadowBlur = 10  
        ctx.fillRect(-2, -5, 4, 10)  
        
        // Missile head
        ctx.fillStyle = "#ffaa00"  
        ctx.fillRect(-1, -8, 2, 5)  
        
        // Exhaust
        ctx.fillStyle = "#ff4400"  
        ctx.fillRect(-1, 5, 2, 5)  
        
        ctx.restore()  
        
        if (m.y < -20 || m.y > GAME_HEIGHT + 20 || m.x < -20 || m.x > GAME_WIDTH + 20) missiles.splice(i, 1)  
    }  
    ctx.shadowBlur = 0  
}  

function drawLaserBeams() {  
    for (let i = laserBeams.length - 1; i >= 0; i--) {  
        let l = laserBeams[i]  
        l.life--  
        
        ctx.save()  
        ctx.translate(l.x, l.y)  
        ctx.rotate(l.angle)  
        
        // Laser effect  
        ctx.fillStyle = l.critical ? `rgba(255, 255, 0, ${l.life / 20})` : `rgba(255, 0, 255, ${l.life / 20})`  
        ctx.shadowColor = l.critical ? '#ffff00' : '#ff00ff'  
        ctx.shadowBlur = 20  
        ctx.fillRect(-l.width/2, 0, l.width, -l.length)  
        
        ctx.restore()  
        
        if (l.life <= 0) laserBeams.splice(i, 1)  
    }  
}

function drawBlackHoles() {  
    for (let i = blackHoles.length - 1; i >= 0; i--) {  
        let bh = blackHoles[i]  
        bh.life--  
        bh.radius = Math.min(bh.radius + 0.3, bh.maxRadius)  
        bh.damageTimer++
        
        // Draw black hole  
        ctx.save()  
        ctx.translate(bh.x, bh.y)  
        
        // Event horizon  
        let gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, bh.radius)  
        gradient.addColorStop(0, 'black')  
        gradient.addColorStop(0.5, '#aa00aa')  
        gradient.addColorStop(1, 'transparent')  
        
        ctx.fillStyle = gradient  
        ctx.beginPath()  
        ctx.arc(0, 0, bh.radius, 0, Math.PI * 2)  
        ctx.fill()  
        
        // Accretion disk  
        ctx.strokeStyle = '#ff00ff'  
        ctx.lineWidth = 2  
        ctx.setLineDash([10, 10])  
        ctx.beginPath()  
        ctx.arc(0, 0, bh.radius * 0.8, 0, Math.PI * 2)  
        ctx.stroke()  
        
        // Particles being pulled in
        for (let j = 0; j < 5; j++) {
            let angle = (j / 5) * Math.PI * 2 + Date.now() / 300
            let dist = bh.radius * 0.7 + Math.sin(Date.now() / 100 + j) * 10
            let x = Math.cos(angle) * dist
            let y = Math.sin(angle) * dist
            ctx.fillStyle = '#ffffff'
            ctx.globalAlpha = 0.5
            ctx.beginPath()
            ctx.arc(x, y, 2, 0, Math.PI * 2)
            ctx.fill()
        }
        
        ctx.restore()  
        
        // Pull enemies  
        for (let e of enemies) {  
            let dx = e.x + e.w/2 - bh.x  
            let dy = e.y + e.h/2 - bh.y  
            let dist = Math.sqrt(dx * dx + dy * dy)  
            
            if (dist < bh.radius * 2) {  
                e.x += (dx / dist) * bh.pullSpeed  
                e.y += (dy / dist) * bh.pullSpeed  
                
                // Damage enemies at center
                if (dist < bh.radius && bh.damageTimer > 10) {
                    e.hp -= bh.damage
                    explosions.push({ x: e.x + e.w/2, y: e.y + e.h/2, size: 2 })
                    bh.damageTimer = 0
                }
            }  
        }  
        
        // Pull player  
        if (!player.powerups.phaseShift && !player.phaseShiftActive) {
            let dx = player.x + 20 - bh.x  
            let dy = player.y + 20 - bh.y  
            let dist = Math.sqrt(dx * dx + dy * dy)  
            
            if (dist < bh.radius * 2) {  
                player.x += (dx / dist) * bh.pullSpeed  
                player.y += (dy / dist) * bh.pullSpeed  
            }  
        }
        
        if (bh.life <= 0) blackHoles.splice(i, 1)  
    }  
    ctx.globalAlpha = 1
    ctx.setLineDash([])
}

function drawMines() {  
    for (let i = mines.length - 1; i >= 0; i--) {  
        let m = mines[i]  
        m.y += 1 * (timeSlowActive ? 0.3 : 1)  
        m.armTime--  
        
        // Draw mine
        ctx.save()
        ctx.translate(m.x, m.y)
        
        // Proximity indicator
        if (m.armTime <= 0) {
            ctx.strokeStyle = '#ff0000'
            ctx.lineWidth = 1
            ctx.setLineDash([5, 5])
            ctx.beginPath()
            ctx.arc(0, 0, m.proximityRadius, 0, Math.PI * 2)
            ctx.stroke()
        }
        
        // Mine body
        ctx.fillStyle = m.armTime > 0 ? '#ffaa00' : '#ff0000'  
        ctx.shadowColor = m.armTime > 0 ? '#ffaa00' : '#ff0000'  
        ctx.shadowBlur = 15
        ctx.beginPath()  
        ctx.arc(0, 0, m.radius, 0, Math.PI * 2)  
        ctx.fill()  
        
        // Skull symbol
        ctx.fillStyle = '#ffff00'  
        ctx.font = '12px Arial'  
        ctx.shadowBlur = 0
        ctx.fillText('💣', -8, 4)  
        
        ctx.restore()
        
        if (m.y > GAME_HEIGHT + 20) mines.splice(i, 1)  
    }  
    ctx.setLineDash([])
}

function drawEnemyBullets() {  
    for (let i = enemyBullets.length - 1; i >= 0; i--) {  
        let b = enemyBullets[i]  
        
        // Time slow effect  
        let speedMultiplier = timeSlowActive ? 0.3 : 1  
        
        if (b.vx !== undefined) {  
            b.x += b.vx * speedMultiplier  
            b.y += b.vy * speedMultiplier  
        } else {  
            if (b.pattern === 'homing') {  
                let dx = player.x + 20 - b.x  
                let dy = player.y + 20 - b.y  
                let dist = Math.sqrt(dx * dx + dy * dy)  
                if (dist > 5) {  
                    b.x += (dx / dist) * b.speed * 0.5 * speedMultiplier  
                    b.y += (dy / dist) * b.speed * 0.5 * speedMultiplier  
                }  
            } else if (b.pattern === 'wave') {  
                b.wavePhase += 0.1  
                b.x += Math.sin(b.wavePhase) * 2 * speedMultiplier  
                b.y += b.speed * speedMultiplier  
            } else {  
                b.y += b.speed * speedMultiplier  
            }  
        }  
        
        // Draw bullet based on pattern  
        ctx.globalAlpha = b.invisible || 1
        if (b.pattern === 'spread') {  
            ctx.fillStyle = "#ff00ff"  
            ctx.shadowColor = '#ff00ff'  
            ctx.fillRect(b.x, b.y, 6, 12)  
        } else if (b.pattern === 'aimed') {  
            ctx.fillStyle = "#ffaa00"  
            ctx.shadowColor = '#ffaa00'  
            ctx.fillRect(b.x, b.y, 5, 10)  
        } else if (b.pattern === 'wave') {  
            ctx.fillStyle = "#00aaff"  
            ctx.shadowColor = '#00aaff'  
            ctx.fillRect(b.x, b.y, 5, 8)  
        } else {  
            ctx.fillStyle = "red"  
            ctx.shadowColor = 'red'  
            ctx.fillRect(b.x, b.y, 4, 10)  
        }  
        
        if (b.y > GAME_HEIGHT + 20 || b.y < -20 || b.x < -20 || b.x > GAME_WIDTH + 20) {  
            enemyBullets.splice(i, 1)  
        }  
    }  
    ctx.globalAlpha = 1
    ctx.shadowBlur = 0  
}  

// REDESIGNED ENEMY DRAW FUNCTION - REALISTIC SPACESHIPS
function drawEnemies() {  
    for (let e of enemies) {  
        // Update engine glow
        e.engineGlow = (e.engineGlow + 0.1) % (Math.PI * 2)
        
        // Update wing angle for some ships
        if (e.type === 'fast') {
            e.wingAngle = Math.sin(Date.now() / 200) * 0.1
        }
        
        // Healer logic
        if (e.type === 'healer') {
            e.healTimer++
            if (e.healTimer > 100) {
                e.healTimer = 0
                for (let other of enemies) {
                    if (other !== e && other.hp < other.maxHp) {
                        other.hp = Math.min(other.hp + 1, other.maxHp)
                        break
                    }
                }
            }
        }
        
        // Movement patterns  
        if (e.pattern === 1) {  
            // Sine wave movement  
            e.x += Math.sin(Date.now() / 200 + e.y) * 2  
        } else if (e.pattern === 2) {  
            // Circle movement  
            e.angle += 0.02  
            e.x += Math.cos(e.angle) * 2  
        } else if (e.pattern === 3) {  
            // Zigzag  
            e.x += Math.sin(Date.now() / 100) * 3  
        }  
        
        // Time slow effect  
        let speedMultiplier = timeSlowActive ? 0.3 : 1  
        e.y += e.speed * speedMultiplier  
        e.x = Math.max(0, Math.min(GAME_WIDTH - e.w, e.x))  
        
        // Shield regeneration  
        if (e.shield > 0 && e.shieldRegen > 0) {  
            e.shield = Math.min(e.shield + e.shieldRegen, e.maxHp)  
        }  
        
        // Stealth effect
        if (e.type === 'stealth') {
            e.stealthAlpha = 0.3 + Math.sin(Date.now() / 500) * 0.2
        }
        
        ctx.save()
        ctx.translate(e.x + e.w/2, e.y + e.h/2)
        ctx.globalAlpha = e.stealthAlpha || 1
        
        // Draw ship based on design
        if (e.design === 0) { // Standard Fighter
            // Main body
            ctx.fillStyle = e.color || '#0f0'
            ctx.shadowColor = e.color || '#0f0'
            ctx.shadowBlur = 10
            ctx.beginPath()
            ctx.moveTo(0, -15)
            ctx.lineTo(10, 10)
            ctx.lineTo(5, 15)
            ctx.lineTo(0, 10)
            ctx.lineTo(-5, 15)
            ctx.lineTo(-10, 10)
            ctx.closePath()
            ctx.fill()
            
            // Cockpit
            ctx.fillStyle = '#00ffff'
            ctx.shadowBlur = 5
            ctx.beginPath()
            ctx.arc(0, -8, 4, 0, Math.PI * 2)
            ctx.fill()
            
            // Wings
            ctx.fillStyle = e.color || '#0f0'
            ctx.fillRect(-15, -5, 5, 15)
            ctx.fillRect(10, -5, 5, 15)
            
            // Engine glow
            let glowIntensity = Math.sin(e.engineGlow) * 0.5 + 0.5
            ctx.fillStyle = `rgba(255, 100, 0, ${glowIntensity})`
            ctx.fillRect(-3, 10, 6, 8)
            
        } else if (e.design === 1) { // Interceptor (Fast)
            // Sleek body
            ctx.fillStyle = e.color || '#ffaa00'
            ctx.shadowColor = e.color || '#ffaa00'
            ctx.beginPath()
            ctx.moveTo(0, -18)
            ctx.lineTo(12, 12)
            ctx.lineTo(8, 15)
            ctx.lineTo(0, 10)
            ctx.lineTo(-8, 15)
            ctx.lineTo(-12, 12)
            ctx.closePath()
            ctx.fill()
            
            // Forward swept wings
            ctx.fillStyle = e.color || '#ffaa00'
            ctx.save()
            ctx.rotate(e.wingAngle)
            ctx.fillRect(-20, -8, 6, 20)
            ctx.fillRect(14, -8, 6, 20)
            ctx.restore()
            
            // Dual cockpits
            ctx.fillStyle = '#00ffff'
            ctx.beginPath()
            ctx.arc(-3, -10, 3, 0, Math.PI * 2)
            ctx.fill()
            ctx.beginPath()
            ctx.arc(3, -10, 3, 0, Math.PI * 2)
            ctx.fill()
            
            // Afterburner effect
            ctx.fillStyle = `rgba(255, 200, 0, ${Math.random() * 0.8 + 0.2})`
            ctx.fillRect(-4, 12, 8, 12)
            
        } else if (e.design === 2) { // Heavy Cruiser (Elite)
            // Main hull
            ctx.fillStyle = e.color || '#ff5555'
            ctx.shadowColor = e.color || '#ff5555'
            ctx.fillRect(-15, -12, 30, 24)
            
            // Bridge
            ctx.fillStyle = '#aaa'
            ctx.fillRect(-6, -18, 12, 8)
            ctx.fillStyle = '#00ffff'
            ctx.fillRect(-3, -20, 6, 4)
            
            // Side turrets
            ctx.fillStyle = '#888'
            ctx.fillRect(-22, -5, 8, 10)
            ctx.fillRect(14, -5, 8, 10)
            
            // Main cannons
            ctx.fillStyle = '#666'
            ctx.fillRect(-10, -25, 4, 15)
            ctx.fillRect(6, -25, 4, 15)
            
            // Engine array
            for (let i = -8; i <= 8; i += 4) {
                ctx.fillStyle = `rgba(255, 100, 0, ${Math.sin(e.engineGlow + i) * 0.5 + 0.5})`
                ctx.fillRect(i, 12, 2, 8)
            }
            
        } else if (e.design === 3) { // Shielded Frigate
            // Main body with shield generator rings
            ctx.fillStyle = e.color || '#00aaff'
            ctx.shadowColor = e.color || '#00aaff'
            ctx.beginPath()
            ctx.ellipse(0, 0, 18, 12, 0, 0, Math.PI * 2)
            ctx.fill()
            
            // Shield generator rings
            ctx.strokeStyle = '#00ffff'
            ctx.lineWidth = 2
            ctx.setLineDash([5, 5])
            ctx.beginPath()
            ctx.ellipse(0, 0, 22, 16, 0, 0, Math.PI * 2)
            ctx.stroke()
            ctx.setLineDash([])
            
            // Command pod
            ctx.fillStyle = '#fff'
            ctx.beginPath()
            ctx.arc(0, -8, 6, 0, Math.PI * 2)
            ctx.fill()
            ctx.fillStyle = '#00aaff'
            ctx.beginPath()
            ctx.arc(0, -8, 4, 0, Math.PI * 2)
            ctx.fill()
            
            // Shield emitters
            for (let i = 0; i < 4; i++) {
                let angle = (i / 4) * Math.PI * 2
                ctx.fillStyle = '#00ffff'
                ctx.beginPath()
                ctx.arc(Math.cos(angle) * 20, Math.sin(angle) * 14, 3, 0, Math.PI * 2)
                ctx.fill()
            }
            
            // Engine glow
            ctx.fillStyle = `rgba(0, 255, 255, ${Math.sin(e.engineGlow) * 0.5 + 0.5})`
            ctx.fillRect(-6, 8, 12, 6)
            
        } else if (e.design === 4) { // Kamikaze Drone
            // Small, aggressive design
            ctx.fillStyle = e.color || '#ff4400'
            ctx.shadowColor = e.color || '#ff4400'
            ctx.beginPath()
            ctx.moveTo(0, -10)
            ctx.lineTo(12, 8)
            ctx.lineTo(8, 12)
            ctx.lineTo(0, 4)
            ctx.lineTo(-8, 12)
            ctx.lineTo(-12, 8)
            ctx.closePath()
            ctx.fill()
            
            // Warhead (glowing)
            ctx.fillStyle = `rgba(255, 255, 0, ${Math.sin(e.engineGlow * 2) * 0.7 + 0.3})`
            ctx.beginPath()
            ctx.arc(0, 0, 6, 0, Math.PI * 2)
            ctx.fill()
            
            // Small wings
            ctx.fillStyle = e.color || '#ff4400'
            ctx.fillRect(-16, -2, 6, 4)
            ctx.fillRect(10, -2, 6, 4)
            
            // Suicide burn
            ctx.fillStyle = `rgba(255, 100, 0, ${Math.random() * 0.9 + 0.1})`
            ctx.fillRect(-4, 8, 8, 10)
            
        } else if (e.design === 5) { // Stealth Fighter
            // Angular design
            ctx.fillStyle = e.color || '#aa00aa'
            ctx.shadowColor = e.color || '#aa00aa'
            ctx.beginPath()
            ctx.moveTo(0, -20)
            ctx.lineTo(15, 0)
            ctx.lineTo(10, 15)
            ctx.lineTo(0, 10)
            ctx.lineTo(-10, 15)
            ctx.lineTo(-15, 0)
            ctx.closePath()
            ctx.fill()
            
            // Glowing edges
            ctx.strokeStyle = '#ff00ff'
            ctx.lineWidth = 1
            ctx.stroke()
            
        } else if (e.design === 6) { // Healer
            // Rounded design with cross
            ctx.fillStyle = e.color || '#00ff88'
            ctx.shadowColor = e.color || '#00ff88'
            ctx.beginPath()
            ctx.ellipse(0, 0, 15, 10, 0, 0, Math.PI * 2)
            ctx.fill()
            
            // Healing cross
            ctx.fillStyle = '#ffffff'
            ctx.fillRect(-3, -8, 6, 16)
            ctx.fillRect(-8, -3, 16, 6)
            
            // Healing pulse
            if (e.healTimer > 50) {
                ctx.strokeStyle = '#ffffff'
                ctx.lineWidth = 2
                ctx.beginPath()
                ctx.arc(0, 0, 20 + Math.sin(Date.now() / 100) * 5, 0, Math.PI * 2)
                ctx.stroke()
            }
        }
        
        ctx.restore()
        
        // Show HP for stronger enemies  
        if (e.hp > 1) {  
            ctx.fillStyle = "white"  
            ctx.font = "12px Arial"  
            ctx.shadowBlur = 0
            ctx.fillText(e.hp, e.x + e.w/2 - 5, e.y - 5)  
        }  
        
        // Show shield  
        if (e.shield > 0) {  
            ctx.fillStyle = "rgba(0, 170, 255, 0.5)"  
            ctx.font = "10px Arial"  
            ctx.fillText('🛡️' + Math.floor(e.shield), e.x + e.w/2 - 10, e.y - 15)  
        }  
    }  
    
    enemies = enemies.filter(e => e.y <= GAME_HEIGHT + 20)  
    ctx.shadowBlur = 0
}  

function drawBoss() {  
    if (!boss) return  
    
    ctx.save()  
    ctx.translate(boss.x + boss.w/2, boss.y + boss.h/2)  
    
    // Rotating effect  
    ctx.rotate(Date.now() / 1000)  
    
    // Rage mode effects
    if (boss.rageMode) {
        ctx.shadowColor = '#ff0000'
        ctx.shadowBlur = 50
    }
    
    // Boss body  
    ctx.fillStyle = boss.rageMode ? '#ff8800' : '#ff0000'  
    ctx.shadowColor = boss.rageMode ? '#ff8800' : '#ff0000'  
    ctx.shadowBlur = 30  
    ctx.beginPath()  
    ctx.moveTo(0, -50)  
    ctx.lineTo(40, 30)  
    ctx.lineTo(20, 50)  
    ctx.lineTo(-20, 50)  
    ctx.lineTo(-40, 30)  
    ctx.closePath()  
    ctx.fill()  
    
    // Eyes based on phase and rage mode
    ctx.shadowBlur = 0  
    ctx.fillStyle = 'white'  
    ctx.beginPath()  
    ctx.arc(-15, -20, 8, 0, Math.PI * 2)  
    ctx.fill()  
    ctx.beginPath()  
    ctx.arc(15, -20, 8, 0, Math.PI * 2)  
    ctx.fill()  
    
    ctx.fillStyle = boss.rageMode ? 'red' : 'black'  
    ctx.beginPath()  
    ctx.arc(-15 + (boss.phase === 3 ? 2 : 0), -20, 4, 0, Math.PI * 2)  
    ctx.fill()  
    ctx.beginPath()  
    ctx.arc(15 + (boss.phase === 3 ? -2 : 0), -20, 4, 0, Math.PI * 2)  
    ctx.fill()  
    
    // Phase indicator  
    ctx.fillStyle = '#fff'  
    ctx.font = '14px Arial'  
    ctx.fillText(`PHASE ${boss.phase}${boss.rageMode ? ' RAGE' : ''}`, -35, -70)  
    
    ctx.restore()  
}  

function drawPowerups() {  
    for (let i = powerups.length - 1; i >= 0; i--) {  
        let p = powerups[i]  
        p.y += p.speed * (timeSlowActive ? 0.3 : 1)  
        p.angle += 0.02  
        p.pulsePhase += 0.05
        
        let type = POWERUP_TYPES[p.type]  
        
        ctx.save()  
        ctx.translate(p.x, p.y)  
        ctx.rotate(p.angle)  
        
        // Pulsing size
        let pulseSize = p.size/2 + Math.sin(p.pulsePhase) * 2
        
        // Glow effect  
        ctx.shadowColor = type.color  
        ctx.shadowBlur = 20  
        
        ctx.fillStyle = type.color  
        ctx.beginPath()  
        ctx.arc(0, 0, pulseSize, 0, Math.PI * 2)  
        ctx.fill()  
        
        ctx.shadowBlur = 0  
        ctx.fillStyle = "white"  
        ctx.font = "16px Arial"  
        ctx.fillText(type.symbol, -8, 6)  
        
        // Duration indicator for temporary powerups  
        if (type.duration > 0 && p.type !== 'SCORE_BOOST') {  
            ctx.fillStyle = '#fff'  
            ctx.font = '8px Arial'  
            ctx.fillText(`${type.duration/1000}s`, -6, 18)  
        }  
        
        ctx.restore()  
    }  
    
    powerups = powerups.filter(p => p.y <= GAME_HEIGHT + 20)  
}  

function drawExplosions() {  
    for (let i = explosions.length - 1; i >= 0; i--) {  
        let ex = explosions[i]  
        ctx.fillStyle = `rgba(255, ${200 - ex.size * 8}, 0, ${1 - ex.size/25})`  
        ctx.shadowColor = '#ff8800'  
        ctx.shadowBlur = 20  
        ctx.beginPath()  
        ctx.arc(ex.x, ex.y, ex.size, 0, Math.PI * 2)  
        ctx.fill()  
        ex.size += 1.5  
        if (ex.size > 25) explosions.splice(i, 1)  
    }  
    ctx.shadowBlur = 0  
}  

function drawParticles() {  
    for (let i = particles.length - 1; i >= 0; i--) {  
        let p = particles[i]  
        p.x += p.vx  
        p.y += p.vy  
        p.life--  
        p.size *= 0.95  
        
        ctx.fillStyle = p.color  
        ctx.shadowColor = p.color  
        ctx.shadowBlur = 10  
        ctx.beginPath()  
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2)  
        ctx.fill()  
        
        if (p.life <= 0 || p.size < 0.5) particles.splice(i, 1)  
    }  
    ctx.shadowBlur = 0  
}  

function drawDebris() {
    for (let i = debris.length - 1; i >= 0; i--) {
        let d = debris[i]
        d.x += d.vx
        d.y += d.vy
        d.rotation += d.rotationSpeed
        d.life--
        
        ctx.save()
        ctx.translate(d.x, d.y)
        ctx.rotate(d.rotation)
        ctx.fillStyle = d.color
        ctx.globalAlpha = d.life / 50
        ctx.fillRect(-d.size/2, -d.size/2, d.size, d.size)
        ctx.restore()
        
        if (d.life <= 0) debris.splice(i, 1)
    }
    ctx.globalAlpha = 1
}

function drawSpecialMeter() {  
    let meterX = 10  
    let meterY = 160  
    let meterWidth = 100  
    let meterHeight = 10  
    
    // Background  
    ctx.fillStyle = '#333'  
    ctx.fillRect(meterX, meterY, meterWidth, meterHeight)  
    
    // Fill with pulse when full
    if (player.specialMeter >= player.maxSpecial) {
        ctx.fillStyle = '#aa44ff'
        ctx.shadowColor = '#aa44ff'
        ctx.shadowBlur = 10 + Math.sin(Date.now() / 200) * 5
    } else {
        ctx.fillStyle = '#aa44ff'
    }
    let fillWidth = (player.specialMeter / player.maxSpecial) * meterWidth  
    ctx.fillRect(meterX, meterY, fillWidth, meterHeight)  
    
    // Border  
    ctx.strokeStyle = '#fff'  
    ctx.lineWidth = 1  
    ctx.strokeRect(meterX, meterY, meterWidth, meterHeight)  
    
    // Text  
    ctx.fillStyle = '#fff'  
    ctx.font = '10px Arial'  
    ctx.shadowBlur = 0
    ctx.fillText('SPECIAL', meterX, meterY - 2)  
}

function drawExperienceBar() {  
    let expNeeded = player.level * 100  
    let expX = 120  
    let expY = 160  
    let expWidth = 80  
    let expHeight = 10  
    
    ctx.fillStyle = '#333'  
    ctx.fillRect(expX, expY, expWidth, expHeight)  
    
    ctx.fillStyle = '#00ff00'  
    ctx.fillRect(expX, expY, (player.experience / expNeeded) * expWidth, expHeight)  
    
    ctx.strokeStyle = '#fff'  
    ctx.strokeRect(expX, expY, expWidth, expHeight)  
    
    ctx.fillStyle = '#fff'  
    ctx.font = '8px Arial'  
    ctx.fillText('EXP', expX, expY - 2)  
}  

function drawSkillPoints() {  
    if (player.skillPoints > 0) {  
        ctx.fillStyle = '#ffff00'  
        ctx.font = 'bold 16px Arial'  
        ctx.shadowColor = '#ffff00'
        ctx.shadowBlur = 10
        ctx.fillText(`✨ ${player.skillPoints}`, 10, 190)  
    }  
    ctx.shadowBlur = 0
}  

function updateUI() {  
    document.getElementById('lifeValue').textContent = player.life  
    document.getElementById('scoreValue').textContent = score  
    document.getElementById('waveNumber').textContent = wave  
    
    // Update high score  
    if (score > highScore) {  
        highScore = score  
        localStorage.setItem('highScore', highScore.toString())  
    }  
    
    // Update powerup icons  
    let powerupDiv = document.getElementById('powerups')  
    powerupDiv.innerHTML = ''  
    
    for (let [key, active] of Object.entries(player.powerups)) {  
        if (active) {  
            let type = POWERUP_TYPES[key.toUpperCase()]  
            if (type) {  
                let icon = document.createElement('div')  
                icon.className = 'powerup-icon'  
                icon.style.background = type.color  
                icon.style.boxShadow = `0 0 15px ${type.color}`  
                icon.textContent = type.symbol  
                powerupDiv.appendChild(icon)  
            }  
        }  
    }  
    
    // Update special button  
    let specialBtn = document.getElementById('specialButton')  
    if (player.specialMeter >= player.maxSpecial) {  
        specialBtn.classList.remove('disabled')  
    } else {  
        specialBtn.classList.add('disabled')  
    }  
}  

function addCombo() {  
    combo++  
    if (comboTimeout) clearTimeout(comboTimeout)  
    
    comboTimeout = setTimeout(() => {  
        combo = 0  
        document.getElementById('comboCounter').innerHTML = ''  
    }, 2000)  
    
    if (combo >= 5) {  
        document.getElementById('comboCounter').innerHTML = `🔥 ${combo}x COMBO!`  
        player.specialMeter = Math.min(player.specialMeter + 5, player.maxSpecial)  
        updateUI()  
        
        // Check combo achievements
        if (combo >= 20) checkAchievement('COMBO_MASTER')
        if (combo >= 50) checkAchievement('PERFECTIONIST')
    }  
}  

// Collision detection  
function bulletCollision() {  
    for (let i = bullets.length - 1; i >= 0; i--) {  
        for (let j = enemies.length - 1; j >= 0; j--) {  
            let b = bullets[i]  
            let e = enemies[j]  
            if (  
                b && e &&  
                b.x < e.x + e.w &&  
                b.x + 4 > e.x &&  
                b.y < e.y + e.h &&  
                b.y + 10 > e.y  
            ) {  
                explosions.push({ x: e.x + e.w/2, y: e.y + e.h/2, size: 2 })  
                playHit()  
                
                let damage = b.damage || 1  
                
                // Check shield first  
                if (e.shield > 0) {  
                    e.shield -= damage  
                } else {  
                    e.hp -= damage  
                }  
                
                bullets.splice(i, 1)  
                
                // Vampire lifesteal
                if (player.powerups.vampire && damage > 0) {
                    player.life = Math.min(player.life + 0.5, player.maxLife)
                }
                
                if (e.hp <= 0) {  
                    score += 10 * wave * (player.powerups.SCORE_BOOST ? 2 : 1)
                    player.experience += e.experienceValue || 10  
                    totalKills++
                    
                    // Create debris
                    for (let k = 0; k < 5; k++) {
                        debris.push({
                            x: e.x + e.w/2,
                            y: e.y + e.h/2,
                            vx: (Math.random() - 0.5) * 5,
                            vy: (Math.random() - 0.5) * 5,
                            size: Math.random() * 5 + 2,
                            rotation: Math.random() * Math.PI * 2,
                            rotationSpeed: (Math.random() - 0.5) * 0.2,
                            color: e.color || '#888',
                            life: 50
                        })
                    }
                    
                    // Level up check  
                    if (player.experience >= player.level * 100) {  
                        player.experience -= player.level * 100  
                        levelUp()  
                    }  
                    
                    enemies.splice(j, 1)  
                    enemiesKilled++  
                    addCombo()  
                    
                    // Chance to drop powerup  
                    if (Math.random() < 0.25) {  
                        spawnPowerup()  
                    }  
                    
                    // First blood achievement
                    if (totalKills === 1) {
                        checkAchievement('FIRST_BLOOD')
                    }
                    
                    // Sharpshooter achievement
                    if (totalKills >= 1000) {
                        checkAchievement('SHARPSHOOTER')
                    }
                    
                    // Wave progression  
                    if (enemiesKilled >= enemiesForNextWave) {  
                        wave++  
                        enemiesKilled = 0  
                        enemiesForNextWave = 10 + wave * 2  
                        playNewWave()
                        
                        // Spawn boss every 5 waves  
                        if (wave % 5 === 0) {  
                            spawnBoss()  
                        }  
                        
                        // Survivor achievement
                        if (wave >= 10) {
                            checkAchievement('SURVIVOR')
                        }
                    }  
                }  
                
                updateUI()  
                break  
            }  
        }  
    }  
}  

function asteroidCollision() {
    for (let i = asteroids.length - 1; i >= 0; i--) {
        let a = asteroids[i]
        
        // Bullet collision
        for (let j = bullets.length - 1; j >= 0; j--) {
            let b = bullets[j]
            let dx = b.x - a.x
            let dy = b.y - a.y
            let dist = Math.sqrt(dx * dx + dy * dy)
            
            if (dist < a.radius) {
                a.health -= b.damage || 1
                bullets.splice(j, 1)
                explosions.push({ x: b.x, y: b.y, size: 2 })
                
                if (a.health <= 0) {
                    // Break asteroid into pieces
                    for (let k = 0; k < 5; k++) {
                        debris.push({
                            x: a.x,
                            y: a.y,
                            vx: (Math.random() - 0.5) * 5,
                            vy: (Math.random() - 0.5) * 5,
                            size: a.radius / 3,
                            rotation: Math.random() * Math.PI * 2,
                            rotationSpeed: (Math.random() - 0.5) * 0.2,
                            color: '#886644',
                            life: 50
                        })
                    }
                    asteroids.splice(i, 1)
                    score += 5
                }
                break
            }
        }
        
        // Player collision
        if (!player.powerups.phaseShift && !player.phaseShiftActive) {
            let dx = player.x + 20 - a.x
            let dy = player.y + 20 - a.y
            let dist = Math.sqrt(dx * dx + dy * dy)
            
            if (dist < a.radius + 20) {
                explosions.push({ x: player.x + 20, y: player.y + 20, size: 5 })
                
                if (player.powerups.shield) {
                    player.powerups.shield = false
                    clearTimeout(player.powerupTimers.shield)
                } else {
                    player.life -= 1
                }
                
                asteroids.splice(i, 1)
                updateUI()
                
                if (player.life <= 0) {
                    gameActive = false
                    playGameOver()
                    setTimeout(() => {
                        alert(`💀 GAME OVER\n\nFinal Score: ${score}\nWaves: ${wave}\nKills: ${totalKills}\nLevel: ${player.level}\nHigh Score: ${highScore}\n\n✨ Play Again?`)
                        location.reload()
                    }, 500)
                }
            }
        }
    }
}

function missileCollision() {  
    for (let i = missiles.length - 1; i >= 0; i--) {  
        let m = missiles[i]  
        for (let j = enemies.length - 1; j >= 0; j--) {  
            let e = enemies[j]  
            if (  
                m.x < e.x + e.w &&  
                m.x + 4 > e.x &&  
                m.y < e.y + e.h &&  
                m.y + 10 > e.y  
            ) {  
                explosions.push({ x: e.x + e.w/2, y: e.y + e.h/2, size: 5 })  
                playExplosion()  
                
                let damage = m.damage || 2  
                
                if (e.shield > 0) {  
                    e.shield -= damage  
                } else {  
                    e.hp -= damage  
                }  
                
                missiles.splice(i, 1)  
                
                if (e.hp <= 0) {  
                    score += 15 * wave  
                    player.experience += 15  
                    enemies.splice(j, 1)  
                    enemiesKilled++  
                    addCombo()  
                }  
                
                updateUI()  
                break  
            }  
        }  
    }  
}  

function laserCollision() {  
    for (let i = laserBeams.length - 1; i >= 0; i--) {  
        let l = laserBeams[i]  
        for (let j = enemies.length - 1; j >= 0; j--) {  
            let e = enemies[j]  
            if (  
                l.y < e.y + e.h &&  
                l.y > e.y &&  
                Math.abs(l.x - (e.x + e.w/2)) < l.width/2  
            ) {  
                explosions.push({ x: e.x + e.w/2, y: e.y + e.h/2, size: 3 })  
                
                if (e.shield > 0) {  
                    e.shield -= l.damage  
                } else {  
                    e.hp -= l.damage  
                }  
                
                if (e.hp <= 0) {  
                    score += 10 * wave  
                    player.experience += 10  
                    enemies.splice(j, 1)  
                    enemiesKilled++  
                    addCombo()  
                }  
            }  
        }  
    }  
}  

function mineCollision() {  
    for (let i = mines.length - 1; i >= 0; i--) {  
        let m = mines[i]  
        if (m.armTime > 0) continue  
        
        for (let j = enemies.length - 1; j >= 0; j--) {  
            let e = enemies[j]  
            let dx = m.x - (e.x + e.w/2)  
            let dy = m.y - (e.y + e.h/2)  
            let dist = Math.sqrt(dx * dx + dy * dy)  
            
            if (dist < m.radius + e.w/2 || dist < m.proximityRadius) {  
                explosions.push({ x: m.x, y: m.y, size: 10 })  
                playExplosion()  
                
                if (e.shield > 0) {  
                    e.shield -= m.damage  
                } else {  
                    e.hp -= m.damage  
                }  
                
                mines.splice(i, 1)  
                
                if (e.hp <= 0) {  
                    score += 15 * wave  
                    enemies.splice(j, 1)  
                    enemiesKilled++  
                    addCombo()  
                }  
                break  
            }  
        }  
        
        // Player collision with mines  
        if (!player.powerups.phaseShift && !player.phaseShiftActive) {
            let dx = m.x - (player.x + 20)  
            let dy = m.y - (player.y + 20)  
            let dist = Math.sqrt(dx * dx + dy * dy)  
            
            if (dist < m.radius + 15 || dist < m.proximityRadius) {  
                explosions.push({ x: player.x + 20, y: player.y + 20, size: 5 })  
                
                if (player.powerups.shield) {  
                    player.powerups.shield = false  
                    clearTimeout(player.powerupTimers.shield)  
                } else {  
                    player.life -= m.damage  
                }  
                
                mines.splice(i, 1)  
                updateUI()  
                
                if (player.life <= 0) {  
                    gameActive = false  
                    playGameOver()  
                    setTimeout(() => {  
                        alert(`💀 GAME OVER\n\nFinal Score: ${score}\nWaves: ${wave}\nKills: ${totalKills}\nLevel: ${player.level}\nHigh Score: ${highScore}\n\n✨ Play Again?`)  
                        location.reload()  
                    }, 500)  
                }  
            }  
        }
    }  
}  

function bossCollision() {  
    if (!boss || !bossActive) return  
    
    // Player bullets vs boss  
    for (let i = bullets.length - 1; i >= 0; i--) {  
        let b = bullets[i]  
        if (  
            b.x < boss.x + boss.w &&  
            b.x + 4 > boss.x &&  
            b.y < boss.y + boss.h &&  
            b.y + 10 > boss.y  
        ) {  
            explosions.push({ x: b.x, y: b.y, size: 3 })  
            boss.hp -= b.damage || 1  
            bullets.splice(i, 1)  
            player.specialMeter = Math.min(player.specialMeter + 2, player.maxSpecial)  
            player.experience += 5  
            
            if (boss.hp <= 0) {  
                explosions.push({ x: boss.x + boss.w/2, y: boss.y + boss.h/2, size: 20 })  
                playExplosion()  
                score += 500 * wave  
                player.experience += 200  
                bossActive = false  
                boss = null  
                
                document.getElementById('bossHealthBar').style.display = 'none'  
                document.getElementById('bossName').style.display = 'none'  
                
                // Reward powerups  
                for (let i = 0; i < 5; i++) {  
                    spawnPowerup()  
                }  
                
                // Check achievement  
                checkAchievement('BOSS_SLAYER')  
            }  
            
            updateUI()  
            break  
        }  
    }  
    
    // Missiles vs boss  
    for (let i = missiles.length - 1; i >= 0; i--) {  
        let m = missiles[i]  
        if (  
            m.x < boss.x + boss.w &&  
            m.x + 4 > boss.x &&  
            m.y < boss.y + boss.h &&  
            m.y + 10 > boss.y  
        ) {  
            explosions.push({ x: m.x, y: m.y, size: 5 })  
            boss.hp -= m.damage || 2  
            missiles.splice(i, 1)  
            player.specialMeter += 3  
        }  
    }  
    
    // Player vs boss collision  
    if (!player.powerups.phaseShift && !player.phaseShiftActive) {
        if (  
            player.x < boss.x + boss.w &&  
            player.x + player.w > boss.x &&  
            player.y < boss.y + boss.h &&  
            player.y + player.h > boss.y  
        ) {  
            explosions.push({ x: player.x + 20, y: player.y + 20, size: 10 })  
            
            if (player.powerups.shield) {  
                player.powerups.shield = false  
                clearTimeout(player.powerupTimers.shield)  
            } else {  
                player.life -= boss.rageMode ? 3 : 2  
            }  
            
            updateUI()  
            
            if (player.life <= 0) {  
                gameActive = false  
                playGameOver()  
                setTimeout(() => {  
                    alert(`💀 GAME OVER\n\nFinal Score: ${score}\nWaves: ${wave}\nKills: ${totalKills}\nLevel: ${player.level}\nHigh Score: ${highScore}\n\n✨ Play Again?`)  
                    location.reload()  
                }, 500)  
            }  
        }
    }  
}  

function bulletVsBullet() {  
    for (let i = bullets.length - 1; i >= 0; i--) {  
        for (let j = enemyBullets.length - 1; j >= 0; j--) {  
            let b1 = bullets[i]  
            let b2 = enemyBullets[j]  
            if (  
                b1 && b2 &&  
                b1.x < b2.x + 4 &&  
                b1.x + 4 > b2.x &&  
                b1.y < b2.y + 10 &&  
                b1.y + 10 > b2.y  
            ) {  
                explosions.push({ x: b1.x, y: b1.y, size: 2 })  
                playExplosion()  
                bullets.splice(i, 1)  
                enemyBullets.splice(j, 1)  
                break  
            }  
        }  
    }  
}  

function shipCollision() {  
    for (let i = enemies.length - 1; i >= 0; i--) {  
        let e = enemies[i]  
        if (  
            player.x < e.x + e.w &&  
            player.x + player.w > e.x &&  
            player.y < e.y + e.h &&  
            player.y + player.h > e.y  
        ) {  
            explosions.push({ x: player.x + 20, y: player.y + 20, size: 5 })  
            
            if (e.type === 'kamikaze') {  
                player.life -= 2  
                enemies.splice(i, 1)  
            } else {  
                enemies.splice(i, 1)  
                
                if (player.powerups.shield) {  
                    player.powerups.shield = false  
                    clearTimeout(player.powerupTimers.shield)  
                } else {  
                    player.life--  
                }  
            }  
            
            updateUI()  
            
            if (player.life <= 0) {  
                gameActive = false  
                playGameOver()  
                setTimeout(() => {  
                    alert(`💀 GAME OVER\n\nFinal Score: ${score}\nWaves: ${wave}\nKills: ${totalKills}\nLevel: ${player.level}\nHigh Score: ${highScore}\n\n✨ Play Again?`)  
                    location.reload()  
                }, 500)  
            }  
        }  
    }  
}  

function playerBulletCollision() {  
    for (let i = enemyBullets.length - 1; i >= 0; i--) {  
        let b = enemyBullets[i]  
        if (  
            b.x > player.x &&  
            b.x < player.x + player.w &&  
            b.y > player.y &&  
            b.y < player.y + player.h  
        ) {  
            explosions.push({ x: player.x + 20, y: player.y + 20, size: 3 })  
            enemyBullets.splice(i, 1)  
            
            if (player.powerups.phaseShift || player.phaseShiftActive) {
                // Phase shift dodges bullets
                continue
            } else if (player.powerups.shield) {  
                player.powerups.shield = false  
                clearTimeout(player.powerupTimers.shield)  
            } else {  
                player.life -= b.damage || 1  
            }  
            
            updateUI()  
            
            if (player.life <= 0) {  
                gameActive = false  
                playGameOver()  
                setTimeout(() => {  
                    alert(`💀 GAME OVER\n\nFinal Score: ${score}\nWaves: ${wave}\nKills: ${totalKills}\nLevel: ${player.level}\nHigh Score: ${highScore}\n\n✨ Play Again?`)  
                    location.reload()  
                }, 500)  
            }  
        }  
    }  
}  

function powerupCollision() {  
    for (let i = powerups.length - 1; i >= 0; i--) {  
        let p = powerups[i]  
        if (  
            p.x > player.x - 15 &&  
            p.x < player.x + player.w + 15 &&  
            p.y > player.y - 15 &&  
            p.y < player.y + player.h + 15  
        ) {  
            playPowerup()  
            
            if (p.type === 'HEALTH') {  
                if (player.life < player.maxLife) {  
                    player.life++  
                }  
            } else if (p.type === 'REPAIR') {  
                player.life = Math.min(player.life + 2, player.maxLife)  
            } else if (p.type === 'SPECIAL') {  
                player.specialMeter = Math.min(player.specialMeter + 30, player.maxSpecial)  
            } else if (p.type === 'NUKE') {  
                for (let e of enemies) {  
                    explosions.push({ x: e.x + e.w/2, y: e.y + e.h/2, size: 5 })  
                    score += 20 * wave  
                }  
                enemies = []  
                enemyBullets = []  
            } else if (p.type === 'BLACK_HOLE') {  
                spawnBlackHole(player.x + 20, player.y - 50)  
            } else if (p.type === 'SCORE_BOOST') {  
                // Handled in scoring
            } else {  
                // Activate powerup  
                let key = p.type.toLowerCase()  
                player.powerups[key] = true  
                
                // Special handling for drone
                if (key === 'drone') {
                    player.drones.push({
                        x: 0,
                        y: 0,
                        active: true
                    })
                }
                
                // Set timeout to deactivate  
                if (POWERUP_TYPES[p.type].duration > 0) {  
                    clearTimeout(player.powerupTimers[key])  
                    player.powerupTimers[key] = setTimeout(() => {  
                        player.powerups[key] = false  
                        if (key === 'drone') {
                            player.drones = []
                        }
                        updateUI()  
                    }, POWERUP_TYPES[p.type].duration)  
                }  
            }  
            
            powerups.splice(i, 1)  
            updateUI()  
            
            // Collector achievement
            if (achievements.includes('COLLECTOR')) {
                let collected = achievements.filter(a => a === 'COLLECTOR').length
                if (collected >= 50) {
                    checkAchievement('COLLECTOR')
                }
            }
        }  
    }  
}  

function checkAchievement(achievementId) {  
    if (!achievements.includes(achievementId)) {  
        achievements.push(achievementId)  
        score += ACHIEVEMENTS[achievementId].reward  
        
        // Show achievement message  
        let msg = document.createElement('div')  
        msg.style.position = 'absolute'  
        msg.style.top = '30%'  
        msg.style.left = '50%'  
        msg.style.transform = 'translateX(-50%)'  
        msg.style.color = '#ffaa00'  
        msg.style.fontSize = '18px'  
        msg.style.fontWeight = 'bold'  
        msg.style.textShadow = '0 0 20px #ffaa00'  
        msg.style.zIndex = '1000'  
        msg.innerHTML = `🏆 ACHIEVEMENT: ${ACHIEVEMENTS[achievementId].name}<br>+${ACHIEVEMENTS[achievementId].reward} pts`  
        document.body.appendChild(msg)  
        
        setTimeout(() => {  
            document.body.removeChild(msg)  
        }, 3000)  
    }  
}  

function updatePlayer() {  
    // Apply movement with skill bonus
    let moveSpeed = player.speed * (1 + player.skills.speed * 0.1)
    if (timeSlowActive) moveSpeed *= 0.5
    
    player.x += joystickX * moveSpeed  
    player.y += joystickY * moveSpeed  
    player.x = Math.max(0, Math.min(GAME_WIDTH - player.w, player.x))  
    player.y = Math.max(0, Math.min(GAME_HEIGHT - player.h, player.y))  
    
    // Passive special meter gain  
    player.specialMeter = Math.min(player.specialMeter + 0.1, player.maxSpecial)  
    
    // Phase shift timer
    if (player.phaseShiftActive) {
        player.phaseShiftTimer--
        if (player.phaseShiftTimer <= 0) {
            player.phaseShiftActive = false
        }
    }
}  

// Game control functions  
window.resumeGame = function() {  
    gamePaused = false  
    document.getElementById('pauseMenu').style.display = 'none'  
}  

window.restartGame = function() {  
    location.reload()  
}  

window.quitGame = function() {  
    if (confirm('Quit game?')) {  
        window.close()  
    }  
}  

// Pause on back button  
document.addEventListener('visibilitychange', () => {  
    if (document.hidden) {  
        gamePaused = true  
        document.getElementById('pauseMenu').style.display = 'flex'  
    }  
})  

function gameLoop(timestamp) {  
    if (!gameActive) return  
    
    // Calculate delta time for animations
    if (lastTimestamp === 0) lastTimestamp = timestamp
    let deltaTime = timestamp - lastTimestamp
    lastTimestamp = timestamp
    
    // Update total play time
    if (!gamePaused) {
        totalPlayTime += deltaTime
    }
    
    ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT)  
    drawStars()  
    drawAsteroids()
    drawWormholes()
    drawForceField()
    
    if (!gamePaused) {  
        updatePlayer()  
        
        if (bossActive) {  
            updateBoss()  
        }  
    }  
    
    drawPlayer()  
    drawBullets()  
    drawChainLightning()
    drawMissiles()  
    drawLaserBeams()  
    drawEnemyBullets()  
    drawEnemies()  
    drawBoss()  
    drawPowerups()  
    drawBlackHoles()  
    drawMines()  
    drawExplosions()  
    drawParticles()  
    drawDebris()
    drawSpecialMeter()  
    drawExperienceBar()  
    drawSkillPoints()  
    
    if (!gamePaused) {  
        bulletCollision()  
        missileCollision()  
        laserCollision()  
        mineCollision()  
        bossCollision()  
        bulletVsBullet()  
        shipCollision()  
        playerBulletCollision()  
        powerupCollision()  
        asteroidCollision()
    }  
    
    requestAnimationFrame(gameLoop)  
}  

gameLoop()  

// ========== UPDATED TOUCH CONTROLS - SMOOTH ANALOG JOYSTICK ==========
const joystick = document.getElementById("joystick")  
const stick = document.getElementById("stick")  
const fire = document.getElementById("fire")  
const specialBtn = document.getElementById("specialButton")  

// Joystick active flag
let joystickActive = false

// Get max travel distance for stick (in pixels)
function getJoystickMaxRadius() {
    let rect = joystick.getBoundingClientRect()
    // Stick can move half of joystick width minus half of stick width
    return (rect.width / 2) - (stick.offsetWidth / 2)
}

// Convert pixel offset to normalized vector (-1..1)
function handleJoystickMove(clientX, clientY) {  
    let rect = joystick.getBoundingClientRect()  
    
    let centerX = rect.left + rect.width / 2  
    let centerY = rect.top + rect.height / 2  
    let maxRadius = getJoystickMaxRadius()
    
    // Calculate raw offset from center
    let dx = clientX - centerX  
    let dy = clientY - centerY  
    
    // Clamp distance to maxRadius for both position and joystick values
    let distance = Math.sqrt(dx * dx + dy * dy)  
    if (distance > maxRadius) {  
        dx = dx * maxRadius / distance  
        dy = dy * maxRadius / distance  
        distance = maxRadius
    }  
    
    // Normalize joystick values (-1..1) based on max radius
    joystickX = dx / maxRadius  
    joystickY = dy / maxRadius  
    
    // Update stick position with absolute pixels for smooth movement
    stick.style.left = (rect.width / 2 + dx - stick.offsetWidth / 2) + "px"  
    stick.style.top = (rect.height / 2 + dy - stick.offsetHeight / 2) + "px"  
    // Remove transform to allow direct pixel positioning
    stick.style.transform = "none"  
}  

function handleJoystickEnd() {  
    joystickActive = false
    joystickX = 0  
    joystickY = 0  
    // Reset stick to center with transform for clean reset
    stick.style.left = "50%"  
    stick.style.top = "50%"  
    stick.style.transform = "translate(-50%, -50%)"  
}  

// Touch events
joystick.addEventListener("touchstart", (e) => {  
    e.preventDefault()  
    initAudio()  
    joystickActive = true
    let touch = e.touches[0]  
    handleJoystickMove(touch.clientX, touch.clientY)  
})  

joystick.addEventListener("touchmove", (e) => {  
    e.preventDefault()  
    if (!joystickActive) return
    let touch = e.touches[0]  
    handleJoystickMove(touch.clientX, touch.clientY)  
})  

joystick.addEventListener("touchend", (e) => {  
    e.preventDefault()  
    handleJoystickEnd()  
})  

joystick.addEventListener("touchcancel", (e) => {  
    e.preventDefault()  
    handleJoystickEnd()  
})  

// Mouse events for testing
joystick.addEventListener("mousedown", (e) => {  
    e.preventDefault()  
    initAudio()  
    joystickActive = true
    handleJoystickMove(e.clientX, e.clientY)  
    
    function onMouseMove(e) {  
        e.preventDefault()  
        if (!joystickActive) return
        handleJoystickMove(e.clientX, e.clientY)  
    }  
    
    function onMouseUp(e) {  
        e.preventDefault()  
        handleJoystickEnd()  
        document.removeEventListener("mousemove", onMouseMove)  
        document.removeEventListener("mouseup", onMouseUp)  
    }  
    
    document.addEventListener("mousemove", onMouseMove)  
    document.addEventListener("mouseup", onMouseUp)  
})  

// Fire button  
fire.addEventListener("touchstart", (e) => {  
    e.preventDefault()  
    initAudio()  
    if (audioCtx && audioCtx.state === 'suspended') {  
        audioCtx.resume()  
    }  
    firing = true  
    shoot()  
    autoFire()  
})  

fire.addEventListener("touchend", (e) => {  
    e.preventDefault()  
    firing = false  
})  

fire.addEventListener("touchcancel", (e) => {  
    e.preventDefault()  
    firing = false  
})  

fire.addEventListener("mousedown", (e) => {  
    e.preventDefault()  
    initAudio()  
    if (audioCtx && audioCtx.state === 'suspended') {  
        audioCtx.resume()  
    }  
    firing = true  
    shoot()  
    autoFire()  
})  

fire.addEventListener("mouseup", () => {  
    firing = false  
})  

fire.addEventListener("mouseleave", () => {  
    firing = false  
})  

// Special button  
specialBtn.addEventListener("touchstart", (e) => {  
    e.preventDefault()  
    useSpecial()  
})  

specialBtn.addEventListener("mousedown", (e) => {  
    e.preventDefault()  
    useSpecial()  
})  

// Keyboard controls  
document.addEventListener('keydown', (e) => {  
    switch(e.key) {  
        case 'ArrowLeft': joystickX = -1; break  
        case 'ArrowRight': joystickX = 1; break  
        case 'ArrowUp': joystickY = -1; break  
        case 'ArrowDown': joystickY = 1; break  
        case ' ': 
            e.preventDefault()  
            if (!firing) {  
                firing = true  
                shoot()  
                autoFire()  
            }  
            break  
        case 's':  
        case 'S':  
            useSpecial()  
            break  
        case 'p':  
        case 'P':  
            gamePaused = !gamePaused  
            document.getElementById('pauseMenu').style.display = gamePaused ? 'flex' : 'none'  
            break  
        case '1':  
        case '2':  
        case '3':  
        case '4':  
        case '5':  
            // Skill allocation  
            if (player.skillPoints > 0) {  
                let skill = parseInt(e.key) - 1  
                if (skill === 0) player.skills.damage++  
                else if (skill === 1) player.skills.fireRate++  
                else if (skill === 2) player.skills.speed++  
                else if (skill === 3) player.skills.critical++  
                else if (skill === 4) player.skills.lifesteal++  
                player.skillPoints--  
            }  
            break  
    }  
})  

document.addEventListener('keyup', (e) => {  
    switch(e.key) {  
        case 'ArrowLeft':  
        case 'ArrowRight': joystickX = 0; break  
        case 'ArrowUp':  
        case 'ArrowDown': joystickY = 0; break  
        case ' ': firing = false; break  
    }  
})  

// Prevent default touch actions  
document.body.addEventListener("touchstart", (e) => {  
    if (e.target === canvas) {  
        e.preventDefault()  
    }  
}, { passive: false })  

document.body.addEventListener("touchmove", (e) => {  
    if (e.target === canvas || e.target === joystick || e.target === fire || e.target === specialBtn) {  
        e.preventDefault()  
    }  
}, { passive: false })  

</script>
