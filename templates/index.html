<!DOCTYPE html>  
<html>  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">  
<title>Space Shooting - ULTIMATE EDITION V3.0</title>  

<style>  
* {  
    margin: 0;  
    padding: 0;  
    box-sizing: border-box;  
    -webkit-tap-highlight-color: transparent;  
    user-select: none;  
    -webkit-user-select: none;  
}  

html, body {  
    width: 100%;  
    height: 100%;  
    overflow: hidden;  
    position: fixed;  
    background: black;  
}  

body {  
    display: flex;  
    justify-content: center;  
    align-items: center;  
    font-family: 'Arial', sans-serif;  
}  

#gameContainer {  
    position: relative;  
    width: 100%;  
    height: 100%;  
    aspect-ratio: 2 / 3;  
    background: black;  
    overflow: hidden;  
    border: 2px solid #00ffff;  
    box-shadow: 0 0 30px #00ffff, 0 0 60px #00ffff33;  
    border-radius: 10px;  
}  

canvas {  
    position: absolute;  
    top: 0;  
    left: 0;  
    width: 100% !important;  
    height: 100% !important;  
    display: block;  
    background: black;  
    z-index: 1;  
}  

#uiOverlay {  
    position: absolute;  
    top: 0;  
    left: 0;  
    width: 100%;  
    height: 100%;  
    z-index: 2;  
    pointer-events: none;  
    padding: 12px 15px;  
    display: flex;  
    flex-direction: column;  
    justify-content: space-between;  
}  

#topBar {  
    display: flex;  
    justify-content: space-between;  
    align-items: center;  
    width: 100%;  
    pointer-events: none;  
    text-shadow: 0 0 5px rgba(0,0,0,0.8);  
    font-size: clamp(14px, 4vw, 18px);  
}  

#titleText {  
    color: #0ff;  
    background: linear-gradient(90deg, #003333, #001111);  
    padding: 6px 15px;  
    border-radius: 25px;  
    border: 1px solid #0ff;  
    backdrop-filter: blur(4px);  
    font-weight: bold;  
    letter-spacing: 2px;  
    box-shadow: 0 0 15px #0ff;  
    animation: glow 2s ease-in-out infinite;  
}  

@keyframes glow {
    0%, 100% { box-shadow: 0 0 15px #0ff; }
    50% { box-shadow: 0 0 25px #0ff, 0 0 35px #0ff; }
}

#statsText {  
    color: white;  
    background: rgba(0,0,0,0.7);  
    padding: 6px 15px;  
    border-radius: 25px;  
    border: 1px solid #ffaa00;  
    backdrop-filter: blur(4px);  
    font-weight: bold;  
    display: flex;  
    gap: 20px;  
    box-shadow: 0 0 15px #ffaa00;  
}  

.life { color: #ff5555; text-shadow: 0 0 10px #ff0000; }  
.score { color: #ffff55; text-shadow: 0 0 10px #ffff00; }  

#powerups {
    position: absolute;
    top: 70px;
    left: 15px;
    display: flex;
    gap: 10px;
    pointer-events: none;
    flex-wrap: wrap;
    max-width: 200px;
}

.powerup-icon {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    animation: pulse 1s ease-in-out infinite;
    box-shadow: 0 0 15px currentColor;
}

@keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.1); opacity: 0.8; }
}

#waveInfo {
    position: absolute;
    top: 70px;
    right: 15px;
    color: #ffaa00;
    font-size: clamp(12px, 3.5vw, 16px);
    background: rgba(0,0,0,0.6);
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid #ffaa00;
    backdrop-filter: blur(4px);
    box-shadow: 0 0 15px #ffaa00;
    pointer-events: none;
}

#comboCounter {
    position: absolute;
    top: 120px;
    left: 50%;
    transform: translateX(-50%);
    color: #ffaa00;
    font-size: 24px;
    font-weight: bold;
    text-shadow: 0 0 10px #ffaa00, 0 0 20px #ff5500;
    animation: comboPop 0.5s ease-out;
    pointer-events: none;
    z-index: 5;
}

#comboMultiplier {
    position: absolute;
    top: 160px;
    left: 50%;
    transform: translateX(-50%);
    color: #ffff00;
    font-size: 18px;
    font-weight: bold;
    text-shadow: 0 0 10px #ffff00;
    pointer-events: none;
    z-index: 5;
    background: rgba(0,0,0,0.6);
    padding: 4px 12px;
    border-radius: 20px;
    white-space: nowrap;
}

@keyframes comboPop {
    0% { transform: translateX(-50%) scale(0.5); opacity: 0; }
    50% { transform: translateX(-50%) scale(1.2); opacity: 1; }
    100% { transform: translateX(-50%) scale(1); opacity: 1; }
}

#bossHealthBar {
    position: absolute;
    top: 110px;
    left: 15px;
    right: 15px;
    height: 20px;
    background: rgba(0,0,0,0.7);
    border: 2px solid #ff0000;
    border-radius: 10px;
    overflow: hidden;
    display: none;
    z-index: 5;
}

#bossHealthFill {
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, #ff0000, #ff5500);
    transition: width 0.3s ease;
}

#bossName {
    position: absolute;
    top: 85px;
    left: 50%;
    transform: translateX(-50%);
    color: #ff0000;
    font-size: 18px;
    font-weight: bold;
    text-shadow: 0 0 10px #ff0000;
    display: none;
    z-index: 5;
    white-space: nowrap;
}

#controls {  
    position: absolute;  
    bottom: 15px;  
    left: 0;  
    width: 100%;  
    display: flex;  
    justify-content: space-between;  
    align-items: flex-end;  
    padding: 0 15px 10px 15px;  
    z-index: 3;  
    pointer-events: none;  
    box-sizing: border-box;  
}  

#joystick {  
    width: min(140px, 34vw);  
    height: min(140px, 34vw);  
    max-width: 140px;  
    max-height: 140px;  
    min-width: 100px;  
    min-height: 100px;  
    background: rgba(20, 20, 40, 0.85);  
    border-radius: 50%;  
    position: relative;  
    touch-action: none;  
    pointer-events: auto;  
    backdrop-filter: blur(6px);  
    border: 2px solid rgba(0, 255, 255, 0.7);  
    box-shadow: 0 0 30px rgba(0, 255, 255, 0.6), inset 0 0 20px rgba(0, 255, 255, 0.3);  
    display: flex;  
    justify-content: center;  
    align-items: center;  
    transition: box-shadow 0.1s ease;
}  

#joystick::before {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.2), transparent 80%);
    pointer-events: none;
}

#stick {  
    width: min(60px, 15vw);  
    height: min(60px, 15vw);  
    max-width: 60px;  
    max-height: 60px;  
    min-width: 45px;  
    min-height: 45px;  
    background: radial-gradient(circle at 35% 35%, #ffffff, #aaddff, #88ccff);  
    border-radius: 50%;  
    position: absolute;  
    left: 50%;  
    top: 50%;  
    transform: translate(-50%, -50%);  
    box-shadow: 0 0 25px rgba(255, 255, 255, 0.9), 0 0 45px #0ff;  
    border: 2px solid #ffffff;  
    will-change: transform;
}  

#fire {  
    width: min(100px, 25vw);  
    height: min(100px, 25vw);  
    max-width: 100px;  
    max-height: 100px;  
    min-width: 80px;  
    min-height: 80px;  
    background: linear-gradient(145deg, #ff4444, #aa0000);  
    border-radius: 50%;  
    display: flex;  
    align-items: center;  
    justify-content: center;  
    font-size: min(26px, 6.5vw);  
    font-weight: bold;  
    color: white;  
    touch-action: none;  
    pointer-events: auto;  
    backdrop-filter: blur(4px);  
    border: 3px solid rgba(255, 200, 200, 0.8);  
    box-shadow: 0 0 30px rgba(255, 0, 0, 0.7), 0 6px 0 #550000;  
    text-transform: uppercase;  
    letter-spacing: 2px;  
    text-shadow: 0 2px 0 #550000, 0 0 10px #ffffff;  
    transition: all 0.05s ease;  
    position: relative;
    overflow: hidden;
}  

#fire::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
    animation: rotate 4s linear infinite;
}

@keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

#fire:active {  
    transform: translateY(5px);  
    box-shadow: 0 0 40px rgba(255, 0, 0, 0.9), 0 1px 0 #550000;  
}  

#specialButton {
    position: absolute;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    width: min(70px, 18vw);
    height: min(70px, 18vw);
    max-width: 70px;
    max-height: 70px;
    min-width: 55px;
    min-height: 55px;
    background: linear-gradient(145deg, #aa44ff, #5500aa);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: min(20px, 5vw);
    color: white;
    touch-action: none;
    pointer-events: auto;
    border: 3px solid rgba(255, 255, 255, 0.8);
    box-shadow: 0 0 30px #aa44ff, 0 6px 0 #330066;
    text-shadow: 0 2px 0 #330066;
    transition: all 0.05s ease;
    z-index: 4;
    font-weight: bold;
}

#specialButton:active {
    transform: translateX(-50%) translateY(5px);
    box-shadow: 0 0 40px #aa44ff, 0 1px 0 #330066;
}

#specialButton.disabled {
    opacity: 0.5;
    pointer-events: none;
}

#loading {  
    position: absolute;  
    top: 50%;  
    left: 50%;  
    transform: translate(-50%, -50%);  
    color: #0ff;  
    font-size: 24px;  
    z-index: 10;  
    background: rgba(0,0,0,0.9);  
    padding: 25px 40px;  
    border-radius: 15px;  
    border: 2px solid #0ff;  
    box-shadow: 0 0 50px #0ff;  
    animation: pulse 1.5s ease-in-out infinite;
}  

#pauseMenu {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(5px);
    z-index: 100;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 20px;
}

.pauseButton {
    padding: 15px 40px;
    font-size: 24px;
    background: linear-gradient(145deg, #0ff, #00aaff);
    border: none;
    border-radius: 50px;
    color: black;
    font-weight: bold;
    box-shadow: 0 0 30px #0ff;
    cursor: pointer;
    transition: all 0.2s ease;
    min-width: 200px;
    text-align: center;
}

.pauseButton:hover {
    transform: scale(1.1);
    box-shadow: 0 0 50px #0ff;
}

.pauseButton.red {
    background: linear-gradient(145deg, #ff4444, #aa0000);
    box-shadow: 0 0 30px #ff0000;
    color: white;
}
</style>  
</head>  
<body>  

<div id="gameContainer">  
    <canvas id="game"></canvas>  
    
    <div id="uiOverlay">  
        <div id="topBar">  
            <div id="titleText">EXOMNIA AIRCRAFT v5.0</div>  
            <div id="statsText">  
                <span class="life">❤️ <span id="lifeValue">3</span></span>  
                <span class="score">🎁 <span id="scoreValue">0</span></span>  
            </div>  
        </div>  
        
        <div id="powerups"></div>
        
        <div id="waveInfo">
            🌊 WAVE <span id="waveNumber">1</span>
        </div>
        
        <div id="comboCounter"></div>
        <div id="comboMultiplier">x1.0</div>
        
        <div id="bossHealthBar">
            <div id="bossHealthFill"></div>
        </div>
        <div id="bossName">🚀 BOSS: DESTROYER</div>
    </div>  
    
    <div id="controls">  
        <div id="joystick">  
            <div id="stick"></div>  
        </div>  
        <div id="specialButton">✨</div>
        <div id="fire">FIRE</div>  
    </div>  
    
    <div id="pauseMenu">
        <div class="pauseButton" onclick="resumeGame()">▶ RESUME</div>
        <div class="pauseButton" onclick="restartGame()">🔄 RESTART</div>
        <div class="pauseButton red" onclick="quitGame()">⏹ QUIT</div>
    </div>
</div>  
<div id="skillMenu" style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:200; flex-direction:column; justify-content:center; align-items:center; gap:15px;">
    <div style="color:#0ff; font-size:22px;">LEVEL UP! Choose Skill</div>
    <button onclick="upgradeSkill('damage')">Damage ↑</button>
    <button onclick="upgradeSkill('fireRate')">Fire Rate ↑</button>
    <button onclick="upgradeSkill('speed')">Speed ↑</button>
    <button onclick="upgradeSkill('critical')">Critical ↑</button>
</div>

<div id="achievementPopup" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#0ff; font-size:20px; display:none; z-index:300;"></div>
<div id="loading">LOADING...</div>  
    
<script src="{{ url_for('static', filename='game.js') }}"></script>
</body>  
</html>
