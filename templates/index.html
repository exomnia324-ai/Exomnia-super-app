<!DOCTYPE html>  
<html>  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">  
<title>Space Shooting — fullscreen</title>  
  
<style>  
* {  
    box-sizing: border-box;  
    -webkit-tap-highlight-color: transparent;  
    margin: 0;  
    padding: 0;  
}  
  
body{  
    margin:0;  
    background:black;  
    overflow:hidden;  
    font-family:Arial;  
    display: flex;  
    justify-content: center;  
    align-items: center;  
    min-height: 100vh;  
    min-height: 100dvh; /* dynamic viewport for mobile */  
    width: 100vw;  
    width: 100dvw;  
    touch-action: none; /* prevent pull-to-refresh, panning */  
    position: fixed;  
    top: 0;  
    left: 0;  
}  
  
#gameContainer {  
    position: relative;  
    width: 100vw;  
    height: 100vh;  
    height: 100dvh;  
    max-width: none;  
    max-height: none;  
    margin: 0;  
    background: black;  
    display: flex;  
    justify-content: center;  
    align-items: center;  
}  

/* canvas keeps 400x600 aspect ratio but fills container */  
canvas{  
    display:block;  
    width: auto;  
    height: auto;  
    max-width: 100%;  
    max-height: 100%;  
    aspect-ratio: 400 / 600;  
    background:black;  
    object-fit: contain;  
    position: relative;  
    box-shadow: 0 0 0 2px #0a2a2a; /* optional subtle border */  
}  

/* controls overlay uses same canvas area */  
#controls{  
    position: absolute;  
    bottom: max(15px, env(safe-area-inset-bottom));  
    width: 100%;  
    max-width: min(400px, 100vw);  
    left: 50%;  
    transform: translateX(-50%);  
    display:flex;  
    justify-content:space-between;  
    padding: 0 15px 15px 15px;  
    box-sizing:border-box;  
    pointer-events: none;  
    z-index: 10;  
    gap: 20px;  
}  
  
#joystick{  
    width: min(130px, 28vw, 28vh);  
    height: min(130px, 28vw, 28vh);  
    background:rgba(255,255,255,0.2);  
    border-radius:50%;  
    position:relative;  
    touch-action:none;  
    pointer-events: auto;  
    backdrop-filter: blur(3px);  
    border: 2px solid rgba(255,255,255,0.3);  
    box-shadow: 0 0 15px rgba(0,255,255,0.3);  
}  
  
#stick{  
    width: min(55px, 12vw, 12vh);  
    height: min(55px, 12vw, 12vh);  
    background:white;  
    border-radius:50%;  
    position:absolute;  
    left: 50%;  
    top: 50%;  
    transform: translate(-50%, -50%);  
    transition: all 0.02s;  
    box-shadow: 0 0 15px cyan;  
}  
  
#fire{  
    width: min(100px, 22vw, 22vh);  
    height: min(100px, 22vw, 22vh);  
    background:rgba(255,40,40,0.9);  
    border-radius:50%;  
    display:flex;  
    align-items:center;  
    justify-content:center;  
    font-size: min(24px, 6vw, 6vh);  
    color:white;  
    touch-action:none;  
    pointer-events: auto;  
    backdrop-filter: blur(3px);  
    border: 3px solid rgba(255,200,200,0.7);  
    box-shadow: 0 0 25px red;  
    font-weight: bold;  
    text-shadow: 0 0 8px darkred;  
}  

#score {  
    position: absolute;  
    top: max(10px, env(safe-area-inset-top));  
    right: max(10px, env(safe-area-inset-right));  
    color: white;  
    font-size: min(18px, 5vw);  
    z-index: 20;  
    text-shadow: 0 0 8px black;  
    background: rgba(0,0,0,0.5);  
    padding: 4px 12px;  
    border-radius: 40px;  
    backdrop-filter: blur(2px);  
    border: 1px solid cyan;  
    white-space: nowrap;  
}  

#title {  
    position: absolute;  
    top: max(10px, env(safe-area-inset-top));  
    left: max(10px, env(safe-area-inset-left));  
    color: #7ff0f0;  
    font-size: min(14px, 4vw);  
    z-index: 20;  
    text-shadow: 0 0 8px darkcyan;  
    background: rgba(0,40,40,0.6);  
    padding: 4px 10px;  
    border-radius: 40px;  
    backdrop-filter: blur(2px);  
    border: 1px solid teal;  
    white-space: nowrap;  
}  
</style>  
</head>  
<body>  

<div id="gameContainer">  
    <canvas id="game"></canvas>  
    
    <div id="title">🚀 SPACE SHOOTING — Exomnia</div>  
    <div id="score">❤️ 3  |  🎯 0</div>  
    
    <div id="controls">  
        <div id="joystick">  
            <div id="stick"></div>  
        </div>  
        <div id="fire">🔫 FIRE</div>  
    </div>  
</div>  

<script>  
(function(){  
const canvas = document.getElementById("game")  
const ctx = canvas.getContext("2d")  

// Force canvas logical size 400x600  
canvas.width = 400  
canvas.height = 600  

// No extra resize needed — CSS handles fullscreen fitting  
// but we ensure body locks to screen  

// SOUND  
const audioCtx = new (window.AudioContext || window.webkitAudioContext)()  

function playShoot(){  
    if (!audioCtx) return
    let osc = audioCtx.createOscillator()  
    let gain = audioCtx.createGain()  
    osc.type="square"  
    osc.frequency.value=600  
    gain.gain.value=0.1  
    osc.connect(gain)  
    gain.connect(audioCtx.destination)  
    osc.start()  
    osc.stop(audioCtx.currentTime+0.05)  
}  

function playExplosion(){  
    if (!audioCtx) return
    let osc = audioCtx.createOscillator()  
    let gain = audioCtx.createGain()  
    osc.type="sawtooth"  
    osc.frequency.setValueAtTime(200,audioCtx.currentTime)  
    osc.frequency.exponentialRampToValueAtTime(50,audioCtx.currentTime+0.3)  
    gain.gain.value=0.2  
    osc.connect(gain)  
    gain.connect(audioCtx.destination)  
    osc.start()  
    osc.stop(audioCtx.currentTime+0.3)  
}  

function playGameOver(){  
    if (!audioCtx) return
    let osc = audioCtx.createOscillator()  
    let gain = audioCtx.createGain()  
    osc.type="triangle"  
    osc.frequency.setValueAtTime(300,audioCtx.currentTime)  
    osc.frequency.exponentialRampToValueAtTime(80,audioCtx.currentTime+0.6)  
    gain.gain.value=0.2  
    osc.connect(gain)  
    gain.connect(audioCtx.destination)  
    osc.start()  
    osc.stop(audioCtx.currentTime+0.6)  
}  

let player={  
    x:180,  
    y:520,  
    w:40,  
    h:40,  
    speed:4,  
    life:3  
}  

let bullets=[]  
let enemyBullets=[]  
let enemies=[]  
let explosions=[]  
let stars=[]  

let score=0  
let joystickX=0  
let joystickY=0  
let firing=false  

for(let i=0;i<80;i++){  
    stars.push({  
        x:Math.random()*400,  
        y:Math.random()*600,  
        speed:Math.random()*2+1  
    })  
}  

// Enemy spawn interval  
let enemyInterval = setInterval(()=>{  
    enemies.push({  
        x:Math.random()*360,  
        y:-20,  
        w:30,  
        h:30,  
        speed:2  
    })  
},1500)  

// Enemy shooting interval  
let enemyShootInterval = setInterval(()=>{  
    for(let e of enemies){  
        enemyBullets.push({  
            x:e.x+e.w/2,  
            y:e.y+e.h,  
            speed:3  
        })  
    }  
},2000)  

function shoot(){  
    playShoot()  
    bullets.push({  
        x:player.x+18,  
        y:player.y,  
        speed:6  
    })  
}  

function autoFire(){  
    if(firing){  
        shoot()  
        setTimeout(autoFire,150)  
    }  
}  

function drawStars(){  
    ctx.fillStyle="white"  
    for(let s of stars){  
        s.y+=s.speed  
        if(s.y>600){  
            s.y=0  
            s.x=Math.random()*400  
        }  
        ctx.fillRect(s.x,s.y,2,2)  
    }  
}  

function drawPlayer(){  
    ctx.save()  
    ctx.translate(player.x+20,player.y+20)  
    ctx.fillStyle="#00e5ff"  
    ctx.beginPath()  
    ctx.moveTo(-20,10)  
    ctx.lineTo(-5,-15)  
    ctx.lineTo(-5,15)  
    ctx.fill()  
    ctx.beginPath()  
    ctx.moveTo(20,10)  
    ctx.lineTo(5,-15)  
    ctx.lineTo(5,15)  
    ctx.fill()  
    ctx.fillStyle="#0ff"  
    ctx.beginPath()  
    ctx.moveTo(0,-20)  
    ctx.lineTo(10,10)  
    ctx.lineTo(-10,10)  
    ctx.closePath()  
    ctx.fill()  
    ctx.fillStyle="blue"  
    ctx.beginPath()  
    ctx.arc(0,-5,5,0,Math.PI*2)  
    ctx.fill()  
    ctx.fillStyle="orange"  
    ctx.beginPath()  
    ctx.moveTo(-6,10)  
    ctx.lineTo(0,20)  
    ctx.lineTo(6,10)  
    ctx.fill()  
    ctx.restore()  
}  

function drawBullets(){  
    ctx.fillStyle="yellow"  
    for(let i=bullets.length-1;i>=0;i--){  
        let b=bullets[i]  
        b.y-=b.speed  
        ctx.fillRect(b.x,b.y,4,10)  
        if(b.y<0) bullets.splice(i,1)  
    }  
}  

function drawEnemyBullets(){  
    ctx.fillStyle="red"  
    for(let i=enemyBullets.length-1;i>=0;i--){  
        let b=enemyBullets[i]  
        b.y+=b.speed  
        ctx.fillRect(b.x,b.y,4,10)  
        if(b.y>600) enemyBullets.splice(i,1)  
    }  
}  

function drawEnemies(){  
    ctx.fillStyle="lime"  
    for(let i=enemies.length-1;i>=0;i--){  
        let e=enemies[i]  
        e.y+=e.speed  
        ctx.beginPath()  
        ctx.moveTo(e.x+15,e.y)  
        ctx.lineTo(e.x+30,e.y+30)  
        ctx.lineTo(e.x,e.y+30)  
        ctx.closePath()  
        ctx.fill()  
        if(e.y>620) enemies.splice(i,1)  
    }  
}  

function drawExplosions(){  
    ctx.fillStyle="orange"  
    for(let i=explosions.length-1;i>=0;i--){  
        let ex=explosions[i]  
        ctx.beginPath()  
        ctx.arc(ex.x,ex.y,ex.size,0,Math.PI*2)  
        ctx.fill()  
        ex.size+=1  
        if(ex.size>15) explosions.splice(i,1)  
    }  
}  

function bulletCollision(){  
    for(let i=bullets.length-1;i>=0;i--){  
        for(let j=enemies.length-1;j>=0;j--){  
            let b=bullets[i]  
            let e=enemies[j]  
            if(  
                b &&  
                b.x < e.x+e.w &&  
                b.x+4 > e.x &&  
                b.y < e.y+e.h &&  
                b.y+10 > e.y  
            ){  
                explosions.push({x:e.x+15,y:e.y+15,size:2})  
                playExplosion()  
                score+=10  
                bullets.splice(i,1)  
                enemies.splice(j,1)  
                break  
            }  
        }  
    }  
}  

function bulletVsBullet(){  
    for(let i=bullets.length-1;i>=0;i--){  
        for(let j=enemyBullets.length-1;j>=0;j--){  
            let b1=bullets[i]  
            let b2=enemyBullets[j]  
            if(  
                b1 &&  
                b2 &&  
                b1.x < b2.x+4 &&  
                b1.x+4 > b2.x &&  
                b1.y < b2.y+10 &&  
                b1.y+10 > b2.y  
            ){  
                explosions.push({x:b1.x,y:b1.y,size:2})  
                playExplosion()  
                bullets.splice(i,1)  
                enemyBullets.splice(j,1)  
                break  
            }  
        }  
    }  
}  

function shipCollision(){  
    for(let i=enemies.length-1;i>=0;i--){  
        let e=enemies[i]  
        if(  
            player.x < e.x + e.w &&  
            player.x + player.w > e.x &&  
            player.y < e.y + e.h &&  
            player.y + player.h > e.y  
        ){  
            explosions.push({x:player.x+20,y:player.y+20,size:2})  
            enemies.splice(i,1)  
            player.life--  
            if(player.life<=0){  
                playGameOver()  
                clearInterval(enemyInterval)  
                clearInterval(enemyShootInterval)  
                setTimeout(()=>{  
                    alert("💥 GAME OVER\nYour score: "+score)  
                    location.reload()  
                },400)  
            }  
        }  
    }  
}  

function updatePlayer(){  
    player.x+=joystickX*player.speed  
    player.y+=joystickY*player.speed  
    player.x=Math.max(0,Math.min(360,player.x))  
    player.y=Math.max(0,Math.min(560,player.y))  
}  

function gameLoop(){  
    ctx.clearRect(0,0,400,600)  
    drawStars()  
    updatePlayer()  
    drawPlayer()  
    drawBullets()  
    drawEnemyBullets()  
    drawEnemies()  
    drawExplosions()  
    bulletCollision()  
    bulletVsBullet()  
    shipCollision()  
    
    // Update score display  
    document.getElementById('score').innerHTML = `❤️ ${player.life}  |  🎯 ${score}`  
    
    requestAnimationFrame(gameLoop)  
}  

gameLoop()  

const joystick=document.getElementById("joystick")  
const stick=document.getElementById("stick")  
const fire=document.getElementById("fire")  

// Resume audio on first touch  
function resumeAudio() {  
    if (audioCtx.state === 'suspended') audioCtx.resume();  
}  

// Touch events for joystick  
joystick.addEventListener("touchstart", (e) => {  
    e.preventDefault()  
    resumeAudio()  
    handleJoystickMove(e)  
})  

joystick.addEventListener("touchmove", (e) => {  
    e.preventDefault()  
    handleJoystickMove(e)  
})  

function handleJoystickMove(e) {  
    let rect=joystick.getBoundingClientRect()  
    let joystickRadius = rect.width / 2  
    let stickRadius = stick.offsetWidth / 2  
    
    let x=e.touches[0].clientX-rect.left-joystickRadius  
    let y=e.touches[0].clientY-rect.top-joystickRadius  
    
    let maxMove = joystickRadius - stickRadius  
    let distance = Math.sqrt(x*x + y*y)  
    if (distance > maxMove) {  
        x = x * maxMove / distance  
        y = y * maxMove / distance  
    }  
    
    joystickX = x / maxMove  
    joystickY = y / maxMove  
    
    stick.style.left = (x + joystickRadius - stickRadius) + "px"  
    stick.style.top = (y + joystickRadius - stickRadius) + "px"  
}  

joystick.addEventListener("touchend",()=>{  
    joystickX=0  
    joystickY=0  
    stick.style.left = "50%"  
    stick.style.top = "50%"  
    stick.style.transform = "translate(-50%, -50%)"  
})  

// Mouse desktop support  
joystick.addEventListener("mousedown", (e) => {  
    e.preventDefault()  
    resumeAudio()  
    document.addEventListener("mousemove", handleMouseMove)  
    document.addEventListener("mouseup", handleMouseUp)  
})  

function handleMouseMove(e) {  
    let rect=joystick.getBoundingClientRect()  
    let joystickRadius = rect.width / 2  
    let stickRadius = stick.offsetWidth / 2  
    
    let x=e.clientX-rect.left-joystickRadius  
    let y=e.clientY-rect.top-joystickRadius  
    
    let maxMove = joystickRadius - stickRadius  
    let distance = Math.sqrt(x*x + y*y)  
    if (distance > maxMove) {  
        x = x * maxMove / distance  
        y = y * maxMove / distance  
    }  
    
    joystickX = x / maxMove  
    joystickY = y / maxMove  
    
    stick.style.left = (x + joystickRadius - stickRadius) + "px"  
    stick.style.top = (y + joystickRadius - stickRadius) + "px"  
}  

function handleMouseUp() {  
    joystickX=0  
    joystickY=0  
    stick.style.left = "50%"  
    stick.style.top = "50%"  
    stick.style.transform = "translate(-50%, -50%)"  
    document.removeEventListener("mousemove", handleMouseMove)  
    document.removeEventListener("mouseup", handleMouseUp)  
}  

// Fire button events  
fire.addEventListener("touchstart", (e) => {  
    e.preventDefault()  
    resumeAudio()  
    firing=true  
    shoot()  
    autoFire()  
})  

fire.addEventListener("touchend", (e) => {  
    e.preventDefault()  
    firing=false  
})  

fire.addEventListener("mousedown", (e) => {  
    e.preventDefault()  
    resumeAudio()  
    firing=true  
    shoot()  
    autoFire()  
})  

fire.addEventListener("mouseup", () => {  
    firing=false  
})  

fire.addEventListener("mouseleave", () => {  
    firing=false  
})  

// Prevent body scroll on any touch  
document.body.addEventListener('touchmove', (e) => {  
    e.preventDefault()  
}, { passive: false })  

// Ensure fullscreen on orientation change (just a safety)  
window.addEventListener('resize', () => {})  
})();  
</script>  

</body>  
</html>
