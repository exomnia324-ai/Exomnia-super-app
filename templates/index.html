<!DOCTYPE html>  
<html>  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">  
<title>Space Shooting</title>  
  
<style>  
* {  
    margin: 0;  
    padding: 0;  
    box-sizing: border-box;  
    -webkit-tap-highlight-color: transparent;  
    user-select: none;  
    -webkit-user-select: none;  
}  
  
html, body {  
    width: 100%;  
    height: 100%;  
    overflow: hidden;  
    position: fixed;  
    background: black;  
}  
  
body {  
    display: flex;  
    justify-content: center;  
    align-items: center;  
    font-family: Arial, sans-serif;  
}  
  
#gameContainer {  
    position: relative;  
    width: 100%;  
    max-width: 400px;  
    height: 100%;  
    max-height: 600px;  
    aspect-ratio: 2 / 3;  
    margin: auto;  
    background: black;  
    overflow: hidden;  
    border: 2px solid #333;  
    box-shadow: 0 0 20px rgba(0,255,255,0.2);  
}  
  
canvas {  
    position: absolute;  
    top: 0;  
    left: 0;  
    width: 100% !important;  
    height: 100% !important;  
    display: block;  
    background: black;  
    z-index: 1;  
}  
  
#uiOverlay {  
    position: absolute;  
    top: 0;  
    left: 0;  
    width: 100%;  
    height: 100%;  
    z-index: 2;  
    pointer-events: none;  
    padding: 12px 15px;  
    display: flex;  
    flex-direction: column;  
    justify-content: space-between;  
}  
  
#topBar {  
    display: flex;  
    justify-content: space-between;  
    align-items: center;  
    width: 100%;  
    pointer-events: none;  
    text-shadow: 0 0 5px rgba(0,0,0,0.8);  
    font-size: clamp(14px, 4vw, 18px);  
}  
  
#titleText {  
    color: #0ff;  
    background: rgba(0,50,50,0.7);  
    padding: 6px 12px;  
    border-radius: 20px;  
    border: 1px solid #0ff;  
    backdrop-filter: blur(2px);  
    font-weight: bold;  
    letter-spacing: 1px;  
    box-shadow: 0 0 10px rgba(0,255,255,0.3);  
}  
  
#statsText {  
    color: white;  
    background: rgba(0,0,0,0.7);  
    padding: 6px 12px;  
    border-radius: 20px;  
    border: 1px solid #ff0;  
    backdrop-filter: blur(2px);  
    font-weight: bold;  
    display: flex;  
    gap: 15px;  
}  
  
.life { color: #ff5555; }  
.score { color: #ffff55; }  
  
#controls {  
    position: absolute;  
    bottom: 15px;  
    left: 0;  
    width: 100%;  
    display: flex;  
    justify-content: space-between;  
    align-items: flex-end;  
    padding: 0 15px 10px 15px;  
    z-index: 3;  
    pointer-events: none;  
    box-sizing: border-box;  
}  
  
#joystick {  
    width: min(120px, 30vw);  
    height: min(120px, 30vw);  
    max-width: 120px;  
    max-height: 120px;  
    min-width: 80px;  
    min-height: 80px;  
    background: rgba(30, 30, 30, 0.7);  
    border-radius: 50%;  
    position: relative;  
    touch-action: none;  
    pointer-events: auto;  
    backdrop-filter: blur(4px);  
    border: 2px solid rgba(255, 255, 255, 0.3);  
    box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);  
    display: flex;  
    justify-content: center;  
    align-items: center;  
}  
  
#stick {  
    width: min(50px, 12vw);  
    height: min(50px, 12vw);  
    max-width: 50px;  
    max-height: 50px;  
    min-width: 35px;  
    min-height: 35px;  
    background: white;  
    border-radius: 50%;  
    position: absolute;  
    left: 50%;  
    top: 50%;  
    transform: translate(-50%, -50%);  
    transition: all 0.03s ease;  
    box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);  
    border: 2px solid #0ff;  
}  
  
#fire {  
    width: min(90px, 22vw);  
    height: min(90px, 22vw);  
    max-width: 90px;  
    max-height: 90px;  
    min-width: 70px;  
    min-height: 70px;  
    background: linear-gradient(145deg, #ff3333, #cc0000);  
    border-radius: 50%;  
    display: flex;  
    align-items: center;  
    justify-content: center;  
    font-size: min(24px, 6vw);  
    font-weight: bold;  
    color: white;  
    touch-action: none;  
    pointer-events: auto;  
    backdrop-filter: blur(4px);  
    border: 3px solid rgba(255, 255, 255, 0.6);  
    box-shadow: 0 0 25px rgba(255, 0, 0, 0.6), 0 5px 0 #990000;  
    text-transform: uppercase;  
    letter-spacing: 2px;  
    text-shadow: 0 2px 0 #990000;  
    transition: all 0.05s ease;  
}  

#fire:active {  
    transform: translateY(4px);  
    box-shadow: 0 0 30px rgba(255, 0, 0, 0.8), 0 1px 0 #990000;  
}  

/* Loading message */  
#loading {  
    position: absolute;  
    top: 50%;  
    left: 50%;  
    transform: translate(-50%, -50%);  
    color: #0ff;  
    font-size: 20px;  
    z-index: 10;  
    background: rgba(0,0,0,0.8);  
    padding: 20px;  
    border-radius: 10px;  
    border: 2px solid #0ff;  
}  
</style>  
</head>  
<body>  

<div id="gameContainer">  
    <canvas id="game"></canvas>  
    
    <div id="uiOverlay">  
        <div id="topBar">  
            <div id="titleText">🚀 SPACE SHOOTING</div>  
            <div id="statsText">  
                <span class="life">❤️ <span id="lifeValue">3</span></span>  
                <span class="score">🎁 <span id="scoreValue">0</span></span>  
            </div>  
        </div>  
    </div>  
    
    <div id="controls">  
        <div id="joystick">  
            <div id="stick"></div>  
        </div>  
        <div id="fire">FIRE</div>  
    </div>  
</div>  

<div id="loading">Loading...</div>  

<script>  
// Hide loading when ready  
window.addEventListener('load', () => {  
    document.getElementById('loading').style.display = 'none'  
})  

const canvas = document.getElementById("game")  
const ctx = canvas.getContext("2d")  

// Fixed game resolution (400x600 for game logic)  
const GAME_WIDTH = 400  
const GAME_HEIGHT = 600  

function resizeCanvas() {  
    canvas.width = GAME_WIDTH  
    canvas.height = GAME_HEIGHT  
}  

resizeCanvas()  
window.addEventListener('resize', resizeCanvas)  

// SOUND setup  
let audioCtx = null  

function initAudio() {  
    if (audioCtx) return  
    try {  
        audioCtx = new (window.AudioContext || window.webkitAudioContext)()  
    } catch(e) {  
        console.log("Web Audio API not supported")  
    }  
}  

function playShoot() {  
    if (!audioCtx) return  
    try {  
        let osc = audioCtx.createOscillator()  
        let gain = audioCtx.createGain()  
        osc.type = "square"  
        osc.frequency.value = 600  
        gain.gain.value = 0.1  
        osc.connect(gain)  
        gain.connect(audioCtx.destination)  
        osc.start()  
        osc.stop(audioCtx.currentTime + 0.05)  
    } catch(e) {}  
}  

function playExplosion() {  
    if (!audioCtx) return  
    try {  
        let osc = audioCtx.createOscillator()  
        let gain = audioCtx.createGain()  
        osc.type = "sawtooth"  
        osc.frequency.setValueAtTime(200, audioCtx.currentTime)  
        osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3)  
        gain.gain.value = 0.2  
        osc.connect(gain)  
        gain.connect(audioCtx.destination)  
        osc.start()  
        osc.stop(audioCtx.currentTime + 0.3)  
    } catch(e) {}  
}  

function playGameOver() {  
    if (!audioCtx) return  
    try {  
        let osc = audioCtx.createOscillator()  
        let gain = audioCtx.createGain()  
        osc.type = "triangle"  
        osc.frequency.setValueAtTime(300, audioCtx.currentTime)  
        osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.6)  
        gain.gain.value = 0.2  
        osc.connect(gain)  
        gain.connect(audioCtx.destination)  
        osc.start()  
        osc.stop(audioCtx.currentTime + 0.6)  
    } catch(e) {}  
}  

// Game state  
let player = {  
    x: 180,  
    y: 520,  
    w: 40,  
    h: 40,  
    speed: 4,  
    life: 3  
}  

let bullets = []  
let enemyBullets = []  
let enemies = []  
let explosions = []  
let stars = []  

let score = 0  
let joystickX = 0  
let joystickY = 0  
let firing = false  
let gameActive = true  

// Create stars  
for (let i = 0; i < 80; i++) {  
    stars.push({  
        x: Math.random() * GAME_WIDTH,  
        y: Math.random() * GAME_HEIGHT,  
        speed: Math.random() * 2 + 1  
    })  
}  

// Game intervals  
let enemyInterval, enemyShootInterval  

function startGameIntervals() {  
    enemyInterval = setInterval(() => {  
        if (gameActive) {  
            enemies.push({  
                x: Math.random() * (GAME_WIDTH - 40),  
                y: -20,  
                w: 30,  
                h: 30,  
                speed: 2  
            })  
        }  
    }, 1500)  

    enemyShootInterval = setInterval(() => {  
        if (gameActive) {  
            for (let e of enemies) {  
                if (e && e.x && e.y) {  
                    enemyBullets.push({  
                        x: e.x + e.w / 2,  
                        y: e.y + e.h,  
                        speed: 3  
                    })  
                }  
            }  
        }  
    }, 2000)  
}  

startGameIntervals()  

function shoot() {  
    if (!gameActive) return  
    playShoot()  
    bullets.push({  
        x: player.x + 18,  
        y: player.y,  
        speed: 6  
    })  
}  

function autoFire() {  
    if (firing && gameActive) {  
        shoot()  
        setTimeout(autoFire, 150)  
    }  
}  

function drawStars() {  
    ctx.fillStyle = "white"  
    for (let s of stars) {  
        s.y += s.speed  
        if (s.y > GAME_HEIGHT) {  
            s.y = 0  
            s.x = Math.random() * GAME_WIDTH  
        }  
        ctx.fillRect(s.x, s.y, 2, 2)  
    }  
}  

function drawPlayer() {  
    ctx.save()  
    ctx.translate(player.x + 20, player.y + 20)  
    
    // Wings  
    ctx.fillStyle = "#00e5ff"  
    ctx.beginPath()  
    ctx.moveTo(-20, 10)  
    ctx.lineTo(-5, -15)  
    ctx.lineTo(-5, 15)  
    ctx.fill()  
    ctx.beginPath()  
    ctx.moveTo(20, 10)  
    ctx.lineTo(5, -15)  
    ctx.lineTo(5, 15)  
    ctx.fill()  
    
    // Body  
    ctx.fillStyle = "#0ff"  
    ctx.beginPath()  
    ctx.moveTo(0, -20)  
    ctx.lineTo(10, 10)  
    ctx.lineTo(-10, 10)  
    ctx.closePath()  
    ctx.fill()  
    
    // Cockpit  
    ctx.fillStyle = "blue"  
    ctx.beginPath()  
    ctx.arc(0, -5, 5, 0, Math.PI * 2)  
    ctx.fill()  
    
    // Engine  
    ctx.fillStyle = "orange"  
    ctx.beginPath()  
    ctx.moveTo(-6, 10)  
    ctx.lineTo(0, 20)  
    ctx.lineTo(6, 10)  
    ctx.fill()  
    
    ctx.restore()  
}  

function drawBullets() {  
    ctx.fillStyle = "yellow"  
    for (let i = bullets.length - 1; i >= 0; i--) {  
        let b = bullets[i]  
        b.y -= b.speed  
        ctx.fillRect(b.x, b.y, 4, 10)  
        if (b.y < 0) bullets.splice(i, 1)  
    }  
}  

function drawEnemyBullets() {  
    ctx.fillStyle = "red"  
    for (let i = enemyBullets.length - 1; i >= 0; i--) {  
        let b = enemyBullets[i]  
        b.y += b.speed  
        ctx.fillRect(b.x, b.y, 4, 10)  
        if (b.y > GAME_HEIGHT) enemyBullets.splice(i, 1)  
    }  
}  

function drawEnemies() {  
    ctx.fillStyle = "lime"  
    for (let i = enemies.length - 1; i >= 0; i--) {  
        let e = enemies[i]  
        e.y += e.speed  
        ctx.beginPath()  
        ctx.moveTo(e.x + 15, e.y)  
        ctx.lineTo(e.x + 30, e.y + 30)  
        ctx.lineTo(e.x, e.y + 30)  
        ctx.closePath()  
        ctx.fill()  
        if (e.y > GAME_HEIGHT + 20) enemies.splice(i, 1)  
    }  
}  

function drawExplosions() {  
    ctx.fillStyle = "orange"  
    for (let i = explosions.length - 1; i >= 0; i--) {  
        let ex = explosions[i]  
        ctx.beginPath()  
        ctx.arc(ex.x, ex.y, ex.size, 0, Math.PI * 2)  
        ctx.fill()  
        ex.size += 1  
        if (ex.size > 15) explosions.splice(i, 1)  
    }  
}  

function updateUI() {  
    document.getElementById('lifeValue').textContent = player.life  
    document.getElementById('scoreValue').textContent = score  
}  

function bulletCollision() {  
    for (let i = bullets.length - 1; i >= 0; i--) {  
        for (let j = enemies.length - 1; j >= 0; j--) {  
            let b = bullets[i]  
            let e = enemies[j]  
            if (  
                b && e &&  
                b.x < e.x + e.w &&  
                b.x + 4 > e.x &&  
                b.y < e.y + e.h &&  
                b.y + 10 > e.y  
            ) {  
                explosions.push({ x: e.x + 15, y: e.y + 15, size: 2 })  
                playExplosion()  
                score += 10  
                bullets.splice(i, 1)  
                enemies.splice(j, 1)  
                updateUI()  
                break  
            }  
        }  
    }  
}  

function bulletVsBullet() {  
    for (let i = bullets.length - 1; i >= 0; i--) {  
        for (let j = enemyBullets.length - 1; j >= 0; j--) {  
            let b1 = bullets[i]  
            let b2 = enemyBullets[j]  
            if (  
                b1 && b2 &&  
                b1.x < b2.x + 4 &&  
                b1.x + 4 > b2.x &&  
                b1.y < b2.y + 10 &&  
                b1.y + 10 > b2.y  
            ) {  
                explosions.push({ x: b1.x, y: b1.y, size: 2 })  
                playExplosion()  
                bullets.splice(i, 1)  
                enemyBullets.splice(j, 1)  
                break  
            }  
        }  
    }  
}  

function shipCollision() {  
    for (let i = enemies.length - 1; i >= 0; i--) {  
        let e = enemies[i]  
        if (  
            player.x < e.x + e.w &&  
            player.x + player.w > e.x &&  
            player.y < e.y + e.h &&  
            player.y + player.h > e.y  
        ) {  
            explosions.push({ x: player.x + 20, y: player.y + 20, size: 2 })  
            enemies.splice(i, 1)  
            player.life--  
            updateUI()  
            
            if (player.life <= 0) {  
                gameActive = false  
                playGameOver()  
                setTimeout(() => {  
                    alert("Game Over\nScore: " + score)  
                    location.reload()  
                }, 500)  
            }  
        }  
    }  
}  

function updatePlayer() {  
    player.x += joystickX * player.speed  
    player.y += joystickY * player.speed  
    player.x = Math.max(0, Math.min(GAME_WIDTH - player.w, player.x))  
    player.y = Math.max(0, Math.min(GAME_HEIGHT - player.h, player.y))  
}  

function gameLoop() {  
    if (!gameActive) return  
    
    ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT)  
    drawStars()  
    updatePlayer()  
    drawPlayer()  
    drawBullets()  
    drawEnemyBullets()  
    drawEnemies()  
    drawExplosions()  
    bulletCollision()  
    bulletVsBullet()  
    shipCollision()  
    
    requestAnimationFrame(gameLoop)  
}  

gameLoop()  

// Touch controls  
const joystick = document.getElementById("joystick")  
const stick = document.getElementById("stick")  
const fire = document.getElementById("fire")  

function handleJoystickStart(e) {  
    e.preventDefault()  
    initAudio()  
}  

function handleJoystickMove(e) {  
    e.preventDefault()  
    let rect = joystick.getBoundingClientRect()  
    let touch = e.touches ? e.touches[0] : e  
    
    let centerX = rect.left + rect.width / 2  
    let centerY = rect.top + rect.height / 2  
    let maxRadius = rect.width / 2 - stick.offsetWidth / 2  
    
    let x = touch.clientX - centerX  
    let y = touch.clientY - centerY  
    
    // Limit to circle
    let distance = Math.sqrt(x * x + y * y)  
    if (distance > maxRadius) {  
        x = x * maxRadius / distance  
        y = y * maxRadius / distance  
    }  
    
    joystickX = x / maxRadius  
    joystickY = y / maxRadius  
    
    stick.style.left = (x + rect.width / 2 - stick.offsetWidth / 2) + "px"  
    stick.style.top = (y + rect.height / 2 - stick.offsetHeight / 2) + "px"  
}  

function handleJoystickEnd(e) {  
    e.preventDefault()  
    joystickX = 0  
    joystickY = 0  
    stick.style.left = "50%"  
    stick.style.top = "50%"  
    stick.style.transform = "translate(-50%, -50%)"  
}  

// Touch events  
joystick.addEventListener("touchstart", handleJoystickStart)  
joystick.addEventListener("touchmove", handleJoystickMove)  
joystick.addEventListener("touchend", handleJoystickEnd)  
joystick.addEventListener("touchcancel", handleJoystickEnd)  

// Fire button  
fire.addEventListener("touchstart", (e) => {  
    e.preventDefault()  
    initAudio()  
    if (audioCtx && audioCtx.state === 'suspended') {  
        audioCtx.resume()  
    }  
    firing = true  
    shoot()  
    autoFire()  
})  

fire.addEventListener("touchend", (e) => {  
    e.preventDefault()  
    firing = false  
})  

fire.addEventListener("touchcancel", (e) => {  
    e.preventDefault()  
    firing = false  
})  

// Mouse controls for testing  
joystick.addEventListener("mousedown", (e) => {  
    e.preventDefault()  
    initAudio()  
    handleJoystickMove(e)  
    
    function onMouseMove(e) {  
        e.preventDefault()  
        handleJoystickMove(e)  
    }  
    
    function onMouseUp(e) {  
        e.preventDefault()  
        handleJoystickEnd(e)  
        document.removeEventListener("mousemove", onMouseMove)  
        document.removeEventListener("mouseup", onMouseUp)  
    }  
    
    document.addEventListener("mousemove", onMouseMove)  
    document.addEventListener("mouseup", onMouseUp)  
})  

fire.addEventListener("mousedown", (e) => {  
    e.preventDefault()  
    initAudio()  
    if (audioCtx && audioCtx.state === 'suspended') {  
        audioCtx.resume()  
    }  
    firing = true  
    shoot()  
    autoFire()  
})  

fire.addEventListener("mouseup", () => {  
    firing = false  
})  

fire.addEventListener("mouseleave", () => {  
    firing = false  
})  

// Prevent default touch actions on the whole page  
document.body.addEventListener("touchstart", (e) => {  
    if (e.target === canvas) {  
        e.preventDefault()  
    }  
}, { passive: false })  

document.body.addEventListener("touchmove", (e) => {  
    if (e.target === canvas || e.target === joystick || e.target === fire) {  
        e.preventDefault()  
    }  
}, { passive: false })  

</script>  

</body>  
</html>
