<!DOCTYPE html>  
<html>  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">  
<title>Space Shooting - ULTIMATE EDITION V2.0</title>  
  
<style>  
* {  
    margin: 0;  
    padding: 0;  
    box-sizing: border-box;  
    -webkit-tap-highlight-color: transparent;  
    user-select: none;  
    -webkit-user-select: none;  
}  

html, body {  
    width: 100%;  
    height: 100%;  
    overflow: hidden;  
    position: fixed;  
    background: black;  
}  

body {  
    display: flex;  
    justify-content: center;  
    align-items: center;  
    font-family: 'Arial', sans-serif;  
}  

#gameContainer {  
    position: relative;  
    width: 100%;  
    height: 100%;  
    aspect-ratio: 2 / 3;  
    background: black;  
    overflow: hidden;  
    border: 2px solid #00ffff;  
    box-shadow: 0 0 30px #00ffff, 0 0 60px #00ffff33;  
    border-radius: 10px;  
}  

canvas {  
    position: absolute;  
    top: 0;  
    left: 0;  
    width: 100% !important;  
    height: 100% !important;  
    display: block;  
    background: black;  
    z-index: 1;  
}  

#uiOverlay {  
    position: absolute;  
    top: 0;  
    left: 0;  
    width: 100%;  
    height: 100%;  
    z-index: 2;  
    pointer-events: none;  
    padding: 12px 15px;  
    display: flex;  
    flex-direction: column;  
    justify-content: space-between;  
}  

#topBar {  
    display: flex;  
    justify-content: space-between;  
    align-items: center;  
    width: 100%;  
    pointer-events: none;  
    text-shadow: 0 0 5px rgba(0,0,0,0.8);  
    font-size: clamp(14px, 4vw, 18px);  
}  

#titleText {  
    color: #0ff;  
    background: linear-gradient(90deg, #003333, #001111);  
    padding: 6px 15px;  
    border-radius: 25px;  
    border: 1px solid #0ff;  
    backdrop-filter: blur(4px);  
    font-weight: bold;  
    letter-spacing: 2px;  
    box-shadow: 0 0 15px #0ff;  
    animation: glow 2s ease-in-out infinite;  
}  

@keyframes glow {
    0%, 100% { box-shadow: 0 0 15px #0ff; }
    50% { box-shadow: 0 0 25px #0ff, 0 0 35px #0ff; }
}

#statsText {  
    color: white;  
    background: rgba(0,0,0,0.7);  
    padding: 6px 15px;  
    border-radius: 25px;  
    border: 1px solid #ffaa00;  
    backdrop-filter: blur(4px);  
    font-weight: bold;  
    display: flex;  
    gap: 20px;  
    box-shadow: 0 0 15px #ffaa00;  
}  

.life { color: #ff5555; text-shadow: 0 0 10px #ff0000; }  
.score { color: #ffff55; text-shadow: 0 0 10px #ffff00; }  

#powerups {
    position: absolute;
    top: 70px;
    left: 15px;
    display: flex;
    gap: 10px;
    pointer-events: none;
    flex-wrap: wrap;
    max-width: 200px;
}

.powerup-icon {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    animation: pulse 1s ease-in-out infinite;
    box-shadow: 0 0 15px currentColor;
}

@keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.1); opacity: 0.8; }
}

#waveInfo {
    position: absolute;
    top: 70px;
    right: 15px;
    color: #ffaa00;
    font-size: clamp(12px, 3.5vw, 16px);
    background: rgba(0,0,0,0.6);
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid #ffaa00;
    backdrop-filter: blur(4px);
    box-shadow: 0 0 15px #ffaa00;
    pointer-events: none;
}

#comboCounter {
    position: absolute;
    top: 120px;
    left: 50%;
    transform: translateX(-50%);
    color: #ffaa00;
    font-size: 24px;
    font-weight: bold;
    text-shadow: 0 0 10px #ffaa00, 0 0 20px #ff5500;
    animation: comboPop 0.5s ease-out;
    pointer-events: none;
    z-index: 5;
}

@keyframes comboPop {
    0% { transform: translateX(-50%) scale(0.5); opacity: 0; }
    50% { transform: translateX(-50%) scale(1.2); opacity: 1; }
    100% { transform: translateX(-50%) scale(1); opacity: 1; }
}

#bossHealthBar {
    position: absolute;
    top: 110px;
    left: 15px;
    right: 15px;
    height: 20px;
    background: rgba(0,0,0,0.7);
    border: 2px solid #ff0000;
    border-radius: 10px;
    overflow: hidden;
    display: none;
    z-index: 5;
}

#bossHealthFill {
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, #ff0000, #ff5500);
    transition: width 0.3s ease;
}

#bossName {
    position: absolute;
    top: 85px;
    left: 50%;
    transform: translateX(-50%);
    color: #ff0000;
    font-size: 18px;
    font-weight: bold;
    text-shadow: 0 0 10px #ff0000;
    display: none;
    z-index: 5;
    white-space: nowrap;
}

#controls {  
    position: absolute;  
    bottom: 15px;  
    left: 0;  
    width: 100%;  
    display: flex;  
    justify-content: space-between;  
    align-items: flex-end;  
    padding: 0 15px 10px 15px;  
    z-index: 3;  
    pointer-events: none;  
    box-sizing: border-box;  
}  

/* ========== UPDATED JOYSTICK - SMOOTH ANALOG ========== */
#joystick {  
    width: min(140px, 34vw);  
    height: min(140px, 34vw);  
    max-width: 140px;  
    max-height: 140px;  
    min-width: 100px;  
    min-height: 100px;  
    background: rgba(20, 20, 40, 0.85);  
    border-radius: 50%;  
    position: relative;  
    touch-action: none;  
    pointer-events: auto;  
    backdrop-filter: blur(6px);  
    border: 2px solid rgba(0, 255, 255, 0.7);  
    box-shadow: 0 0 30px rgba(0, 255, 255, 0.6), inset 0 0 20px rgba(0, 255, 255, 0.3);  
    display: flex;  
    justify-content: center;  
    align-items: center;  
    transition: box-shadow 0.1s ease;
}  

#joystick::before {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.2), transparent 80%);
    pointer-events: none;
}

#stick {  
    width: min(60px, 15vw);  
    height: min(60px, 15vw);  
    max-width: 60px;  
    max-height: 60px;  
    min-width: 45px;  
    min-height: 45px;  
    background: radial-gradient(circle at 35% 35%, #ffffff, #aaddff, #88ccff);  
    border-radius: 50%;  
    position: absolute;  
    left: 50%;  
    top: 50%;  
    transform: translate(-50%, -50%);  
    /* transition removed for real-time smoothness - now updated directly via JS transform */
    box-shadow: 0 0 25px rgba(255, 255, 255, 0.9), 0 0 45px #0ff;  
    border: 2px solid #ffffff;  
    will-change: transform;
}  
/* ==================================================== */

#fire {  
    width: min(100px, 25vw);  
    height: min(100px, 25vw);  
    max-width: 100px;  
    max-height: 100px;  
    min-width: 80px;  
    min-height: 80px;  
    background: linear-gradient(145deg, #ff4444, #aa0000);  
    border-radius: 50%;  
    display: flex;  
    align-items: center;  
    justify-content: center;  
    font-size: min(26px, 6.5vw);  
    font-weight: bold;  
    color: white;  
    touch-action: none;  
    pointer-events: auto;  
    backdrop-filter: blur(4px);  
    border: 3px solid rgba(255, 200, 200, 0.8);  
    box-shadow: 0 0 30px rgba(255, 0, 0, 0.7), 0 6px 0 #550000;  
    text-transform: uppercase;  
    letter-spacing: 2px;  
    text-shadow: 0 2px 0 #550000, 0 0 10px #ffffff;  
    transition: all 0.05s ease;  
    position: relative;
    overflow: hidden;
}  

#fire::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
    animation: rotate 4s linear infinite;
}

@keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

#fire:active {  
    transform: translateY(5px);  
    box-shadow: 0 0 40px rgba(255, 0, 0, 0.9), 0 1px 0 #550000;  
}  

#specialButton {
    position: absolute;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    width: min(70px, 18vw);
    height: min(70px, 18vw);
    max-width: 70px;
    max-height: 70px;
    min-width: 55px;
    min-height: 55px;
    background: linear-gradient(145deg, #aa44ff, #5500aa);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: min(20px, 5vw);
    color: white;
    touch-action: none;
    pointer-events: auto;
    border: 3px solid rgba(255, 255, 255, 0.8);
    box-shadow: 0 0 30px #aa44ff, 0 6px 0 #330066;
    text-shadow: 0 2px 0 #330066;
    transition: all 0.05s ease;
    z-index: 4;
    font-weight: bold;
}

#specialButton:active {
    transform: translateX(-50%) translateY(5px);
    box-shadow: 0 0 40px #aa44ff, 0 1px 0 #330066;
}

#specialButton.disabled {
    opacity: 0.5;
    pointer-events: none;
}

#loading {  
    position: absolute;  
    top: 50%;  
    left: 50%;  
    transform: translate(-50%, -50%);  
    color: #0ff;  
    font-size: 24px;  
    z-index: 10;  
    background: rgba(0,0,0,0.9);  
    padding: 25px 40px;  
    border-radius: 15px;  
    border: 2px solid #0ff;  
    box-shadow: 0 0 50px #0ff;  
    animation: pulse 1.5s ease-in-out infinite;
}  

#pauseMenu {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(5px);
    z-index: 100;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 20px;
}

.pauseButton {
    padding: 15px 40px;
    font-size: 24px;
    background: linear-gradient(145deg, #0ff, #00aaff);
    border: none;
    border-radius: 50px;
    color: black;
    font-weight: bold;
    box-shadow: 0 0 30px #0ff;
    cursor: pointer;
    transition: all 0.2s ease;
    min-width: 200px;
    text-align: center;
}

.pauseButton:hover {
    transform: scale(1.1);
    box-shadow: 0 0 50px #0ff;
}

.pauseButton.red {
    background: linear-gradient(145deg, #ff4444, #aa0000);
    box-shadow: 0 0 30px #ff0000;
    color: white;
}
</style>  
</head>  
<body>  

<div id="gameContainer">  
    <canvas id="game"></canvas>  
    
    <div id="uiOverlay">  
        <div id="topBar">  
            <div id="titleText">EXOMNIA AIRCRAFT v5.0</div>  
            <div id="statsText">  
                <span class="life">❤️ <span id="lifeValue">3</span></span>  
                <span class="score">🎁 <span id="scoreValue">0</span></span>  
            </div>  
        </div>  
        
        <div id="powerups"></div>
        
        <div id="waveInfo">
            🌊 WAVE <span id="waveNumber">1</span>
        </div>
        
        <div id="comboCounter"></div>
        
        <div id="bossHealthBar">
            <div id="bossHealthFill"></div>
        </div>
        <div id="bossName">🚀 BOSS: DESTROYER</div>
    </div>  
    
    <div id="controls">  
        <div id="joystick">  
            <div id="stick"></div>  
        </div>  
        <div id="specialButton">✨</div>
        <div id="fire">FIRE</div>  
    </div>  
    
    <div id="pauseMenu">
        <div class="pauseButton" onclick="resumeGame()">▶ RESUME</div>
        <div class="pauseButton" onclick="restartGame()">🔄 RESTART</div>
        <div class="pauseButton red" onclick="quitGame()">⏹ QUIT</div>
    </div>
</div>  

<div id="loading">LOADING...</div>  

<script>  
// Hide loading when ready  
window.addEventListener('load', () => {  
    document.getElementById('loading').style.display = 'none'  
})  

const canvas = document.getElementById("game")  
const ctx = canvas.getContext("2d")  

// Game constants  
const GAME_WIDTH = 400  
const GAME_HEIGHT = 600  

function resizeCanvas() {  
    canvas.width = GAME_WIDTH  
    canvas.height = GAME_HEIGHT  
}  

resizeCanvas()  
window.addEventListener('resize', resizeCanvas)  

// Sound system  
let audioCtx = null  

function initAudio() {  
    if (audioCtx) return  
    try {  
        audioCtx = new (window.AudioContext || window.webkitAudioContext)()  
    } catch(e) {  
        console.log("Web Audio API not supported")  
    }  
}  

// Enhanced sound effects  
function playShoot() {  
    if (!audioCtx) return  
    try {  
        let osc = audioCtx.createOscillator()  
        let gain = audioCtx.createGain()  
        osc.type = "square"  
        osc.frequency.value = 800  
        gain.gain.value = 0.1  
        osc.connect(gain)  
        gain.connect(audioCtx.destination)  
        osc.start()  
        osc.stop(audioCtx.currentTime + 0.03)  
    } catch(e) {}  
}  

function playExplosion() {  
    if (!audioCtx) return  
    try {  
        let osc = audioCtx.createOscillator()  
        let gain = audioCtx.createGain()  
        osc.type = "sawtooth"  
        osc.frequency.setValueAtTime(300, audioCtx.currentTime)  
        osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.2)  
        gain.gain.value = 0.15  
        osc.connect(gain)  
        gain.connect(audioCtx.destination)  
        osc.start()  
        osc.stop(audioCtx.currentTime + 0.2)  
    } catch(e) {}  
}  

function playGameOver() {  
    if (!audioCtx) return  
    try {  
        let osc = audioCtx.createOscillator()  
        let gain = audioCtx.createGain()  
        osc.type = "triangle"  
        osc.frequency.setValueAtTime(400, audioCtx.currentTime)  
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.5)  
        gain.gain.value = 0.2  
        osc.connect(gain)  
        gain.connect(audioCtx.destination)  
        osc.start()  
        osc.stop(audioCtx.currentTime + 0.5)  
    } catch(e) {}  
}  

function playPowerup() {
    if (!audioCtx) return
    try {
        let osc = audioCtx.createOscillator()
        let gain = audioCtx.createGain()
        osc.type = "sine"
        osc.frequency.setValueAtTime(600, audioCtx.currentTime)
        osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1)
        gain.gain.value = 0.1
        osc.connect(gain)
        gain.connect(audioCtx.destination)
        osc.start()
        osc.stop(audioCtx.currentTime + 0.1)
    } catch(e) {}
}

function playBossWarning() {
    if (!audioCtx) return
    try {
        let osc = audioCtx.createOscillator()
        let gain = audioCtx.createGain()
        osc.type = "sawtooth"
        osc.frequency.setValueAtTime(200, audioCtx.currentTime)
        osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.5)
        gain.gain.value = 0.3
        osc.connect(gain)
        gain.connect(audioCtx.destination)
        osc.start()
        osc.stop(audioCtx.currentTime + 0.5)
    } catch(e) {}
}

function playSpecialAttack() {
    if (!audioCtx) return
    try {
        let osc = audioCtx.createOscillator()
        let gain = audioCtx.createGain()
        osc.type = "triangle"
        osc.frequency.setValueAtTime(100, audioCtx.currentTime)
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.3)
        gain.gain.value = 0.2
        osc.connect(gain)
        gain.connect(audioCtx.destination)
        osc.start()
        osc.stop(audioCtx.currentTime + 0.3)
        
        // Second oscillator for harmony
        let osc2 = audioCtx.createOscillator()
        let gain2 = audioCtx.createGain()
        osc2.type = "sine"
        osc2.frequency.setValueAtTime(200, audioCtx.currentTime)
        osc2.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.3)
        gain2.gain.value = 0.1
        osc2.connect(gain2)
        gain2.connect(audioCtx.destination)
        osc2.start()
        osc2.stop(audioCtx.currentTime + 0.3)
    } catch(e) {}
}

function playLevelUp() {
    if (!audioCtx) return
    try {
        let osc = audioCtx.createOscillator()
        let gain = audioCtx.createGain()
        osc.type = "sine"
        osc.frequency.setValueAtTime(400, audioCtx.currentTime)
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.2)
        osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.4)
        gain.gain.value = 0.2
        osc.connect(gain)
        gain.connect(audioCtx.destination)
        osc.start()
        osc.stop(audioCtx.currentTime + 0.4)
    } catch(e) {}
}

function playHit() {
    if (!audioCtx) return
    try {
        let osc = audioCtx.createOscillator()
        let gain = audioCtx.createGain()
        osc.type = "sine"
        osc.frequency.value = 200
        gain.gain.value = 0.05
        osc.connect(gain)
        gain.connect(audioCtx.destination)
        osc.start()
        osc.stop(audioCtx.currentTime + 0.05)
    } catch(e) {}
}

function playNewWave() {
    if (!audioCtx) return
    try {
        let osc = audioCtx.createOscillator()
        let gain = audioCtx.createGain()
        osc.type = "triangle"
        osc.frequency.setValueAtTime(300, audioCtx.currentTime)
        osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.3)
        gain.gain.value = 0.2
        osc.connect(gain)
        gain.connect(audioCtx.destination)
        osc.start()
        osc.stop(audioCtx.currentTime + 0.3)
    } catch(e) {}
}

// Game state  
let player = {  
    x: 180,  
    y: 520,  
    w: 40,  
    h: 40,  
    speed: 4,  
    life: 3,  
    maxLife: 5,
    powerups: {
        rapidFire: false,
        spreadShot: false,
        shield: false,
        tripleShot: false,
        homingMissile: false,
        laserBeam: false,
        timeSlow: false,
        vampire: false,
        chainLightning: false,
        drone: false,
        phaseShift: false
    },
    powerupTimers: {},
    specialMeter: 0,
    maxSpecial: 100,
    experience: 0,
    level: 1,
    skillPoints: 0,
    skills: {
        damage: 1,
        fireRate: 1,
        speed: 1,
        critical: 0,
        lifesteal: 0,
        multishot: 0
    },
    drones: [],
    phaseShiftActive: false,
    phaseShiftTimer: null
}  

let bullets = []  
let enemyBullets = []  
let enemies = []  
let explosions = []  
let powerups = []  
let stars = []  
let missiles = []  
let particles = []  
let laserBeams = []  
let blackHoles = []  
let satellites = []  
let mines = []  
let chainLightning = []  
let asteroids = []  
let wormholes = []  
let debris = []  
let forceField = null

let score = 0  
let joystickX = 0  
let joystickY = 0  
let firing = false  
let gameActive = true  
let gamePaused = false  
let wave = 1  
let enemiesKilled = 0  
let enemiesForNextWave = 10  
let combo = 0  
let comboTimeout = null  
let bossActive = false  
let boss = null  
let timeSlowActive = false  
let timeSlowTimer = null  
let achievements = []  
let dailyChallenges = []
let highScore = localStorage.getItem('highScore') ? parseInt(localStorage.getItem('highScore')) : 0
let totalKills = 0
let totalPlayTime = 0
let lastTimestamp = 0
let difficultyMultiplier = 1

// Powerup types  
const POWERUP_TYPES = {
    RAPID_FIRE: { color: '#ff00ff', symbol: '⚡', duration: 5000 },
    SPREAD_SHOT: { color: '#00ff00', symbol: '✸', duration: 5000 },
    SHIELD: { color: '#00ffff', symbol: '🛡️', duration: 5000 },
    TRIPLE_SHOT: { color: '#ffff00', symbol: '🔱', duration: 5000 },
    HOMING_MISSILE: { color: '#ff8800', symbol: '🎯', duration: 5000 },
    LASER_BEAM: { color: '#ff00aa', symbol: '⚡', duration: 4000 },
    TIME_SLOW: { color: '#00aaff', symbol: '⏱️', duration: 3000 },
    VAMPIRE: { color: '#880000', symbol: '🧛', duration: 5000 },
    CHAIN_LIGHTNING: { color: '#ffff00', symbol: '⚡⚡', duration: 5000 },
    DRONE: { color: '#00aa00', symbol: '🚁', duration: 8000 },
    PHASE_SHIFT: { color: '#aa00aa', symbol: '👻', duration: 3000 },
    HEALTH: { color: '#ff5555', symbol: '❤️', duration: 0 },
    SPECIAL: { color: '#aa44ff', symbol: '✨', duration: 0 },
    NUKE: { color: '#ffaa00', symbol: '💣', duration: 0 },
    BLACK_HOLE: { color: '#aa00aa', symbol: '🕳️', duration: 0 },
    REPAIR: { color: '#00ff00', symbol: '🔧', duration: 0 },
    SCORE_BOOST: { color: '#ffff00', symbol: '💰', duration: 10000 }
}

// Achievement definitions  
const ACHIEVEMENTS = {
    FIRST_BLOOD: { name: 'First Blood', requirement: 'Kill first enemy', reward: 100 },
    COMBO_MASTER: { name: 'Combo Master', requirement: 'Get 20x combo', reward: 500 },
    BOSS_SLAYER: { name: 'Boss Slayer', requirement: 'Defeat first boss', reward: 1000 },
    SURVIVOR: { name: 'Survivor', requirement: 'Reach wave 10', reward: 2000 },
    COLLECTOR: { name: 'Collector', requirement: 'Collect 50 powerups', reward: 1000 },
    SHARPSHOOTER: { name: 'Sharpshooter', requirement: 'Get 1000 kills', reward: 5000 },
    INVINCIBLE: { name: 'Invincible', requirement: 'Reach wave 5 without losing life', reward: 3000 },
    VETERAN: { name: 'Veteran', requirement: 'Reach level 10', reward: 4000 },
    PERFECTIONIST: { name: 'Perfectionist', requirement: 'Get 50x combo', reward: 10000 }
}

// Create stars with parallax effect  
for (let i = 0; i < 200; i++) {  
    stars.push({  
        x: Math.random() * GAME_WIDTH,  
        y: Math.random() * GAME_HEIGHT,  
        speed: Math.random() * 3 + 0.5,

// Game intervals  
let enemyInterval, enemyShootInterval, powerupInterval, satelliteInterval, asteroidInterval  

function startGameIntervals() {  
    // Enemy spawn with wave difficulty  
    enemyInterval = setInterval(() => {  
        if (gameActive && !gamePaused && !bossActive) {  
            let enemyCount = Math.min(3 + Math.floor(wave / 1.5), 12)  
            for (let i = 0; i < enemyCount; i++) {  
                setTimeout(() => {  
                    if (gameActive && !gamePaused && !bossActive) {  
                        spawnEnemy()  
                    }  
                }, i * 150)  
            }  
        }  
    }, 2000 - Math.min(wave * 80, 1200))  

    // Enemy shooting with wave difficulty  
    enemyShootInterval = setInterval(() => {  
        if (gameActive && !gamePaused) {  
            for (let e of enemies) {  
                if (e && Math.random() < 0.7 + wave * 0.02) {  
                    enemyShoot(e)  
                }  
            }  
        }  
    }, 1800 - Math.min(wave * 40, 1200))  

    // Powerup spawn  
    powerupInterval = setInterval(() => {  
        if (gameActive && !gamePaused && Math.random() < 0.5) {  
            spawnPowerup()  
        }  
    }, 3000)  

    // Satellite spawn (support units)  
    satelliteInterval = setInterval(() => {  
        if (gameActive && !gamePaused && wave > 3 && Math.random() < 0.4) {  
            spawnSatellite()  
        }  
    }, 7000)
    
    // Asteroid spawn  
    asteroidInterval = setInterval(() => {  
        if (gameActive && !gamePaused && wave > 2 && Math.random() < 0.3) {  
            spawnAsteroid()  
        }  
    }, 5000)
}  

startGameIntervals()  

// Spawn functions  
function spawnEnemy() {  
    let type = 'normal'
    let rand = Math.random()
    if (rand < 0.1) type = 'elite'
    else if (rand < 0.3) type = 'fast'
    else if (rand < 0.4 && wave > 2) type = 'shielded'
    else if (rand < 0.5 && wave > 4) type = 'kamikaze'
    else if (rand < 0.6 && wave > 6) type = 'stealth'
    else if (rand < 0.7 && wave > 8) type = 'healer'
    
    let enemy = {  
        x: Math.random() * (GAME_WIDTH - 40),  
        y: -20 - Math.random() * 50,  
        w: 30,  
        h: 30,  
        speed: 2 + wave * 0.3,
        hp: 1,
        maxHp: 1,
        type: type,
        pattern: Math.floor(Math.random() * 4),
        angle: 0,
        shield: 0,
        shieldRegen: 0,
        design: Math.floor(Math.random() * 8), // More ship designs
        engineGlow: 0,
        wingAngle: 0,
        stealthAlpha: 1,
        healTimer: 0,

    if (type === 'fast') {
        enemy.speed = 4 + wave * 0.3
        enemy.color = '#ffaa00'
        enemy.design = 1
        enemy.experienceValue = 15
    } else if (type === 'elite') {

        enemy.speed = 1.5 + wave * 0.2
        enemy.color = '#ff5555'
        enemy.w = 40

        enemy.speed = 1.8 + wave * 0.2
        enemy.color = '#00aaff'

function enemyShoot(e) {  
    let bulletCount = 1
    if (e.type === 'elite') bulletCount = 3
    else if (e.type === 'shielded') bulletCount = 2
    else if (wave > 5) bulletCount = 2
    else if (e.type === 'stealth') bulletCount = 4
    
    for (let i = 0; i < bulletCount; i++) {  
        let pattern = i % 2 === 0 ? 'straight' : 'aimed'
        if (e.type === 'elite') pattern = 'spread'
        else if (e.type === 'kamikaze') pattern = 'homing'
        else if (e.type === 'stealth') pattern = 'invisible'
        else if (wave > 7) pattern = Math.random() < 0.3 ? 'wave' : pattern
        
        let bullet = {  
            x: e.x + e.w / 2 + (i - 1) * 15,  
            y: e.y + e.h,  
            speed: 3 + wave * 0.2,
            pattern: pattern,
            damage: e.type === 'elite' ? 2 : 1,
            angle: 0,
            wavePhase: 0,
            invisible: pattern === 'invisible' ? 0.3 : 1
        }  
        
        enemyBullets.push(bullet)  
    }  
}

function updateBoss() {  
    if (!boss || !bossActive) return  
    
    // Boss movement  
    if (boss.y < 50) {  
        boss.y += boss.speed  
    } else {  
        // Advanced movement patterns based on rage mode
        if (boss.rageMode) {
            // Erratic movement in rage mode
            boss.x += Math.sin(Date.now() / 200) * 4  
            boss.y += Math.cos(Date.now() / 250) * 3  
        } else if (boss.phase === 1) {  
            boss.x += Math.sin(Date.now() / 500) * 2  
        } else if (boss.phase === 2) {  
            boss.x += Math.sin(Date.now() / 300) * 3  
            boss.y += Math.cos(Date.now() / 400) * 1  
        } else {  
            boss.x += Math.sin(Date.now() / 200) * 4  
            boss.y += Math.sin(Date.now() / 250) * 2  
        }  
        boss.x = Math.max(0, Math.min(GAME_WIDTH - boss.w, boss.x))  
        boss.y = Math.max(30, Math.min(200, boss.y))  
    }  
    
    // Rage mode activation
    if (boss.hp < boss.maxHp * boss.rageThreshold && !boss.rageMode) {
        boss.rageMode = true
        boss.speed *= 1.5
        boss.attackTimer = 0
        playBossWarning()
    }
    
    // Boss attacks  
    boss.attackTimer++  
    let attackSpeed = boss.rageMode ? 30 : 60 - boss.phase * 10  
    
    if (boss.attackTimer > attackSpeed) {  
        boss.attackTimer = 0  
        boss.patternTimer++
        
        if (boss.patternTimer % 5 === 0) {
            boss.attackPattern = Math.floor(Math.random() * 4)
        }
        
        switch(boss.attackPattern) {
            case 0: // Spiral attack
                boss.angle += 0.1
                for (let i = 0; i < (boss.rageMode ? 12 : 8); i++) {
                    let angle = boss.angle + (i / 8) * Math.PI * 2
                    enemyBullets.push({
                        x: boss.x + boss.w / 2,
                        y: boss.y + boss.h / 2,
                        speed: 4,
                        vx: Math.cos(angle) * 4,
                        vy: Math.sin(angle) * 4,
                        pattern: 'spiral',
                        damage: boss.rageMode ? 2 : 1
                    })
                }
                break
                
            case 1: // Aimed burst
                for (let i = 0; i < (boss.rageMode ? 5 : 3); i++) {
                    let dx = (player.x + 20) - (boss.x + boss.w / 2)
                    let dy = (player.y + 20) - (boss.y + boss.h / 2)
                    let dist = Math.sqrt(dx * dx + dy * dy)
                    let vx = (dx / dist) * (boss.rageMode ? 5 : 4)
                    let vy = (dy / dist) * (boss.rageMode ? 5 : 4)
                    
                    enemyBullets.push({
                        x: boss.x + boss.w / 2 + (i - 1) * 20,
                        y: boss.y + boss.h / 2,
                        speed: 4,
                        vx: vx,
                        vy: vy,
                        pattern: 'aimed',
                        damage: boss.rageMode ? 2 : 1
                    })
                }
                break
                
            case 2: // Laser sweep
                laserBeams.push({
                    x: boss.x + boss.w / 2,
                    y: boss.y + boss.h / 2,
                    angle: boss.angle,
                    length: GAME_HEIGHT,
                    width: 30,
                    damage: boss.rageMode ? 3 : 2,
                    active: true,
                    life: 30
                })
                boss.angle += 0.2
                break
                
            case 3: // Mine field
                for (let i = 0; i < (boss.rageMode ? 5 : 3); i++) {
                    spawnMine(
                        boss.x + boss.w / 2 + (Math.random() - 0.5) * 100,
                        boss.y + boss.h / 2 + (Math.random() - 0.5) * 50
                    )
                }
                break
        }
        
        // Spawn minions
        if (boss.rageMode && boss.attackTimer % 3 === 0) {
            for (let i = 0; i < 2; i++) {
                let minion = {
                    x: boss.x + (Math.random() - 0.5) * 100,
                    y: boss.y + 50,
                    w: 20,
                    h: 20,
                    speed: 3,
                    hp: 2,
                    type: 'minion',
                    color: '#ff8800'
                }
                enemies.push(minion)
            }
        }
    }
    
    // Phase transition based on HP  
    if (boss.hp < boss.maxHp * 0.3) boss.phase = 3  
    else if (boss.hp < boss.maxHp * 0.6) boss.phase = 2  
    
    // Update health bar  
    let healthPercent = (boss.hp / boss.maxHp) * 100  
    document.getElementById('bossHealthFill').style.width = healthPercent + '%'  
}  

// Enhanced shooting system with level-based bullet count
function shoot() {  
    if (!gameActive || gamePaused) return  
    playShoot()  
    
    let bulletSpeed = 7 * (1 + player.skills.speed * 0.1)
    let damage = 1 * (1 + player.skills.damage * 0.2)
    
    // Calculate base bullet count based on level (1 bullet at level 1, +1 bullet every 2 levels)
    let baseBulletCount = 1 + Math.floor(player.level / 2)
    
    // Critical hit chance  
    let isCritical = Math.random() < (player.skills.critical * 0.1)
    if (isCritical) damage *= 2
    
    // Multishot skill adds additional bullets
    let multishotBonus = player.skills.multishot
    
    // Total bullet count
    let totalBulletCount = baseBulletCount + multishotBonus
    
    // Drone support
    for (let drone of player.drones) {
        if (drone.active) {
            bullets.push({
                x: drone.x,
                y: drone.y,
                speed: bulletSpeed,
                damage: damage * 0.7,
                critical: isCritical,
                fromDrone: true
            })
        }
    }
    
    // Main weapons
    if (player.powerups.laserBeam) {
        laserBeams.push({  
            x: player.x + 18,  
            y: player.y,  
            width: 30,  
            damage: damage * 2,  
            active: true,  
            life: 20,
            critical: isCritical
        })
    }
    else if (player.powerups.tripleShot) {
        // Triple shot overrides normal bullet count with 3 bullets
        for (let m = 0; m < totalBulletCount; m++) {
            bullets.push({ x: player.x + 8 + m * 5, y: player.y, speed: bulletSpeed, damage: damage, critical: isCritical })
            bullets.push({ x: player.x + 18 + m * 5, y: player.y, speed: bulletSpeed, damage: damage, critical: isCritical })
            bullets.push({ x: player.x + 28 + m * 5, y: player.y, speed: bulletSpeed, damage: damage, critical: isCritical })
        }
    }
    else if (player.powerups.spreadShot) {
        // Spread shot - 3 bullets per set
        for (let m = 0; m < totalBulletCount; m++) {
            bullets.push({ x: player.x + 18 + m * 5, y: player.y, speed: bulletSpeed, damage: damage, critical: isCritical })
            bullets.push({ x: player.x + 10 + m * 5, y: player.y + 5, speed: bulletSpeed * 0.8, damage: damage * 0.7, critical: isCritical })
            bullets.push({ x: player.x + 26 + m * 5, y: player.y + 5, speed: bulletSpeed * 0.8, damage: damage * 0.7, critical: isCritical })
        }
    } else {
        // Normal shot with bullet count based on level
        let spacing = 8 // Space between bullets
        let startX = player.x + 18 - ((totalBulletCount - 1) * spacing / 2)
        
        for (let i = 0; i < totalBulletCount; i++) {
            bullets.push({ 
                x: startX + (i * spacing), 
                y: player.y, 
                speed: bulletSpeed, 
                damage: damage, 
                critical: isCritical,
                fromLevel: player.level // Tag with level for visual effect
            })
        }
    }
    
    // Homing missiles
    if (player.powerups.homingMissile && Math.random() < 0.3) {
        missiles.push({
            x: player.x + 18,
            y: player.y,
            speed: 5,
            target: null,
            angle: 0,
            damage: damage * 2,
            critical: isCritical,
            homing: true
        })
    }
    
    // Satellite support  
    for (let s of satellites) {  
        if (s.active) {  
            s.fireTimer++
            if (s.fireTimer > 10) {
                s.fireTimer = 0
                bullets.push({  
                    x: s.x,  
                    y: s.y,  
                    speed: bulletSpeed,  
                    damage: s.damage * (1 + player.skills.damage * 0.1),  
                    critical: isCritical,
                    fromSatellite: true
                })  
            }
        }  
    }  
}  

function autoFire() {  
    if (firing && gameActive && !gamePaused) {

        let baseDelay = player.powerups.rapidFire ? 60 : 150  
        let delay = baseDelay / (1 + player.skills.fireRate * 0.2)  
        setTimeout(autoFire, delay)

}  

// Special attack

    if (!gameActive || gamePaused || player.specialMeter < player.maxSpecial) return

    updateUI()  
    
    // Choose special effect based on wave

    switch(specialType) {

            for (let e of enemies) {  
                explosions.push({ x: e.x + e.w/2, y: e.y + e.h/2, size: 5 })  
                score += 20 * wave  
                player.experience += 10

        case 2: // Time slow  
            timeSlowActive = true  
            if (timeSlowTimer) clearTimeout(timeSlowTimer)  
            timeSlowTimer = setTimeout(() => {

            }, 5000)

        case 3: // Health restore  
            player.life = Math.min(player.life + 3, player.maxLife)  
            break
            
        case 4: // Wormhole  
            spawnWormhole()  
            break
            
        case 5: // Force field

                x: player.x + 20,  
                y: player.y + 20,  
                radius: 80,  
                life: 200,  
                damage: 5  
            }  
            break
            
        case 6: // Meteor shower  
            for (let i = 0; i < 10; i++) {  
                setTimeout(() => {  
                    spawnAsteroid()  
                }, i * 100)  
            }  
            break
            
        default: // Random powerup  
            for (let i = 0; i < 3; i++) {

            }

    // Add particles  
    for (let i = 0; i < 50; i++) {  
        particles.push({

            size: Math.random() * 8 + 2,  
            color: ['#aa44ff', '#ff00ff', '#00aaff'][Math.floor(Math.random() * 3)]
