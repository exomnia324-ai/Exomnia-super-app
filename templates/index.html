
<!DOCTYPE html>  
<html>  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">  
<title>Space Shooting - ULTIMATE EDITION V3.0</title>  

<style>  
* {  
    margin: 0;  
    padding: 0;  
    box-sizing: border-box;  
    -webkit-tap-highlight-color: transparent;  
    user-select: none;  
    -webkit-user-select: none;  
}  

html, body {  
    width: 100%;  
    height: 100%;  
    overflow: hidden;  
    position: fixed;  
    background: black;  
}  

body {  
    display: flex;  
    justify-content: center;  
    align-items: center;  
    font-family: 'Arial', sans-serif;  
}  

#gameContainer {  
    position: relative;  
    width: 100%;  
    height: 100%;  
    aspect-ratio: 2 / 3;  
    background: black;  
    overflow: hidden;  
    border: 2px solid #00ffff;  
    box-shadow: 0 0 30px #00ffff, 0 0 60px #00ffff33;  
    border-radius: 10px;  
}  

canvas {  
    position: absolute;  
    top: 0;  
    left: 0;  
    width: 100% !important;  
    height: 100% !important;  
    display: block;  
    background: black;  
    z-index: 1;  
}  

#uiOverlay {  
    position: absolute;  
    top: 0;  
    left: 0;  
    width: 100%;  
    height: 100%;  
    z-index: 2;  
    pointer-events: none;  
    padding: 12px 15px;  
    display: flex;  
    flex-direction: column;  
    justify-content: space-between;  
}  

#topBar {  
    display: flex;  
    justify-content: space-between;  
    align-items: center;  
    width: 100%;  
    pointer-events: none;  
    text-shadow: 0 0 5px rgba(0,0,0,0.8);  
    font-size: clamp(14px, 4vw, 18px);  
}  

#titleText {  
    color: #0ff;  
    background: linear-gradient(90deg, #003333, #001111);  
    padding: 6px 15px;  
    border-radius: 25px;  
    border: 1px solid #0ff;  
    backdrop-filter: blur(4px);  
    font-weight: bold;  
    letter-spacing: 2px;  
    box-shadow: 0 0 15px #0ff;  
    animation: glow 2s ease-in-out infinite;  
}  

@keyframes glow {
    0%, 100% { box-shadow: 0 0 15px #0ff; }
    50% { box-shadow: 0 0 25px #0ff, 0 0 35px #0ff; }
}

#statsText {  
    color: white;  
    background: rgba(0,0,0,0.7);  
    padding: 6px 15px;  
    border-radius: 25px;  
    border: 1px solid #ffaa00;  
    backdrop-filter: blur(4px);  
    font-weight: bold;  
    display: flex;  
    gap: 20px;  
    box-shadow: 0 0 15px #ffaa00;  
}  

.life { color: #ff5555; text-shadow: 0 0 10px #ff0000; }  
.score { color: #ffff55; text-shadow: 0 0 10px #ffff00; }  

#powerups {
    position: absolute;
    top: 70px;
    left: 15px;
    display: flex;
    gap: 10px;
    pointer-events: none;
    flex-wrap: wrap;
    max-width: 200px;
}

.powerup-icon {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    animation: pulse 1s ease-in-out infinite;
    box-shadow: 0 0 15px currentColor;
}

@keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.1); opacity: 0.8; }
}

#waveInfo {
    position: absolute;
    top: 70px;
    right: 15px;
    color: #ffaa00;
    font-size: clamp(12px, 3.5vw, 16px);
    background: rgba(0,0,0,0.6);
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid #ffaa00;
    backdrop-filter: blur(4px);
    box-shadow: 0 0 15px #ffaa00;
    pointer-events: none;
}

#comboCounter {
    position: absolute;
    top: 120px;
    left: 50%;
    transform: translateX(-50%);
    color: #ffaa00;
    font-size: 24px;
    font-weight: bold;
    text-shadow: 0 0 10px #ffaa00, 0 0 20px #ff5500;
    animation: comboPop 0.5s ease-out;
    pointer-events: none;
    z-index: 5;
}

#comboMultiplier {
    position: absolute;
    top: 160px;
    left: 50%;
    transform: translateX(-50%);
    color: #ffff00;
    font-size: 18px;
    font-weight: bold;
    text-shadow: 0 0 10px #ffff00;
    pointer-events: none;
    z-index: 5;
    background: rgba(0,0,0,0.6);
    padding: 4px 12px;
    border-radius: 20px;
    white-space: nowrap;
}

@keyframes comboPop {
    0% { transform: translateX(-50%) scale(0.5); opacity: 0; }
    50% { transform: translateX(-50%) scale(1.2); opacity: 1; }
    100% { transform: translateX(-50%) scale(1); opacity: 1; }
}

#bossHealthBar {
    position: absolute;
    top: 110px;
    left: 15px;
    right: 15px;
    height: 20px;
    background: rgba(0,0,0,0.7);
    border: 2px solid #ff0000;
    border-radius: 10px;
    overflow: hidden;
    display: none;
    z-index: 5;
}

#bossHealthFill {
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, #ff0000, #ff5500);
    transition: width 0.3s ease;
}

#bossName {
    position: absolute;
    top: 85px;
    left: 50%;
    transform: translateX(-50%);
    color: #ff0000;
    font-size: 18px;
    font-weight: bold;
    text-shadow: 0 0 10px #ff0000;
    display: none;
    z-index: 5;
    white-space: nowrap;
}

#controls {  
    position: absolute;  
    bottom: 15px;  
    left: 0;  
    width: 100%;  
    display: flex;  
    justify-content: space-between;  
    align-items: flex-end;  
    padding: 0 15px 10px 15px;  
    z-index: 3;  
    pointer-events: none;  
    box-sizing: border-box;  
}  

#joystick {  
    width: min(140px, 34vw);  
    height: min(140px, 34vw);  
    max-width: 140px;  
    max-height: 140px;  
    min-width: 100px;  
    min-height: 100px;  
    background: rgba(20, 20, 40, 0.85);  
    border-radius: 50%;  
    position: relative;  
    touch-action: none;  
    pointer-events: auto;  
    backdrop-filter: blur(6px);  
    border: 2px solid rgba(0, 255, 255, 0.7);  
    box-shadow: 0 0 30px rgba(0, 255, 255, 0.6), inset 0 0 20px rgba(0, 255, 255, 0.3);  
    display: flex;  
    justify-content: center;  
    align-items: center;  
    transition: box-shadow 0.1s ease;
}  

#joystick::before {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.2), transparent 80%);
    pointer-events: none;
}

#stick {  
    width: min(60px, 15vw);  
    height: min(60px, 15vw);  
    max-width: 60px;  
    max-height: 60px;  
    min-width: 45px;  
    min-height: 45px;  
    background: radial-gradient(circle at 35% 35%, #ffffff, #aaddff, #88ccff);  
    border-radius: 50%;  
    position: absolute;  
    left: 50%;  
    top: 50%;  
    transform: translate(-50%, -50%);  
    box-shadow: 0 0 25px rgba(255, 255, 255, 0.9), 0 0 45px #0ff;  
    border: 2px solid #ffffff;  
    will-change: transform;
}  

#fire {  
    width: min(100px, 25vw);  
    height: min(100px, 25vw);  
    max-width: 100px;  
    max-height: 100px;  
    min-width: 80px;  
    min-height: 80px;  
    background: linear-gradient(145deg, #ff4444, #aa0000);  
    border-radius: 50%;  
    display: flex;  
    align-items: center;  
    justify-content: center;  
    font-size: min(26px, 6.5vw);  
    font-weight: bold;  
    color: white;  
    touch-action: none;  
    pointer-events: auto;  
    backdrop-filter: blur(4px);  
    border: 3px solid rgba(255, 200, 200, 0.8);  
    box-shadow: 0 0 30px rgba(255, 0, 0, 0.7), 0 6px 0 #550000;  
    text-transform: uppercase;  
    letter-spacing: 2px;  
    text-shadow: 0 2px 0 #550000, 0 0 10px #ffffff;  
    transition: all 0.05s ease;  
    position: relative;
    overflow: hidden;
}  

#fire::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
    animation: rotate 4s linear infinite;
}

@keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

#fire:active {  
    transform: translateY(5px);  
    box-shadow: 0 0 40px rgba(255, 0, 0, 0.9), 0 1px 0 #550000;  
}  

#specialButton {
    position: absolute;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    width: min(70px, 18vw);
    height: min(70px, 18vw);
    max-width: 70px;
    max-height: 70px;
    min-width: 55px;
    min-height: 55px;
    background: linear-gradient(145deg, #aa44ff, #5500aa);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: min(20px, 5vw);
    color: white;
    touch-action: none;
    pointer-events: auto;
    border: 3px solid rgba(255, 255, 255, 0.8);
    box-shadow: 0 0 30px #aa44ff, 0 6px 0 #330066;
    text-shadow: 0 2px 0 #330066;
    transition: all 0.05s ease;
    z-index: 4;
    font-weight: bold;
}

#specialButton:active {
    transform: translateX(-50%) translateY(5px);
    box-shadow: 0 0 40px #aa44ff, 0 1px 0 #330066;
}

#specialButton.disabled {
    opacity: 0.5;
    pointer-events: none;
}

#loading {  
    position: absolute;  
    top: 50%;  
    left: 50%;  
    transform: translate(-50%, -50%);  
    color: #0ff;  
    font-size: 24px;  
    z-index: 10;  
    background: rgba(0,0,0,0.9);  
    padding: 25px 40px;  
    border-radius: 15px;  
    border: 2px solid #0ff;  
    box-shadow: 0 0 50px #0ff;  
    animation: pulse 1.5s ease-in-out infinite;
}  

#pauseMenu {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(5px);
    z-index: 100;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 20px;
}

.pauseButton {
    padding: 15px 40px;
    font-size: 24px;
    background: linear-gradient(145deg, #0ff, #00aaff);
    border: none;
    border-radius: 50px;
    color: black;
    font-weight: bold;
    box-shadow: 0 0 30px #0ff;
    cursor: pointer;
    transition: all 0.2s ease;
    min-width: 200px;
    text-align: center;
}

.pauseButton:hover {
    transform: scale(1.1);
    box-shadow: 0 0 50px #0ff;
}

.pauseButton.red {
    background: linear-gradient(145deg, #ff4444, #aa0000);
    box-shadow: 0 0 30px #ff0000;
    color: white;
}
</style>  
</head>  
<body>  

<div id="gameContainer">  
    <canvas id="game"></canvas>  
    
    <div id="uiOverlay">  
        <div id="topBar">  
            <div id="titleText">EXOMNIA AIRCRAFT v5.0</div>  
            <div id="statsText">  
                <span class="life">❤️ <span id="lifeValue">3</span></span>  
                <span class="score">🎁 <span id="scoreValue">0</span></span>  
            </div>  
        </div>  
        
        <div id="powerups"></div>
        
        <div id="waveInfo">
            🌊 WAVE <span id="waveNumber">1</span>
        </div>
        
        <div id="comboCounter"></div>
        <div id="comboMultiplier">x1.0</div>
        
        <div id="bossHealthBar">
            <div id="bossHealthFill"></div>
        </div>
        <div id="bossName">🚀 BOSS: DESTROYER</div>
    </div>  
    
    <div id="controls">  
        <div id="joystick">  
            <div id="stick"></div>  
        </div>  
        <div id="specialButton">✨</div>
        <div id="fire">FIRE</div>  
    </div>  
    
    <div id="pauseMenu">
        <div class="pauseButton" onclick="resumeGame()">▶ RESUME</div>
        <div class="pauseButton" onclick="restartGame()">🔄 RESTART</div>
        <div class="pauseButton red" onclick="quitGame()">⏹ QUIT</div>
    </div>
</div>  
<div id="skillMenu" style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:200; flex-direction:column; justify-content:center; align-items:center; gap:15px;">
    <div style="color:#0ff; font-size:22px;">LEVEL UP! Choose Skill</div>
    <button onclick="upgradeSkill('damage')">Damage ↑</button>
    <button onclick="upgradeSkill('fireRate')">Fire Rate ↑</button>
    <button onclick="upgradeSkill('speed')">Speed ↑</button>
    <button onclick="upgradeSkill('critical')">Critical ↑</button>
</div>

<div id="achievementPopup" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#0ff; font-size:20px; display:none; z-index:300;"></div>
<div id="loading">LOADING...</div>  

<script>  
window.addEventListener('load', () => {  
    document.getElementById('loading').style.display = 'none'  
})  

const canvas = document.getElementById("game")  
const ctx = canvas.getContext("2d")  
const GAME_WIDTH = 400  
const GAME_HEIGHT = 600  

function resizeCanvas() {  
    canvas.width = GAME_WIDTH  
    canvas.height = GAME_HEIGHT  
}  
resizeCanvas()  
window.addEventListener('resize', resizeCanvas)  

// Audio init (unchanged)
let audioCtx = null  
function initAudio() {  
    if (audioCtx) return  
    try {  
        audioCtx = new (window.AudioContext || window.webkitAudioContext)()  
    } catch(e) {}  
}  

function playShoot() { if (audioCtx) { let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain(); osc.type = "square"; osc.frequency.value = 800; gain.gain.value = 0.1; osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.03); } }  
function playExplosion() { if (audioCtx) { let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain(); osc.type = "sawtooth"; osc.frequency.setValueAtTime(300, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.2); gain.gain.value = 0.15; osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.2); } }  
function playGameOver() { if (audioCtx) { let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain(); osc.type = "triangle"; osc.frequency.setValueAtTime(400, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.5); gain.gain.value = 0.2; osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.5); } }  
function playPowerup() { if (audioCtx) { let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain(); osc.type = "sine"; osc.frequency.setValueAtTime(600, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1); gain.gain.value = 0.1; osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.1); } }  
function playBossWarning() { if (audioCtx) { let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain(); osc.type = "sawtooth"; osc.frequency.setValueAtTime(200, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.5); gain.gain.value = 0.3; osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.5); } }  
function playSpecialAttack() { if (audioCtx) { let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain(); osc.type = "triangle"; osc.frequency.setValueAtTime(100, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.3); gain.gain.value = 0.2; osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.3); let osc2 = audioCtx.createOscillator(); let gain2 = audioCtx.createGain(); osc2.type = "sine"; osc2.frequency.setValueAtTime(200, audioCtx.currentTime); osc2.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.3); gain2.gain.value = 0.1; osc2.connect(gain2); gain2.connect(audioCtx.destination); osc2.start(); osc2.stop(audioCtx.currentTime + 0.3); } }  
function playLevelUp() { if (audioCtx) { let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain(); osc.type = "sine"; osc.frequency.setValueAtTime(400, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.2); osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.4); gain.gain.value = 0.2; osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.4); } }  
function playHit() { if (audioCtx) { let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain(); osc.type = "sine"; osc.frequency.value = 200; gain.gain.value = 0.05; osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.05); } }  
function playNewWave() { if (audioCtx) { let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain(); osc.type = "triangle"; osc.frequency.setValueAtTime(300, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.3); gain.gain.value = 0.2; osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.3); } }  

// ========== ENHANCED GAME STATE ==========
let player = {  
    x: 180, y: 520, w: 40, h: 40, speed: 4, life: 3, maxLife: 5,
    powerups: { rapidFire: false, spreadShot: false, shield: false, tripleShot: false, homingMissile: false, laserBeam: false, timeSlow: false, vampire: false, chainLightning: false, drone: false, phaseShift: false, reflectorShield: false, miniMissileSwarm: false },
    powerupTimers: {},
    specialMeter: 0, maxSpecial: 100,
    experience: 0, level: 1, skillPoints: 0,
    skills: { damage: 1, fireRate: 1, speed: 1, critical: 0, lifesteal: 0, multishot: 0, bulletSpeed: 1, critDamage: 0, luck: 0 },
    drones: [], phaseShiftActive: false, phaseShiftTimer: null
}  

let bullets = [], enemyBullets = [], enemies = [], explosions = [], powerups = [], stars = [], missiles = [], particles = [], laserBeams = [], blackHoles = [], satellites = [], mines = [], chainLightning = [], asteroids = [], wormholes = [], debris = [], forceField = null, reflectedBullets = []
let score = 0, joystickX = 0, joystickY = 0, firing = false, gameActive = true, gamePaused = false, wave = 1, enemiesKilled = 0, enemiesForNextWave = 10, combo = 0, comboTimeout = null, bossActive = false, boss = null, timeSlowActive = false, timeSlowTimer = null, achievements = [], highScore = localStorage.getItem('highScore') ? parseInt(localStorage.getItem('highScore')) : 0, totalKills = 0, totalPlayTime = 0, lastTimestamp = 0, screenShake = 0

function addScreenShake(amount) { screenShake = Math.min(screenShake + amount, 15); setTimeout(() => { screenShake = Math.max(0, screenShake - 1); }, 50); }

// New powerup types
const POWERUP_TYPES = {
    RAPID_FIRE: { color: '#ff00ff', symbol: '⚡', duration: 5000 },
    SPREAD_SHOT: { color: '#00ff00', symbol: '✸', duration: 5000 },
    SHIELD: { color: '#00ffff', symbol: '🛡️', duration: 5000 },
    TRIPLE_SHOT: { color: '#ffff00', symbol: '🔱', duration: 5000 },
    HOMING_MISSILE: { color: '#ff8800', symbol: '🎯', duration: 5000 },
    LASER_BEAM: { color: '#ff00aa', symbol: '⚡', duration: 4000 },
    TIME_SLOW: { color: '#00aaff', symbol: '⏱️', duration: 3000 },
    VAMPIRE: { color: '#880000', symbol: '🧛', duration: 5000 },
    CHAIN_LIGHTNING: { color: '#ffff00', symbol: '⚡⚡', duration: 5000 },
    DRONE: { color: '#00aa00', symbol: '🚁', duration: 8000 },
    PHASE_SHIFT: { color: '#aa00aa', symbol: '👻', duration: 3000 },
    REFLECTOR_SHIELD: { color: '#88aaff', symbol: '🔄', duration: 6000 },
    MINI_MISSILE_SWARM: { color: '#ff6600', symbol: '💥', duration: 0 }, // instant
    HEALTH: { color: '#ff5555', symbol: '❤️', duration: 0 },
    SPECIAL: { color: '#aa44ff', symbol: '✨', duration: 0 },
    NUKE: { color: '#ffaa00', symbol: '💣', duration: 0 },
    BLACK_HOLE: { color: '#aa00aa', symbol: '🕳️', duration: 0 },
    REPAIR: { color: '#00ff00', symbol: '🔧', duration: 0 },
    SCORE_BOOST: { color: '#ffff00', symbol: '💰', duration: 10000 }
}

// ========== COMBO MULTIPLIER SYSTEM ==========
let currentComboMultiplier = 1.0
function updateComboMultiplier() {
    if (combo >= 30) currentComboMultiplier = 2.5
    else if (combo >= 20) currentComboMultiplier = 2.0
    else if (combo >= 10) currentComboMultiplier = 1.5
    else currentComboMultiplier = 1.0
    document.getElementById('comboMultiplier').innerHTML = `x${currentComboMultiplier.toFixed(1)}`
}

function addCombo() {  
    combo++  
    if (comboTimeout) clearTimeout(comboTimeout)  
    comboTimeout = setTimeout(() => { combo = 0; updateComboMultiplier(); document.getElementById('comboCounter').innerHTML = ''; }, 2000)  
    updateComboMultiplier()
    if (combo >= 5) {  
        document.getElementById('comboCounter').innerHTML = `🔥 ${combo}x COMBO!`  
        player.specialMeter = Math.min(player.specialMeter + 5, player.maxSpecial)  
        updateUI()  
        if (combo >= 20) checkAchievement('COMBO_MASTER')
        if (combo >= 50) checkAchievement('PERFECTIONIST')
    }  
}  

// Enhanced enemy spawn: add Splitter type
function spawnEnemy() {  
    let type = 'normal'
    let rand = Math.random()
    if (rand < 0.1) type = 'elite'
    else if (rand < 0.25) type = 'fast'
    else if (rand < 0.35 && wave > 2) type = 'shielded'
    else if (rand < 0.45 && wave > 4) type = 'kamikaze'
    else if (rand < 0.55 && wave > 6) type = 'stealth'
    else if (rand < 0.65 && wave > 8) type = 'healer'

// Reflector shield handling in collision
function applyReflectorShield() {
    if (!player.powerups.reflectorShield) return
    for (let i = enemyBullets.length - 1; i >= 0; i--) {

        if (b.x > player.x && b.x < player.x + player.w && b.y > player.y && b.y < player.y + player.h) {

// Update bullet collision to include splitter logic
function bulletCollision() {  
    for (let i = bullets.length - 1; i >= 0; i--) {  
        for (let j = enemies.length - 1; j >= 0; j--) {  
            let b = bullets[i], e = enemies[j]  
            if (b.x < e.x + e.w && b.x + 4 > e.x && b.y < e.y + e.h && b.y + 10 > e.y) {  
                explosions.push({ x: e.x + e.w/2, y: e.y + e.h/2, size: 2 })  
                playHit()  
                let damage = (b.damage || 1) * (1 + player.skills.damage * 0.2)
                if (b.critical) {
    particles.push({
        x: e.x,
        y: e.y,
        vx: (Math.random()-0.5)*6,
        vy: (Math.random()-0.5)*6,
        life: 30,
        size: 6,
        color: '#ff0000'
    })
}
                if (b.critical) damage *= (1.5 + player.skills.critDamage * 0.1)
                if (e.shield > 0) e.shield -= damage
                else e.hp -= damage
                bullets.splice(i, 1)  
                if (player.powerups.vampire) player.life = Math.min(player.life + 0.3, player.maxLife)
                if (e.hp <= 0) {  
                    let basePoints = 10 * wave
                    addScore(basePoints)
                    player.experience += e.experienceValue || 10
                    totalKills++
                    for (let k = 0; k < 5; k++) debris.push({ x: e.x + e.w/2, y: e.y + e.h/2, vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5, size: Math.random() * 5 + 2, rotation: Math.random() * Math.PI * 2, rotationSpeed: (Math.random() - 0.5) * 0.2, color: e.color || '#888', life: 50 })
                    
                    
                    // SPLITTER LOGIC
                    if (e.type === 'splitter' && e.hp <= 0) {
                        for (let s = 0; s < 2; s++) {
                            enemies.push({
                                x: e.x + e.w/2 - 10 + s * 20, y: e.y, w: 15, h: 15, hp: 1, maxHp: 1,
                                speed: 2.5, type: 'mini', color: '#ff88aa', design: 8, experienceValue: 5
                            })
                        }
                    }
                    
                    if (player.experience >= player.level * 100) { player.experience -= player.level * 100; levelUp() }  
                    enemies.splice(j, 1)  
                    enemiesKilled++  
                    addCombo()  
                    if (Math.random() < 0.25 + (player.skills.luck * 0.05)) spawnPowerup()  
                    if (totalKills === 1) checkAchievement('FIRST_BLOOD')
                    if (totalKills >= 1000) checkAchievement('SHARPSHOOTER')
                    if (enemiesKilled >= enemiesForNextWave) {  
                        wave++; enemiesKilled = 0; enemiesForNextWave = 10 + wave * 2; playNewWave()
                        if (wave % 5 === 0) spawnBoss()
                        if (wave >= 10) checkAchievement('SURVIVOR')
                    }  
                }  
                updateUI(); break  
            }  
        }  
    }  
}

// Reflector bullet update
function drawReflectedBullets() {
    for (let i = reflectedBullets.length - 1; i >= 0; i--) {
        let b = reflectedBullets[i]
        b.x += b.vx * (timeSlowActive ? 0.3 : 1)
        b.y += b.vy * (timeSlowActive ? 0.3 : 1)
        ctx.fillStyle = '#88aaff'
        ctx.shadowColor = '#88aaff'
        ctx.fillRect(b.x, b.y, 4, 8)
        // hit enemies
        for (let e of enemies) {
            if (b.x < e.x + e.w && b.x + 4 > e.x && b.y < e.y + e.h && b.y + 8 > e.y) {
                e.hp -= b.damage
                explosions.push({ x: b.x, y: b.y, size: 2 })
                reflectedBullets.splice(i, 1)
                break
            }
        }
        if (b.y > GAME_HEIGHT + 20) reflectedBullets.splice(i, 1)
    }
}

function shoot() {  
    if (!gameActive || gamePaused) return  
    playShoot()  
    let bulletSpeed = 7 * (1 + player.skills.bulletSpeed * 0.1)
    let damage = 1 * (1 + player.skills.damage * 0.2)
    let isCritical = Math.random() < (player.skills.critical * 0.1)
    if (isCritical) damage *= (1.5 + player.skills.critDamage * 0.1)
    let totalBulletCount = 1 + Math.floor(player.level / 2) + player.skills.multishot
    for (let drone of player.drones) if (drone.active) bullets.push({ x: drone.x, y: drone.y, speed: bulletSpeed, damage: damage * 0.7, critical: isCritical, fromDrone: true })
    if (player.powerups.laserBeam) laserBeams.push({ x: player.x + 18, y: player.y, width: 30, damage: damage * 2, active: true, life: 20, critical: isCritical })
    else if (player.powerups.tripleShot) for (let m = 0; m < totalBulletCount; m++) for (let off = 0; off < 3; off++) bullets.push({ x: player.x + 8 + m * 5 + off * 10, y: player.y, speed: bulletSpeed, damage: damage, critical: isCritical })
    else if (player.powerups.spreadShot) for (let m = 0; m < totalBulletCount; m++) { bullets.push({ x: player.x + 18 + m * 5, y: player.y, speed: bulletSpeed, damage: damage, critical: isCritical }); bullets.push({ x: player.x + 10 + m * 5, y: player.y + 5, speed: bulletSpeed * 0.8, damage: damage * 0.7, critical: isCritical }); bullets.push({ x: player.x + 26 + m * 5, y: player.y + 5, speed: bulletSpeed * 0.8, damage: damage * 0.7, critical: isCritical }) }
    else { let spacing = 8, startX = player.x + 18 - ((totalBulletCount - 1) * spacing / 2); for (let i = 0; i < totalBulletCount; i++) bullets.push({ x: startX + (i * spacing), y: player.y, speed: bulletSpeed, damage: damage, critical: isCritical, fromLevel: player.level }) }
    if (player.powerups.homingMissile && Math.random() < 0.3) missiles.push({ x: player.x + 18, y: player.y, speed: 5, target: null, angle: 0, damage: damage * 2, critical: isCritical, homing: true })
    for (let s of satellites) if (s.active) { s.fireTimer++; if (s.fireTimer > 10) { s.fireTimer = 0; bullets.push({ x: s.x, y: s.y, speed: bulletSpeed, damage: s.damage * (1 + player.skills.damage * 0.1), critical: isCritical, fromSatellite: true }) } }
}

// Powerup collection extended
function powerupCollision() {  
    for (let i = powerups.length - 1; i >= 0; i--) {  
        let p = powerups[i]  
        if (p.x > player.x - 15 && p.x < player.x + player.w + 15 && p.y > player.y - 15 && p.y < player.y + player.h + 15) {  
            playPowerup()
            if (p.type === 'HEALTH') { if (player.life < player.maxLife) player.life++ }
            else if (p.type === 'REPAIR') player.life = Math.min(player.life + 2, player.maxLife)
            else if (p.type === 'SPECIAL') player.specialMeter = Math.min(player.specialMeter + 30, player.maxSpecial)
            else if (p.type === 'NUKE') { for (let e of enemies) { explosions.push({ x: e.x + e.w/2, y: e.y + e.h/2, size: 5 }); addScore(20 * wave) } enemies = []; enemyBullets = [] }
            else if (p.type === 'BLACK_HOLE') spawnBlackHole(player.x + 20, player.y - 50)
            else if (p.type === 'MINI_MISSILE_SWARM') { activateMiniMissileSwarm(); player.powerups.miniMissileSwarm = true; setTimeout(() => { player.powerups.miniMissileSwarm = false }, 100) }
            else { let key = p.type.toLowerCase(); player.powerups[key] = true; if (key === 'drone') player.drones.push({ x: 0, y: 0, active: true }); if (POWERUP_TYPES[p.type].duration > 0) { clearTimeout(player.powerupTimers[key]); player.powerupTimers[key] = setTimeout(() => { player.powerups[key] = false; if (key === 'drone') player.drones = []; updateUI() }, POWERUP_TYPES[p.type].duration) } }
            powerups.splice(i, 1); updateUI()
        }  
    }  
}

// Screen shake in drawing

// Modified gameLoop to include new draw calls
function gameLoop(timestamp) {  
    if (!gameActive) return  
    if (lastTimestamp === 0) lastTimestamp = timestamp
    let deltaTime = timestamp - lastTimestamp; lastTimestamp = timestamp
    if (!gamePaused) totalPlayTime += deltaTime
    ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT)
    drawWithShake()
    drawStars(); drawAsteroids(); drawWormholes(); drawForceField()
    if (!gamePaused) { updatePlayer(); if (bossActive) updateBoss() }
    drawPlayer(); drawBullets(); drawChainLightning(); drawMissiles(); drawLaserBeams(); drawEnemyBullets(); drawReflectedBullets()
    drawEnemies(); drawBoss(); drawPowerups(); drawBlackHoles(); drawMines(); drawExplosions(); drawParticles(); drawDebris()
    drawSpecialMeter(); drawExperienceBar(); drawSkillPoints()
    if (!gamePaused) { bulletCollision(); missileCollision(); laserCollision(); mineCollision(); bossCollision(); bulletVsBullet(); shipCollision(); playerBulletCollision(); powerupCollision(); asteroidCollision(); applyReflectorShield() }
    ctx.setTransform(1, 0, 0, 1, 0, 0)
    if (screenShake > 0) screenShake = Math.max(0, screenShake - 0.5)
    requestAnimationFrame(gameLoop)  
}

// Joystick and control setup (unchanged from original, just keep same)
const joystick = document.getElementById("joystick"), stick = document.getElementById("stick"), fire = document.getElementById("fire"), specialBtn = document.getElementById("specialButton")
let joystickActive = false
function getJoystickMaxRadius() { let rect = joystick.getBoundingClientRect(); return (rect.width / 2) - (stick.offsetWidth / 2) }
function handleJoystickMove(clientX, clientY) {  
    let rect = joystick.getBoundingClientRect(), centerX = rect.left + rect.width / 2, centerY = rect.top + rect.height / 2, maxRadius = getJoystickMaxRadius()
    let dx = clientX - centerX, dy = clientY - centerY, distance = Math.sqrt(dx * dx + dy * dy)
    if (distance > maxRadius) { dx = dx * maxRadius / distance; dy = dy * maxRadius / distance }
    joystickX = dx / maxRadius; joystickY = dy / maxRadius
    stick.style.left = (rect.width / 2 + dx - stick.offsetWidth / 2) + "px"; stick.style.top = (rect.height / 2 + dy - stick.offsetHeight / 2) + "px"; stick.style.transform = "none"
}  
function handleJoystickEnd() { joystickActive = false; joystickX = 0; joystickY = 0; stick.style.left = "50%"; stick.style.top = "50%"; stick.style.transform = "translate(-50%, -50%)" }
joystick.addEventListener("touchstart", (e) => { e.preventDefault(); initAudio(); joystickActive = true; handleJoystickMove(e.touches[0].clientX, e.touches[0].clientY) })
joystick.addEventListener("touchmove", (e) => { e.preventDefault(); if (joystickActive) handleJoystickMove(e.touches[0].clientX, e.touches[0].clientY) })
joystick.addEventListener("touchend", (e) => { e.preventDefault(); handleJoystickEnd() })
joystick.addEventListener("touchcancel", (e) => { e.preventDefault(); handleJoystickEnd() })
joystick.addEventListener("mousedown", (e) => { e.preventDefault(); initAudio(); joystickActive = true; handleJoystickMove(e.clientX, e.clientY); function onMouseMove(e) { if (joystickActive) handleJoystickMove(e.clientX, e.clientY) }; function onMouseUp(e) { handleJoystickEnd(); document.removeEventListener("mousemove", onMouseMove); document.removeEventListener("mouseup", onMouseUp) }; document.addEventListener("mousemove", onMouseMove); document.addEventListener("mouseup", onMouseUp) })

function updateBoss() { if (!boss || !bossActive) return; if (boss.y < 50) boss.y += boss.speed; else { if (boss.rageMode) { boss.x += Math.sin(Date.now() / 200) * 4; boss.y += Math.cos(Date.now() / 250) * 3 } else if (boss.phase === 1) boss.x += Math.sin(Date.now() / 500) * 2; else if (boss.phase === 2) { boss.x += Math.sin(Date.now() / 300) * 3; boss.y += Math.cos(Date.now() / 400) * 1 } else { boss.x += Math.sin(Date.now() / 200) * 4; boss.y += Math.sin(Date.now() / 250) * 2 } boss.x = Math.max(0, Math.min(GAME_WIDTH - boss.w, boss.x)); boss.y = Math.max(30, Math.min(200, boss.y)) } if (boss.hp < boss.maxHp * boss.rageThreshold && !boss.rageMode) { boss.rageMode = true; boss.speed *= 1.5; boss.attackTimer = 0; playBossWarning() } boss.attackTimer++; let attackSpeed = boss.rageMode ? 30 : 60 - boss.phase * 10; if (boss.attackTimer > attackSpeed) { boss.attackTimer = 0; boss.patternTimer++; if (boss.patternTimer % 5 === 0) boss.attackPattern = Math.floor(Math.random() * 4); switch(boss.attackPattern) { case 0: boss.angle += 0.1; for (let i = 0; i < (boss.rageMode ? 12 : 8); i++) { let angle = boss.angle + (i / 8) * Math.PI * 2; enemyBullets.push({ x: boss.x + boss.w / 2, y: boss.y + boss.h / 2, speed: 4, vx: Math.cos(angle) * 4, vy: Math.sin(angle) * 4, pattern: 'spiral', damage: boss.rageMode ? 2 : 1 }) } break; case 1: for (let i = 0; i < (boss.rageMode ? 5 : 3); i++) { let dx = (player.x + 20) - (boss.x + boss.w / 2), dy = (player.y + 20) - (boss.y + boss.h / 2), dist = Math.sqrt(dx * dx + dy * dy), vx = (dx / dist) * (boss.rageMode ? 5 : 4), vy = (dy / dist) * (boss.rageMode ? 5 : 4); enemyBullets.push({ x: boss.x + boss.w / 2 + (i - 1) * 20, y: boss.y + boss.h / 2, speed: 4, vx, vy, pattern: 'aimed', damage: boss.rageMode ? 2 : 1 }) } break; case 2: laserBeams.push({ x: boss.x + boss.w / 2, y: boss.y + boss.h / 2, angle: boss.angle, length: GAME_HEIGHT, width: 30, damage: boss.rageMode ? 3 : 2, active: true, life: 30 }); boss.angle += 0.2; break; case 3: for (let i = 0; i < (boss.rageMode ? 5 : 3); i++) spawnMine(boss.x + boss.w / 2 + (Math.random() - 0.5) * 100, boss.y + boss.h / 2 + (Math.random() - 0.5) * 50); break } if (boss.rageMode && boss.attackTimer % 3 === 0) for (let i = 0; i < 2; i++) enemies.push({ x: boss.x + (Math.random() - 0.5) * 100, y: boss.y + 50, w: 20, h: 20, speed: 3, hp: 2, type: 'minion', color: '#ff8800' }) } if (boss.hp < boss.maxHp * 0.3) boss.phase = 3; else if (boss.hp < boss.maxHp * 0.6) boss.phase = 2; document.getElementById('bossHealthFill').style.width = (boss.hp / boss.maxHp) * 100 + '%' }

function updateUI() {  
    document.getElementById('lifeValue').textContent = player.life  
    document.getElementById('scoreValue').textContent = score  
    document.getElementById('waveNumber').textContent = wave  
    if (score > highScore) { highScore = score; localStorage.setItem('highScore', highScore.toString()) }  
    let powerupDiv = document.getElementById('powerups'); powerupDiv.innerHTML = ''  
    for (let [key, active] of Object.entries(player.powerups)) if (active && POWERUP_TYPES[key.toUpperCase()]) { let icon = document.createElement('div'); icon.className = 'powerup-icon'; icon.style.background = POWERUP_TYPES[key.toUpperCase()].color; icon.textContent = POWERUP_TYPES[key.toUpperCase()].symbol; powerupDiv.appendChild(icon) }  
    let specialBtn = document.getElementById('specialButton'); if (player.specialMeter >= player.maxSpecial) specialBtn.classList.remove('disabled'); else specialBtn.classList.add('disabled')  
}

const ACHIEVEMENTS = { FIRST_BLOOD: { name: 'First Blood', reward: 100 }, COMBO_MASTER: { name: 'Combo Master', reward: 500 }, BOSS_SLAYER: { name: 'Boss Slayer', reward: 1000 }, SURVIVOR: { name: 'Survivor', reward: 2000 }, COLLECTOR: { name: 'Collector', reward: 1000 }, SHARPSHOOTER: { name: 'Sharpshooter', reward: 5000 }, INVINCIBLE: { name: 'Invincible', reward: 3000 }, VETERAN: { name: 'Veteran', reward: 4000 }, PERFECTIONIST: { name: 'Perfectionist', reward: 10000 } }

function drawBoss() { if (!boss) return; ctx.save(); ctx.translate(boss.x + boss.w/2, boss.y + boss.h/2); ctx.rotate(Date.now() / 1000); if (boss.rageMode) ctx.shadowBlur = 50; ctx.fillStyle = boss.rageMode ? '#ff8800' : '#ff0000'; ctx.shadowColor = boss.rageMode ? '#ff8800' : '#ff0000'; ctx.beginPath(); ctx.moveTo(0, -50); ctx.lineTo(40, 30); ctx.lineTo(20, 50); ctx.lineTo(-20, 50); ctx.lineTo(-40, 30); ctx.closePath(); ctx.fill(); ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(-15, -20, 8, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(15, -20, 8, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = boss.rageMode ? 'red' : 'black'; ctx.beginPath(); ctx.arc(-15 + (boss.phase === 3 ? 2 : 0), -20, 4, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(15 + (boss.phase === 3 ? -2 : 0), -20, 4, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#fff'; ctx.font = '14px Arial'; ctx.fillText(`PHASE ${boss.phase}${boss.rageMode ? ' RAGE' : ''}`, -35, -70); ctx.restore() }

function drawBlackHoles() { for (let i = blackHoles.length - 1; i >= 0; i--) { let bh = blackHoles[i]; bh.life--; bh.radius = Math.min(bh.radius + 0.3, bh.maxRadius); bh.damageTimer++; ctx.save(); ctx.translate(bh.x, bh.y); let gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, bh.radius); gradient.addColorStop(0, 'black'); gradient.addColorStop(0.5, '#aa00aa'); gradient.addColorStop(1, 'transparent'); ctx.fillStyle = gradient; ctx.beginPath(); ctx.arc(0, 0, bh.radius, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = '#ff00ff'; ctx.lineWidth = 2; ctx.setLineDash([10, 10]); ctx.beginPath(); ctx.arc(0, 0, bh.radius * 0.8, 0, Math.PI * 2); ctx.stroke(); for (let j = 0; j < 5; j++) { let angle = (j / 5) * Math.PI * 2 + Date.now() / 300, dist = bh.radius * 0.7 + Math.sin(Date.now() / 100 + j) * 10, x = Math.cos(angle) * dist, y = Math.sin(angle) * dist; ctx.fillStyle = '#ffffff'; ctx.globalAlpha = 0.5; ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI * 2); ctx.fill() } ctx.restore(); for (let e of enemies) { let dx = e.x + e.w/2 - bh.x, dy = e.y + e.h/2 - bh.y, dist = Math.sqrt(dx * dx + dy * dy); if (dist < bh.radius * 2) { e.x += (dx / dist) * bh.pullSpeed; e.y += (dy / dist) * bh.pullSpeed; if (dist < bh.radius && bh.damageTimer > 10) { e.hp -= bh.damage; explosions.push({ x: e.x + e.w/2, y: e.y + e.h/2, size: 2 }); bh.damageTimer = 0 } } } if (!player.powerups.phaseShift && !player.phaseShiftActive) { let dx = player.x + 20 - bh.x, dy = player.y + 20 - bh.y, dist = Math.sqrt(dx * dx + dy * dy); if (dist < bh.radius * 2) { player.x += (dx / dist) * bh.pullSpeed; player.y += (dy / dist) * bh.pullSpeed } } if (bh.life <= 0) blackHoles.splice(i, 1) } ctx.globalAlpha = 1; ctx.setLineDash([]) }
function drawMines() { for (let i = mines.length - 1; i >= 0; i--) { let m = mines[i]; m.y += 1 * (timeSlowActive ? 0.3 : 1); m.armTime--; ctx.save(); ctx.translate(m.x, m.y); if (m.armTime <= 0) { ctx.strokeStyle = '#ff0000'; ctx.lineWidth = 1; ctx.setLineDash([5, 5]); ctx.beginPath(); ctx.arc(0, 0, m.proximityRadius, 0, Math.PI * 2); ctx.stroke() } ctx.fillStyle = m.armTime > 0 ? '#ffaa00' : '#ff0000'; ctx.shadowColor = m.armTime > 0 ? '#ffaa00' : '#ff0000'; ctx.beginPath(); ctx.arc(0, 0, m.radius, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#ffff00'; ctx.font = '12px Arial'; ctx.fillText('💣', -8, 4); ctx.restore(); if (m.y > GAME_HEIGHT + 20) mines.splice(i, 1) } ctx.setLineDash([]) }

function drawSpecialMeter() { let meterX = 10, meterY = 160, meterWidth = 100, meterHeight = 10; ctx.fillStyle = '#333'; ctx.fillRect(meterX, meterY, meterWidth, meterHeight); if (player.specialMeter >= player.maxSpecial) { ctx.fillStyle = '#aa44ff'; ctx.shadowBlur = 10 + Math.sin(Date.now() / 200) * 5 } else ctx.fillStyle = '#aa44ff'; ctx.fillRect(meterX, meterY, (player.specialMeter / player.maxSpecial) * meterWidth, meterHeight); ctx.strokeStyle = '#fff'; ctx.strokeRect(meterX, meterY, meterWidth, meterHeight); ctx.fillStyle = '#fff'; ctx.font = '10px Arial'; ctx.fillText('SPECIAL', meterX, meterY - 2); ctx.shadowBlur = 0 }

function drawSkillPoints() { if (player.skillPoints > 0) { ctx.fillStyle = '#ffff00'; ctx.font = 'bold 16px Arial'; ctx.fillText(`✨ ${player.skillPoints}`, 10, 190) } ctx.shadowBlur = 0 }
function updatePlayer() { let moveSpeed = player.speed * (1 + player.skills.speed * 0.1); if (timeSlowActive) moveSpeed *= 0.5; player.x += joystickX * moveSpeed; player.y += joystickY * moveSpeed; player.x = Math.max(0, Math.min(GAME_WIDTH - player.w, player.x)); player.y = Math.max(0, Math.min(GAME_HEIGHT - player.h, player.y)); player.specialMeter = Math.min(player.specialMeter + 0.1, player.maxSpecial); if (player.phaseShiftActive) { player.phaseShiftTimer--; if (player.phaseShiftTimer <= 0) player.phaseShiftActive = false } }
function bulletVsBullet() { for (let i = bullets.length - 1; i >= 0; i--) for (let j = enemyBullets.length - 1; j >= 0; j--) if (bullets[i] && enemyBullets[j] && bullets[i].x < enemyBullets[j].x + 4 && bullets[i].x + 4 > enemyBullets[j].x && bullets[i].y < enemyBullets[j].y + 10 && bullets[i].y + 10 > enemyBullets[j].y) { explosions.push({ x: bullets[i].x, y: bullets[i].y, size: 2 }); bullets.splice(i, 1); enemyBullets.splice(j, 1); break } }

function missileCollision() { for (let i = missiles.length - 1; i >= 0; i--) for (let j = enemies.length - 1; j >= 0; j--) if (missiles[i].x < enemies[j].x + enemies[j].w && missiles[i].x + 4 > enemies[j].x && missiles[i].y < enemies[j].y + enemies[j].h && missiles[i].y + 10 > enemies[j].y) { explosions.push({ x: enemies[j].x + enemies[j].w/2, y: enemies[j].y + enemies[j].h/2, size: 5 }); let damage = missiles[i].damage || 2; if (enemies[j].shield > 0) enemies[j].shield -= damage; else enemies[j].hp -= damage; missiles.splice(i, 1); if (enemies[j].hp <= 0) { addScore(15 * wave); player.experience += 15; enemies.splice(j, 1); enemiesKilled++; addCombo() } updateUI(); break } }
function laserCollision() { for (let i = laserBeams.length - 1; i >= 0; i--) for (let j = enemies.length - 1; j >= 0; j--) if (laserBeams[i].y < enemies[j].y + enemies[j].h && laserBeams[i].y > enemies[j].y && Math.abs(laserBeams[i].x - (enemies[j].x + enemies[j].w/2)) < laserBeams[i].width/2) { explosions.push({ x: enemies[j].x + enemies[j].w/2, y: enemies[j].y + enemies[j].h/2, size: 3 }); if (enemies[j].shield > 0) enemies[j].shield -= laserBeams[i].damage; else enemies[j].hp -= laserBeams[i].damage; if (enemies[j].hp <= 0) { addScore(10 * wave); player.experience += 10; enemies.splice(j, 1); enemiesKilled++; addCombo() } } }
function mineCollision() { for (let i = mines.length - 1; i >= 0; i--) { let m = mines[i]; if (m.armTime > 0) continue; for (let j = enemies.length - 1; j >= 0; j--) { let e = enemies[j]; let dx = m.x - (e.x + e.w/2), dy = m.y - (e.y + e.h/2), dist = Math.sqrt(dx * dx + dy * dy); if (dist < m.radius + e.w/2 || dist < m.proximityRadius) { explosions.push({ x: m.x, y: m.y, size: 10 }); playExplosion(); if (e.shield > 0) e.shield -= m.damage; else e.hp -= m.damage; mines.splice(i, 1); if (e.hp <= 0) { addScore(15 * wave); enemies.splice(j, 1); enemiesKilled++; addCombo() } break } } if (!player.powerups.phaseShift && !player.phaseShiftActive) { let dx = m.x - (player.x + 20), dy = m.y - (player.y + 20), dist = Math.sqrt(dx * dx + dy * dy); if (dist < m.radius + 15 || dist < m.proximityRadius) { explosions.push({ x: player.x + 20, y: player.y + 20, size: 5 }); if (player.powerups.shield) { player.powerups.shield = false; clearTimeout(player.powerupTimers.shield) } else player.life -= m.damage; mines.splice(i, 1); updateUI(); if (player.life <= 0) { gameActive = false; playGameOver(); setTimeout(() => { alert(`💀 GAME OVER\n\nFinal Score: ${score}\nWaves: ${wave}\nKills: ${totalKills}\nLevel: ${player.level}\nHigh Score: ${highScore}\n\n✨ Play Again?`); location.reload() }, 500) } } } } }
function bossCollision() { if (!boss || !bossActive) return; for (let i = bullets.length - 1; i >= 0; i--) if (bullets[i].x < boss.x + boss.w && bullets[i].x + 4 > boss.x && bullets[i].y < boss.y + boss.h && bullets[i].y + 10 > boss.y) { explosions.push({ x: bullets[i].x, y: bullets[i].y, size: 3 }); boss.hp -= bullets[i].damage || 1; bullets.splice(i, 1); player.specialMeter = Math.min(player.specialMeter + 2, player.maxSpecial); player.experience += 5; if (boss.hp <= 0) { explosions.push({ x: boss.x + boss.w/2, y: boss.y + boss.h/2, size: 20 }); playExplosion(); addScore(500 * wave); player.experience += 200; bossActive = false; boss = null; document.getElementById('bossHealthBar').style.display = 'none'; document.getElementById('bossName').style.display = 'none'; for (let i = 0; i < 5; i++) spawnPowerup(); checkAchievement('BOSS_SLAYER') } updateUI(); break } for (let i = missiles.length - 1; i >= 0; i--) if (missiles[i].x < boss.x + boss.w && missiles[i].x + 4 > boss.x && missiles[i].y < boss.y + boss.h && missiles[i].y + 10 > boss.y) { explosions.push({ x: missiles[i].x, y: missiles[i].y, size: 5 }); boss.hp -= missiles[i].damage || 2; missiles.splice(i, 1); player.specialMeter += 3 } if (!player.powerups.phaseShift && !player.phaseShiftActive && player.x < boss.x + boss.w && player.x + player.w > boss.x && player.y < boss.y + boss.h && player.y + player.h > boss.y) { explosions.push({ x: player.x + 20, y: player.y + 20, size: 10 }); if (player.powerups.shield) { player.powerups.shield = false; clearTimeout(player.powerupTimers.shield) } else player.life -= boss.rageMode ? 3 : 2; updateUI(); if (player.life <= 0) { gameActive = false; playGameOver(); setTimeout(() => { alert(`💀 GAME OVER\n\nFinal Score: ${score}\nWaves: ${wave}\nKills: ${totalKills}\nLevel: ${player.level}\nHigh Score: ${highScore}\n\n✨ Play Again?`); location.reload() }, 500) } } }
function asteroidCollision() { for (let i = asteroids.length - 1; i >= 0; i--) { let a = asteroids[i]; for (let j = bullets.length - 1; j >= 0; j--) { let b = bullets[j]; let dx = b.x - a.x, dy = b.y - a.y; if (Math.sqrt(dx * dx + dy * dy) < a.radius) { a.health -= b.damage || 1; bullets.splice(j, 1); explosions.push({ x: b.x, y: b.y, size: 2 }); if (a.health <= 0) { for (let k = 0; k < 5; k++) debris.push({ x: a.x, y: a.y, vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5, size: a.radius / 3, rotation: Math.random() * Math.PI * 2, rotationSpeed: (Math.random() - 0.5) * 0.2, color: '#886644', life: 50 }); asteroids.splice(i, 1); addScore(5) } break } } if (!player.powerups.phaseShift && !player.phaseShiftActive) { let dx = player.x + 20 - a.x, dy = player.y + 20 - a.y; if (Math.sqrt(dx * dx + dy * dy) < a.radius + 20) { explosions.push({ x: player.x + 20, y: player.y + 20, size: 5 }); if (player.powerups.shield) { player.powerups.shield = false; clearTimeout(player.powerupTimers.shield) } else player.life--; asteroids.splice(i, 1); updateUI(); if (player.life <= 0) { gameActive = false; playGameOver(); setTimeout(() => { alert(`💀 GAME OVER\n\nFinal Score: ${score}\nWaves: ${wave}\nKills: ${totalKills}\nLevel: ${player.level}\nHigh Score: ${highScore}\n\n✨ Play Again?`); location.reload() }, 500) } } } } }
function drawReflectedBullets() { for (let i = reflectedBullets.length - 1; i >= 0; i--) { let b = reflectedBullets[i]; b.x += b.vx * (timeSlowActive ? 0.3 : 1); b.y += b.vy * (timeSlowActive ? 0.3 : 1); ctx.fillStyle = '#88aaff'; ctx.shadowColor = '#88aaff'; ctx.fillRect(b.x, b.y, 4, 8); for (let e of enemies) { if (b.x < e.x + e.w && b.x + 4 > e.x && b.y < e.y + e.h && b.y + 8 > e.y) { e.hp -= b.damage; explosions.push({ x: b.x, y: b.y, size: 2 }); reflectedBullets.splice(i, 1); break } } if (b.y > GAME_HEIGHT + 20) reflectedBullets.splice(i, 1) } }
function applyReflectorShield() { if (!player.powerups.reflectorShield) return; for (let i = enemyBullets.length - 1; i >= 0; i--) { let b = enemyBullets[i]; if (b.x > player.x && b.x < player.x + player.w && b.y > player.y && b.y < player.y + player.h) { enemyBullets.splice(i, 1); reflectedBullets.push({ x: b.x, y: b.y, vx: -b.vx || 0, vy: -b.speed || -3, damage: b.damage || 1 }); playHit() } } }

function levelUp() {
    player.level++
    player.skillPoints++
    gamePaused = true
    document.getElementById('skillMenu').style.display = 'flex'
}

function upgradeSkill(skill) {
    player.skills[skill]++
    player.skillPoints--
    document.getElementById('skillMenu').style.display = 'none'
    gamePaused = false
    playLevelUp()
    updateUI()
}

let dashCooldown = 0

function dash() {
    if (dashCooldown > 0) return
    player.x += joystickX * 80
    player.y += joystickY * 80
    dashCooldown = 60
    addScreenShake(5)
}

setInterval(() => {
    if (dashCooldown > 0) dashCooldown--
}, 16)

function showAchievement(text) {
    let el = document.getElementById('achievementPopup')
    el.innerText = "🏆 " + text
    el.style.display = 'block'
    setTimeout(() => el.style.display = 'none', 2000)
}
