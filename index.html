<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Space Shooting</title>

<style>

body{
margin:0;
background:black;
overflow:hidden;
font-family:Arial;
}

#title{
position:absolute;
top:5px;
width:100%;
text-align:center;
color:#0E4950;
font-size:18px;
font-weight:bold;
z-index:10;
}

#score{
position:absolute;
top:30px;
left:10px;
color:white;
font-size:18px;
}

canvas{
display:block;
}

#controls{
position:absolute;
bottom:20px;
width:100%;
display:flex;
justify-content:space-between;
padding:0 30px;
}

.btn{
width:70px;
height:70px;
border-radius:50%;
background:#222;
color:white;
font-size:30px;
display:flex;
align-items:center;
justify-content:center;
user-select:none;
}

#fire{
background:red;
}

</style>
</head>

<body>

<div id="title">Space Shooting — Developed by Exomnia Team</div>
<div id="score">Score: 0</div>

<canvas id="game"></canvas>

<div id="controls">
<div class="btn" id="left">◀</div>
<div class="btn" id="fire">FIRE</div>
<div class="btn" id="right">▶</div>
</div>

<script>

const canvas = document.getElementById("game")
const ctx = canvas.getContext("2d")

canvas.width = window.innerWidth
canvas.height = window.innerHeight

let player={
x:canvas.width/2,
y:canvas.height-80,
size:30
}

let bullets=[]
let enemies=[]
let score=0
let firing=false

function drawPlayer(){
ctx.fillStyle="cyan"
ctx.beginPath()
ctx.moveTo(player.x,player.y)
ctx.lineTo(player.x-player.size,player.y+player.size)
ctx.lineTo(player.x+player.size,player.y+player.size)
ctx.fill()
}

function shoot(){
bullets.push({
x:player.x,
y:player.y,
speed:8
})
}

function spawnEnemy(){
enemies.push({
x:Math.random()*canvas.width,
y:-20,
size:25,
speed:2+Math.random()*2
})
}

setInterval(spawnEnemy,1200)

function update(){

ctx.clearRect(0,0,canvas.width,canvas.height)

drawPlayer()

if(firing){
shoot()
}

bullets.forEach((b,i)=>{
b.y-=b.speed
ctx.fillStyle="yellow"
ctx.fillRect(b.x-2,b.y,4,10)

if(b.y<0) bullets.splice(i,1)
})

enemies.forEach((e,ei)=>{
e.y+=e.speed

ctx.fillStyle="red"
ctx.beginPath()
ctx.arc(e.x,e.y,e.size,0,Math.PI*2)
ctx.fill()

bullets.forEach((b,bi)=>{
let dx=b.x-e.x
let dy=b.y-e.y
let dist=Math.sqrt(dx*dx+dy*dy)

if(dist<e.size){
enemies.splice(ei,1)
bullets.splice(bi,1)
score++
document.getElementById("score").innerText="Score: "+score
}
})

if(e.y>canvas.height){
enemies.splice(ei,1)
}

})

requestAnimationFrame(update)

}

update()

document.getElementById("left").ontouchstart=()=>{
player.x-=40
}

document.getElementById("right").ontouchstart=()=>{
player.x+=40
}

const fireBtn=document.getElementById("fire")

fireBtn.ontouchstart=()=>{
firing=true
}

fireBtn.ontouchend=()=>{
firing=false
}

fireBtn.onclick=()=>{
shoot()
}

</script>

</body>
</html>
